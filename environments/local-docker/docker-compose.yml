# FRANK Platform - Local Docker Environment
#
# Multi-stage development stack with service profiles:
#   - Stage 1: SQLite + FastAPI (minimal)
#   - Stage 2: PostgreSQL + DynamoDB (LocalStack) + FastAPI
#   - Stage 3: Full stack with Mock Cognito + Web GUI + Admin API
#
# Usage:
#   # Stage 1 (SQLite only)
#   docker compose --profile stage1 up -d
#
#   # Stage 2 (PostgreSQL + DynamoDB)
#   docker compose --profile stage2 up -d
#
#   # Stage 3 (Full stack)
#   docker compose --profile stage3 up -d
#
#   # Or use Makefile:
#   make up              # Starts all services
#   make logs            # View all logs
#   make down            # Stop all services
#
# Access points:
#   - Web GUI:        http://localhost:3000 (Stage 3 only)
#   - Management API: http://localhost:8001
#   - Mock Cognito:   http://localhost:8100 (Stage 3 only)
#   - PostgreSQL:     localhost:5432 (Stages 2-3)
#   - LocalStack:     http://localhost:4566 (Stages 2-3)
#   - DynamoDB Admin: http://localhost:8101 (Stages 2-3)
#
# Copyright (c) 2025 Schuberg Philis B.V.
# SPDX-License-Identifier: Apache-2.0

services:
  #
  # PostgreSQL - Required for Stages 2 and 3
  #
  postgres:
    image: postgres:16-alpine
    container_name: frank-postgres
    profiles: ["stage2", "stage3"]
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-frank_management}
      - POSTGRES_USER=${POSTGRES_USER:-frank}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-frank_dev}
      - POSTGRES_HOST_AUTH_METHOD=md5
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frank -d frank_management"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - frank-net

  #
  # LocalStack - DynamoDB emulation for Stages 2 and 3
  #
  localstack:
    image: localstack/localstack:latest
    container_name: frank-localstack
    profiles: ["stage2", "stage3"]
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    environment:
      - SERVICES=dynamodb
      - DEBUG=${LOCALSTACK_DEBUG:-0}
      - AWS_DEFAULT_REGION=${AWS_REGION:-eu-west-1}
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - localstack-data:/var/lib/localstack
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - frank-net

  #
  # DynamoDB Admin UI - For Stages 2 and 3
  #
  dynamodb-admin:
    image: aaronshaf/dynamodb-admin:latest
    container_name: frank-dynamodb-admin
    profiles: ["stage2", "stage3"]
    ports:
      - "${DYNAMODB_ADMIN_PORT:-8101}:8001"
    environment:
      - DYNAMO_ENDPOINT=http://localstack:4566
      - AWS_REGION=${AWS_REGION:-eu-west-1}
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    depends_on:
      localstack:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - frank-net

  #
  # Mock Cognito - Authentication stub for Stage 3
  #
  mock-cognito:
    build:
      context: ../..
      dockerfile: tests/stubs/cognito/Dockerfile.stub_cognito
      args:
        BUILD_CONTEXT: tests/stubs/cognito
        PACKAGE_CONTEXT: .
    container_name: frank-mock-cognito
    profiles: ["stage3"]
    ports:
      - "${MOCK_COGNITO_PORT:-8100}:8100"
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - RELOAD=${RELOAD:-false}
      - JWT_SECRET=${JWT_SECRET:-mock-cognito-secret-key}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - USER_POOL_ID=${USER_POOL_ID:-eu-west-1_MOCKPOOL}
      - CLIENT_ID=${CLIENT_ID:-mock-client-id-123456}
      - REGION=${REGION:-eu-west-1}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - frank-net

  #
  # FRANK Management API - All stages
  #
  frank-management-api:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.management
    container_name: frank-management-api
    profiles: ["stage1", "stage2", "stage3"]
    ports:
      - "${MANAGEMENT_API_PORT:-8001}:8001"
    environment:
      - FRANK_ENVIRONMENT=${FRANK_ENVIRONMENT:-local-docker}
      - FRANK_STAGE=${FRANK_STAGE:-3}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - RELOAD=${RELOAD:-false}
      - PORT=8001
      # Database URL - varies by stage
      - DATABASE_URL=${DATABASE_URL:-postgresql://frank:frank_dev@postgres:5432/frank_management}
      # DynamoDB settings (Stages 2-3)
      - DYNAMODB_ENDPOINT=${DYNAMODB_ENDPOINT:-http://localstack:4566}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-test}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-test}
      - AWS_REGION=${AWS_REGION:-eu-west-1}
      - DYNAMODB_TABLE=${DYNAMODB_TABLE:-frank-submissions}
      # Authentication (Stage 3 only)
      - FRANK_AUTH_MODE=${FRANK_AUTH_MODE:-mock}
      - COGNITO_URL=${COGNITO_URL:-http://mock-cognito:8100}
      - JWT_SECRET=${JWT_SECRET:-mock-cognito-secret-key}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - USER_POOL_ID=${USER_POOL_ID:-eu-west-1_MOCKPOOL}
      - REGION=${REGION:-eu-west-1}
      - VALIDATION_STRATEGY=${VALIDATION_STRATEGY:-local_only}
    volumes:
      # For Stage 1 SQLite database
      - sqlite-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - frank-net

  #
  # FRANK Web GUI - Stage 3 only
  #
  frank-web-gui:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.web
    container_name: frank-web-gui
    profiles: ["stage3"]
    ports:
      - "${WEB_GUI_PORT:-3000}:3000"
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - RELOAD=${RELOAD:-false}
      - PORT=3000
      - FRANK_MANAGEMENT_API_URL=http://frank-management-api:8001
      - COGNITO_URL=http://mock-cognito:8100
      - TEMPLATE_AUTO_RELOAD=${TEMPLATE_AUTO_RELOAD:-false}
      - FRANK_SESSION_SECRET=${FRANK_SESSION_SECRET:-development-secret-key-change-in-production-min-32-chars}
    depends_on:
      frank-management-api:
        condition: service_healthy
      mock-cognito:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - frank-net

  #
  # FRANK Admin API - Stage 3 only (future)
  #
  # frank-admin-api:
  #   build:
  #     context: ../..
  #     dockerfile: docker/Dockerfile.admin
  #   container_name: frank-admin-api
  #   profiles: ["stage3"]
  #   ports:
  #     - "${ADMIN_API_PORT:-8002}:8002"
  #   environment:
  #     - LOG_LEVEL=${LOG_LEVEL:-info}
  #     - PORT=8002
  #     - DATABASE_URL=postgresql://frank:frank_dev@postgres:5432/frank_management
  #     - COGNITO_URL=http://mock-cognito:8100
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     mock-cognito:
  #       condition: service_healthy
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 3
  #     start_period: 10s
  #   networks:
  #     - frank-net

volumes:
  postgres-data:
    driver: local
  localstack-data:
    driver: local
  sqlite-data:
    driver: local

networks:
  frank-net:
    driver: bridge
