version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    # A new release waits a week: most malicious releases are pulled by then.
    cooldown:
      default-days: 7
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # A new release waits a week: most malicious releases are pulled by then.
    cooldown:
      default-days: 7
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    # A new release waits a week: most malicious releases are pulled by then.
    cooldown:
      default-days: 7
