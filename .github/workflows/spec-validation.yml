name: Specification Validation

on:
  push:
    branches: [main, develop, feat/*, fix/*]
    paths:
      - 'openspec/**/*.spec.md'
      - 'openspec/**/*.py'
      - 'src/**/*.py'
      - 'tests/**/*.py'
      - '.github/workflows/spec-validation.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'openspec/**/*.spec.md'
      - 'openspec/**/*.py'
      - 'src/**/*.py'
      - 'tests/**/*.py'
      - '.github/workflows/spec-validation.yml'

jobs:
  validate-specs:
    name: Validate Specifications
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'

      - name: Make validation scripts executable
        run: |
          chmod +x openspec/validate.py 2>/dev/null || echo "No validation scripts found (using dotfiles spec command instead)"

      - name: Validate spec structure and completeness
        id: validate
        run: |
          if [ -f openspec/validate.py ]; then
            python openspec/validate.py --strict --output validation-report.txt
            echo "validation_status=$?" >> $GITHUB_OUTPUT
          else
            echo "Skipping - using dotfiles spec command for validation"
            echo "validation_status=0" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Check traceability
        id: trace
        run: |
          python openspec/trace.py --output traceability-report.txt
        continue-on-error: true

      - name: Check spec coverage
        id: coverage
        run: |
          python openspec/coverage.py --output coverage-report.txt --json > coverage.json
          COVERAGE=$(python -c "import json; print(json.load(open('coverage.json'))['overall']['coverage_percentage'])")
          echo "coverage_percentage=$COVERAGE" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Upload validation reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: spec-validation-reports
          path: |
            validation-report.txt
            traceability-report.txt
            coverage-report.txt
            coverage.json
          retention-days: 30

      - name: Comment on PR with validation results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');

            // Read reports
            let validationReport = '';
            let traceabilityReport = '';
            let coverageReport = '';

            try {
              validationReport = fs.readFileSync('validation-report.txt', 'utf8');
            } catch (e) {
              validationReport = 'Validation report not available';
            }

            try {
              traceabilityReport = fs.readFileSync('traceability-report.txt', 'utf8');
            } catch (e) {
              traceabilityReport = 'Traceability report not available';
            }

            try {
              const coverageJson = JSON.parse(fs.readFileSync('coverage.json', 'utf8'));
              const coverage = coverageJson.overall.coverage_percentage;
              const icon = coverage >= 80 ? '✅' : (coverage >= 50 ? '⚠️' : '❌');
              coverageReport = `${icon} **Spec Coverage**: ${coverage}% (${coverageJson.overall.spec_files}/${coverageJson.overall.total_files} files)`;
            } catch (e) {
              coverageReport = 'Coverage report not available';
            }

            // Create summary
            const validationStatus = '${{ steps.validate.outputs.validation_status }}' === '0' ? '✅ PASSED' : '❌ FAILED';

            const commentBody = `## 📋 Specification Validation Report

            ### Summary

            - **Validation**: ${validationStatus}
            - ${coverageReport}

            ### Validation Details

            <details>
            <summary>Click to expand validation report</summary>

            \`\`\`
            ${validationReport.slice(0, 5000)}
            \`\`\`

            </details>

            ### Traceability Details

            <details>
            <summary>Click to expand traceability report</summary>

            \`\`\`
            ${traceabilityReport.slice(0, 5000)}
            \`\`\`

            </details>

            ---

            🤖 *Generated by [Specification Validation Workflow](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})*
            `;

            // Post comment
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: commentBody
            });

      - name: Check validation status
        if: steps.validate.outputs.validation_status != '0'
        run: |
          echo "❌ Specification validation failed!"
          echo "Review the validation report for details."
          exit 1

      - name: Check coverage threshold
        run: |
          COVERAGE=${{ steps.coverage.outputs.coverage_percentage }}
          echo "Current spec coverage: $COVERAGE%"

          # We don't fail on low coverage yet, just warn
          if (( $(echo "$COVERAGE < 50" | bc -l) )); then
            echo "⚠️ Warning: Spec coverage is below 50%. Consider adding more specifications."
          fi
