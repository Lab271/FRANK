name: FRANK CI

# Trigger on pull requests to main branches and pushes to main/develop
on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'tests/**'
      - '*.py'
      - 'pyproject.toml'
      - 'uv.lock'
  push:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'tests/**'
      - '*.py'
      - 'pyproject.toml'
      - 'uv.lock'

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10

    - name: Set up Python
      run: uv python install 3.11

    - name: Install dependencies
      run: uv sync

    - name: Run ruff linter
      run: |
        # Report lint issues - currently ~2500 issues exist
        # TODO: Fix lint issues and remove continue-on-error
        uv run ruff check src/ tests/ --statistics || true

    - name: Check ruff formatting
      run: |
        # Report formatting issues
        # TODO: Run `uv run ruff format src/ tests/` to fix formatting
        uv run ruff format --check src/ tests/ || true

  type-check:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10

    - name: Set up Python
      run: uv python install 3.11

    - name: Install dependencies
      run: uv sync && uv pip install -e ".[dev]"

    - name: Run mypy
      run: uv run mypy src/
      continue-on-error: true  # Don't fail build until type errors are fixed

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Note: Tests run independently while lint issues are being fixed
    strategy:
      matrix:
        python-version: ['3.11', '3.13']

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync && uv pip install -e ".[dev]"

    - name: Run unit tests with pytest
      run: |
        # Run unit tests with coverage
        # Note: Coverage requirement is 68% (current: ~69%)
        # Target: 85% per CLAUDE.md - increase as coverage improves
        uv run python -m pytest \
          --verbose \
          --tb=short \
          --cov=src/frank \
          --cov-report=xml \
          --cov-report=term-missing \
          --cov-fail-under=68 \
          --junitxml=test-results.xml \
          tests/unit/

    - name: Run spike validation tests
      run: |
        # Run spike tests that validate technology learnings
        uv run python -m pytest tests/spikes/ -k "*_test.py" --tb=short || true
        
    - name: Upload test results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      if: always()  # Always upload, even if tests fail
      with:
        name: test-results-${{ matrix.python-version }}
        path: |
          test-results.xml
          coverage.xml
          
    - name: Comment PR with coverage
      if: github.event_name == 'pull_request' && matrix.python-version == '3.11' && github.actor != 'dependabot[bot]'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
      with:
        script: |
          const fs = require('fs');
          try {
            const coverage = fs.readFileSync('coverage.xml', 'utf8');
            const match = coverage.match(/line-rate="([^"]+)"/);
            if (match) {
              const coveragePercent = Math.round(parseFloat(match[1]) * 100);
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## 🧪 Test Coverage Report\n\n**Coverage: ${coveragePercent}%**\n\nPull request tests completed successfully!`
              });
            }
          } catch (error) {
            console.log('Could not read coverage file:', error.message);
          }
