name: FRANK Unit Tests

# Trigger on pull requests to main branches and pushes to main/develop
on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'tests/**'
      - '*.py'
      - 'requirements*.txt'
      - 'setup.py'
  push:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'tests/**'
      - '*.py'
      - 'requirements*.txt'
      - 'setup.py'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11, 3.13]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        # Install main requirements
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        # Install source code
        pip install -e .
        # Install testing tools
        pip install pytest pytest-cov pytest-xdist coverage
        
    - name: Run unit tests with pytest
      run: |
        # Run unit tests with coverage
        python -m pytest \
          --verbose \
          --tb=short \
          --cov=src/ \
          --cov-report=xml \
          --cov-report=term-missing \
<<<<<<< Updated upstream
          --cov-fail-under=85 \
=======
          --cov-fail-under=80 \
>>>>>>> Stashed changes
          --junitxml=test-results.xml
        
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()  # Always upload, even if tests fail
      with:
        name: test-results-${{ matrix.python-version }}
        path: |
          test-results.xml
          coverage.xml
          
    - name: Comment PR with coverage
      if: github.event_name == 'pull_request' && matrix.python-version == '3.11' && github.actor != 'dependabot[bot]'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          try {
            const coverage = fs.readFileSync('coverage.xml', 'utf8');
            const match = coverage.match(/line-rate="([^"]+)"/);
            if (match) {
              const coveragePercent = Math.round(parseFloat(match[1]) * 100);
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## 🧪 Test Coverage Report\n\n**Coverage: ${coveragePercent}%**\n\nPull request tests completed successfully!`
              });
            }
          } catch (error) {
            console.log('Could not read coverage file:', error.message);
          }
