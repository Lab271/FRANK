name: FRANK CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  # mvl-rust rev for the qualified-subset gate (make check-mvl-limit, #217);
  # the same pin as t-rust-db's sqlite-rs.
  MVL_RUST_REV: "a64eb33e7c9ef9ad031d22a70405e59aa1ad3cb0"

jobs:
  rust:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy -p frank-wasm --target wasm32-unknown-unknown --locked -- -D warnings
      - name: Qualified-subset gate (make check-mvl-limit)
        run: |
          cargo install --locked --git https://github.com/mvl-lang/mvl-rust --rev "$MVL_RUST_REV" rust-limit --bin cargo-mvl-limit
          make check-mvl-limit
      # The tests run once, under cargo llvm-cov, so coverage comes with them
      # (ADR-023, #299); make quality runs lizard through uvx.
      - name: Tests with coverage (make coverage)
        run: |
          cargo install --locked cargo-llvm-cov --version 0.8.7
          make coverage
      - name: Code quality (make quality)
        run: |
          pipx install uv==0.13.5
          make quality
      - name: Coverage and CCN gates (make check-assurance COVERAGE_MIN=0.90 CCN_MAX=15)
        run: make check-assurance COVERAGE_MIN=0.90 CCN_MAX=15
      - name: Upload coverage and quality
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: assurance-metrics
          path: |
            target/assurance/coverage.json
            target/assurance/lizard.csv
          if-no-files-found: warn

  # make test-slow: a release build for the #[ignore = "slow"] tests, in
  # parallel with the test job instead of after it (#313).
  slow:
    name: slow tests (make test-slow)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
      - run: cargo test --workspace --locked --release -- --ignored

  specs:
    name: spec traceability (make check-assurance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Also fails when the version disagrees between its five places (make version).
      - run: make check-assurance

  fuzz:
    name: fuzz the parsers (make fuzz, 60 s)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          workspaces: fuzz
      - run: cargo install --locked cargo-fuzz
      - name: make fuzz
        run: |
          mkdir -p fuzz/corpus/parse
          cd fuzz && cargo fuzz run parse corpus/parse ../examples ../examples/formats ../examples/demo \
            -- -max_total_time=60 -timeout=10
      - name: Crash inputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts

  deny:
    name: licences, sources, advisories (cargo deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
      - name: cargo deny check (deny.toml, #220)
        run: |
          cargo install --locked cargo-deny --version 0.20.2
          cargo deny check

  image:
    name: container image
    runs-on: ubuntu-latest
    # Both test jobs: main pushes and signs only what passed every test.
    needs: [rust, slow]
    # id-token and attestations: the keyless signature and the attestations
    # of the pushed image (#213). Only the main-only steps below use them.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/lab271/frank
      # Layers of earlier builds (#313): every run reads them, only pushes to
      # main write them, so a PR cannot put a layer in what main builds from.
      # A missing cache is a miss.
      CACHE: ghcr.io/lab271/frank-buildcache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin || true
          cache=(--layers --cache-from "$CACHE")
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            cache+=(--cache-to "$CACHE")
          fi
          podman build "${cache[@]}" -t "$IMAGE:${{ github.sha }}" -f Containerfile .
      - name: Playwright for the browser checks (spec 030, ADR-022)
        run: python3 -m venv /tmp/pw && /tmp/pw/bin/pip install -q playwright==1.64.1
      - name: End-to-end on the built image (make e2e), with the web UI in Obscura, before it is pushed
        run: BROWSER=1 PLAYWRIGHT=/tmp/pw/bin/python IMAGE="$IMAGE:${{ github.sha }}" scripts/e2e.sh
      - name: Push (main only)
        id: push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # podman pushes; cosign and the attest actions read Docker's login.
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          podman tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
          podman push --digestfile digest "$IMAGE:${{ github.sha }}"
          podman push "$IMAGE:latest"
          echo "digest=$(cat digest)" >> "$GITHUB_OUTPUT"
      # Everything below is by digest, so a moved tag cannot change what was
      # signed. Verify with the commands in ADR-018, item 9.
      - name: SBOM of the pushed image (CycloneDX, from the binary's cargo-auditable data)
        if: steps.push.outputs.digest != ''
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: cyclonedx-json
          output-file: frank.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest the SBOM
        if: steps.push.outputs.digest != ''
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: frank.cdx.json
          push-to-registry: true
      - name: Attest the build provenance (SLSA)
        if: steps.push.outputs.digest != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - if: steps.push.outputs.digest != ''
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the image (cosign, keyless)
        if: steps.push.outputs.digest != ''
        run: cosign sign --yes "$IMAGE@${{ steps.push.outputs.digest }}"
