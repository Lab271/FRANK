# FRANK in podman: `make up` from the repo root.
# The data stays on the host in ./data and ./participants (repo root), the
# directories `make run` uses: run one of the two at a time.
#   data/sightings/                Parquet table (live/, archive/, wal/)
#   data/iocs.db                   row table
#   data/registry.db               resend index, rebuilt from the sightings
#   data/audit/                    who did what, one JSON line per action
#   participants/participants.db   organisations, users, tokens (#159)
# Participants and tokens apply on the next request: `make participant
# NAME=me STATUS=partner` works with the container running.
# An old ./tokens file is imported once into an empty participants.db.
# The container runs as uid 65532. On Linux, give it the data directory once:
# `podman unshare chown -R 65532:65532 data participants tokens`.
# Host ports: FRANK_PORT (default 8080) for plain HTTP, as `make stream`
# and the scripts use it, and FRANK_TLS_ADDR (default 127.0.0.1:8443) for
# HTTPS through Caddy at https://frank.local:8443 (FRANK_HOST); `make
# trust` once makes the browser accept its certificate. macOS lets a user
# bind port 443 only on every interface: FRANK_TLS_ADDR=443 gives
# https://frank.local, reachable from the local network too.
# FRANK_HTTP_ADDR (default 80, every interface: the same macOS rule) only
# redirects http://frank.local to the HTTPS address; FRANK_HTTPS_PORT is
# that address's port.
services:
  frank:
    image: ghcr.io/lab271/frank:latest
    build:
      context: ../..
      dockerfile: Containerfile
    ports:
      - "127.0.0.1:${FRANK_PORT:-8080}:8080"
    volumes:
      - ../../data:/data:Z
      - ../../participants:/participants:Z
      - ../../tokens:/etc/frank/tokens:ro,Z
    environment:
      FRANK_RETENTION_DAYS: "400"
      RUST_LOG: "frank=info,tower_http=info"
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 30s

  caddy:
    image: docker.io/library/caddy:2.11.6-alpine
    depends_on: [frank]
    ports:
      - "${FRANK_TLS_ADDR:-127.0.0.1:8443}:443"
      - "${FRANK_HTTP_ADDR:-80}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,Z
      # The local CA and its certificates: keep them, or `make trust` again.
      - caddy-data:/data
      - caddy-config:/config
    environment:
      FRANK_HOST: "${FRANK_HOST:-frank.local}"
      FRANK_HTTPS_PORT: "${FRANK_HTTPS_PORT:-8443}"
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
