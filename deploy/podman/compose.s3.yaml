# `make up-s3` (#220): the compose.yaml stack with the sightings' Parquet files
# in a Garage bucket instead of ./data/sightings. Layered on compose.yaml
# (podman compose -f compose.yaml -f compose.s3.yaml): same Caddy, same URLs.
# The WAL stays in ./data/s3/sightings; the other state stays in ./data and
# ./participants as in `make up-solo`. Garage keeps its files in ./s3.
# Run one of the two modes at a time: `make up-solo` and `make up-s3` replace
# each other.
# Host ports, all on 127.0.0.1: GARAGE_S3_PORT (3900, the S3 API, for the aws
# CLI or an S3 browser), GARAGE_WEB_PORT (3902, the bucket as a website; reads
# need no credentials), GARAGE_ADMIN_PORT (3903, the admin API).
services:
  garage:
    image: docker.io/dxflrs/garage:v2.1.0
    ports:
      - "127.0.0.1:${GARAGE_S3_PORT:-3900}:3900"
      - "127.0.0.1:${GARAGE_WEB_PORT:-3902}:3902"
      - "127.0.0.1:${GARAGE_ADMIN_PORT:-3903}:3903"
    volumes:
      - ./garage.toml:/etc/garage.toml:ro,Z
      - ../../s3/meta:/meta:Z
      - ../../s3/data:/data:Z
    env_file: ../../s3/garage.env
    restart: unless-stopped
    stop_grace_period: 30s

  frank:
    depends_on: [garage]
    # AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY of the bucket's key.
    env_file: ../../s3/frank.env
    environment:
      FRANK_STORE: "s3://frank/sightings?endpoint=http://garage:3900&region=garage"
