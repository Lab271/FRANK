# FRANK Platform - Local Development Stack
#
# Provides Mock Cognito + Management API + Web GUI for local development.
#
# Usage:
#   docker compose -f docker-compose.local.yml up -d
#   docker compose -f docker-compose.local.yml logs -f
#   docker compose -f docker-compose.local.yml down
#
# Access points:
#   - Web GUI:        http://localhost:3000
#   - Management API: http://localhost:8001/docs
#   - Mock Cognito:   http://localhost:8100/health
#
# Copyright (c) 2025 Schuberg Philis B.V.
# SPDX-License-Identifier: Apache-2.0

services:
  # PostgreSQL database for Management API
  postgres:
    image: postgres:16-alpine
    container_name: frank-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-frank_management}
      - POSTGRES_USER=${POSTGRES_USER:-frank}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-frank_dev}
      - POSTGRES_HOST_AUTH_METHOD=md5
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frank -d frank_management"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - frank-net

  # Cognito stub service for authentication
  mock-cognito:
    build:
      context: .
      dockerfile: tests/stubs/cognito/Dockerfile.stub_cognito
      args:
        BUILD_CONTEXT: tests/stubs/cognito
        PACKAGE_CONTEXT: .
    container_name: frank-mock-cognito
    ports:
      - "${MOCK_COGNITO_PORT:-8100}:8100"
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - RELOAD=${RELOAD:-false}
      - JWT_SECRET=${JWT_SECRET:-mock-cognito-secret-key}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-RS256}
      - USER_POOL_ID=${USER_POOL_ID:-eu-west-1_MOCKPOOL}
      - CLIENT_ID=${CLIENT_ID:-mock-client-id-123456}
      - REGION=${REGION:-eu-west-1}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - frank-net

  # Management API service
  management-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.management
    container_name: frank-management-api
    ports:
      - "${MANAGEMENT_API_PORT:-8001}:8001"
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - RELOAD=${RELOAD:-false}
      - PORT=8001
      - DATABASE_URL=postgresql://${POSTGRES_USER:-frank}:${POSTGRES_PASSWORD:-frank_dev}@postgres:5432/${POSTGRES_DB:-frank_management}
      - FRANK_AUTH_MODE=mock
      - COGNITO_URL=http://mock-cognito:8100
      - JWT_ALGORITHM=${JWT_ALGORITHM:-RS256}
      - USER_POOL_ID=${USER_POOL_ID:-eu-west-1_MOCKPOOL}
      - REGION=${REGION:-eu-west-1}
      - VALIDATION_STRATEGY=${VALIDATION_STRATEGY:-local_only}
    depends_on:
      postgres:
        condition: service_healthy
      mock-cognito:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - frank-net

  # Web GUI service
  web-gui:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: frank-web-gui
    ports:
      - "${WEB_GUI_PORT:-3000}:3000"
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - RELOAD=${RELOAD:-false}
      - PORT=3000
      - FRANK_MANAGEMENT_API_URL=http://management-api:8001
      - COGNITO_URL=http://mock-cognito:8100
      - TEMPLATE_AUTO_RELOAD=${TEMPLATE_AUTO_RELOAD:-false}
      - FRANK_SESSION_SECRET=${FRANK_SESSION_SECRET:-development-secret-key-change-in-production-min-32-chars}
    depends_on:
      management-api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - frank-net

volumes:
  postgres-data:
    driver: local

networks:
  frank-net:
    driver: bridge
