# nginx load balancer configuration for FRANK Cognito Spike
# Handles SSL termination and routing to backend services

events {
    worker_connections 1024;
}

http {
    upstream simple_api_backend {
        server simple-api:8000;
    }

    # HTTP server - redirect to HTTPS
    server {
        listen 80;
        server_name frank-010-cognito.local;
        return 301 https://$server_name$request_uri;
    }

    # HTTPS server - Main Simple API
    server {
        listen 443 ssl;
        server_name frank-010-cognito.local;

        ssl_certificate /etc/nginx/ssl/nginx.crt;
        ssl_certificate_key /etc/nginx/ssl/nginx.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Simple API routes
        location /health {
            proxy_pass http://simple_api_backend/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        location / {
            proxy_pass http://simple_api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
