services:
  # Mock Cognito service using FastAPI
  mock-cognito:
    build: .
    container_name: mock-cognito
    ports:
      - "8080:8080"
    environment:
      - ENVIRONMENT=development
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - cognito-net

networks:
  cognito-net:
    driver: bridge