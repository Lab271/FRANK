services:
  # Nginx Load Balancer with SSL termination
  nginx-lb:
    image: nginx:alpine
    ports:
      - "80:80"     # HTTP redirect to HTTPS
      - "443:443"   # HTTPS to Simple API
    container_name: nginx-lb
    volumes:
      - ./nginx-lb.conf:/etc/nginx/nginx.conf
      - ${SSL_CERT_PATH:-./ssl-certs}/nginx.crt:/etc/nginx/ssl/nginx.crt:ro
      - ${SSL_CERT_PATH:-./ssl-certs}/nginx.key:/etc/nginx/ssl/nginx.key:ro
    depends_on:
      - simple-api
      - mock-cognito
    networks:
      - cognito-net

  # Mock Cognito service using FastAPI
  mock-cognito:
    build:
      context: ../../..
      dockerfile: tests/spikes/010_cognito/Dockerfile.cognito
      args:
        BUILD_CONTEXT: tests/spikes/010_cognito
        PACKAGE_CONTEXT: .      
    container_name: mock-cognito
    ports:
      - "${MOCK_COGNITO_PORT:-8100}:8100" # Direct HTTP access to Mock Cognito (exposed to localhost)
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      - RELOAD=${RELOAD:-false}
      - JWT_SECRET=${JWT_SECRET:-mock-cognito-secret-key}
      - USER_POOL_ID=${USER_POOL_ID:-eu-west-1_MOCKPOOL}
      - CLIENT_ID=${CLIENT_ID:-mock-client-id-123456}
      - REGION=${REGION:-eu-west-1}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - cognito-net

  # Simple API service demonstrating role-based access control
  simple-api:
    build:
      context: ../../..
      dockerfile: tests/spikes/010_cognito/Dockerfile.api
      args:
        BUILD_CONTEXT: tests/spikes/010_cognito
        PACKAGE_CONTEXT: .      
    container_name: simple-api
    ports:
      - "${SIMPLE_API_PORT:-8080}:8000" # Direct HTTP access to Simple API (exposed to localhost)
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      - RELOAD=${RELOAD:-false}
      - COGNITO_URL=http://mock-cognito:8100
      - JWT_SECRET=${JWT_SECRET:-mock-cognito-secret-key}
      - VALIDATION_STRATEGY=${VALIDATION_STRATEGY:-server_first}
      - REGION=${REGION:-eu-west-1}
    depends_on:
      - mock-cognito
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - cognito-net

networks:
  cognito-net:
    driver: bridge