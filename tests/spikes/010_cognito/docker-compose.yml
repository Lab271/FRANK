services:
  # Nginx Load Balancer with SSL termination
  nginx-lb:
    image: nginx:alpine
    ports:
      - "80:80"     # HTTP redirect to HTTPS
      - "443:443"   # HTTPS to Simple API
    container_name: nginx-lb
    volumes:
      - ./nginx-lb.conf:/etc/nginx/nginx.conf
      - ./ssl-certs/nginx.crt:/etc/nginx/ssl/nginx.crt:ro
      - ./ssl-certs/nginx.key:/etc/nginx/ssl/nginx.key:ro
    depends_on:
      - simple-api
      - mock-cognito
    networks:
      - cognito-net

  # Mock Cognito service using FastAPI
  mock-cognito:
    build:
      context: ../../..
      dockerfile: tests/spikes/010_cognito/Dockerfile.cognito
      args:
        BUILD_CONTEXT: tests/spikes/010_cognito
        PACKAGE_CONTEXT: .      
    container_name: mock-cognito
    ports:
      - "8100:8100" # Direct HTTP access to Mock Cognito (exposed to localhost)
    environment:
      - ENVIRONMENT=development
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - cognito-net

  # Simple API service demonstrating role-based access control
  simple-api:
    build:
      context: ../../..
      dockerfile: tests/spikes/010_cognito/Dockerfile.api
      args:
        BUILD_CONTEXT: tests/spikes/010_cognito
        PACKAGE_CONTEXT: .      
    container_name: simple-api
    ports:
      - "8000:8000" # Direct HTTP access to Simple API (exposed to localhost)
    environment:
      - ENVIRONMENT=development
      - MOCK_COGNITO_URL=http://mock-cognito:8100
    depends_on:
      - mock-cognito
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - cognito-net

networks:
  cognito-net:
    driver: bridge