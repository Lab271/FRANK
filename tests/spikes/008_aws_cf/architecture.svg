<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">
    FRANK AWS VPC Architecture (eu-west-1)
  </text>
  
  <!-- Internet -->
  <ellipse cx="400" cy="80" rx="80" ry="25" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="400" y="87" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    Internet
  </text>
  
  <!-- Internet Gateway -->
  <rect x="370" y="130" width="60" height="30" rx="5" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <text x="400" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">
    Internet GW
  </text>
  
  <!-- Connection from Internet to IGW -->
  <line x1="400" y1="105" x2="400" y2="130" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- VPC Container -->
  <rect x="100" y="180" width="600" height="380" rx="10" fill="none" stroke="#8e44ad" stroke-width="3" stroke-dasharray="10,5"/>
  <text x="110" y="200" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#8e44ad">
    VPC: 10.0.0.0/16
  </text>
  
  <!-- Route Table -->
  <rect x="120" y="220" width="100" height="60" rx="5" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
  <text x="170" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">
    Public Route Table
  </text>
  <text x="170" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">
    0.0.0.0/0 →</text>
  <text x="170" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">
    Internet GW</text>
  
  <!-- Connection from IGW to Route Table -->
  <line x1="400" y1="160" x2="220" y2="220" stroke="#34495e" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Availability Zone 1 -->
  <rect x="130" y="300" width="250" height="240" rx="8" fill="#ecf0f1" stroke="#95a5a6" stroke-width="2"/>
  <text x="140" y="320" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
    AZ: eu-west-1a
  </text>
  
  <!-- Public Subnet 1 -->
  <rect x="150" y="340" width="210" height="180" rx="5" fill="#d5dbdb" stroke="#85929e" stroke-width="1"/>
  <text x="160" y="355" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">
    Public Subnet 1
  </text>
  <text x="160" y="370" font-family="Arial, sans-serif" font-size="10" fill="#566573">
    10.0.1.0/24
  </text>
  
  <!-- ALB in Subnet 1 -->
  <rect x="170" y="390" width="80" height="40" rx="5" fill="#27ae60" stroke="#229954" stroke-width="2"/>
  <text x="210" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">
    Application
  </text>
  <text x="210" y="418" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">
    Load Balancer
  </text>
  
  <!-- ECS Task in Subnet 1 -->
  <rect x="270" y="450" width="70" height="50" rx="5" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="305" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">
    ECS Task
  </text>
  <text x="305" y="483" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">
    (Fargate)
  </text>
  <text x="305" y="496" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">
    FastAPI:8000
  </text>
  
  <!-- Availability Zone 2 -->
  <rect x="420" y="300" width="250" height="240" rx="8" fill="#ecf0f1" stroke="#95a5a6" stroke-width="2"/>
  <text x="430" y="320" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">
    AZ: eu-west-1b
  </text>
  
  <!-- Public Subnet 2 -->
  <rect x="440" y="340" width="210" height="180" rx="5" fill="#d5dbdb" stroke="#85929e" stroke-width="1"/>
  <text x="450" y="355" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">
    Public Subnet 2
  </text>
  <text x="450" y="370" font-family="Arial, sans-serif" font-size="10" fill="#566573">
    10.0.2.0/24
  </text>
  
  <!-- ALB in Subnet 2 -->
  <rect x="550" y="390" width="80" height="40" rx="5" fill="#27ae60" stroke="#229954" stroke-width="2"/>
  <text x="590" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">
    Application
  </text>
  <text x="590" y="418" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">
    Load Balancer
  </text>
  
  <!-- Connection between ALBs -->
  <line x1="250" y1="410" x2="550" y2="410" stroke="#27ae60" stroke-width="3" stroke-dasharray="5,5"/>
  <text x="400" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#27ae60">
    Load Balancer spans both AZs
  </text>
  
  <!-- Route Table connections to subnets -->
  <line x1="220" y1="250" x2="255" y2="340" stroke="#f39c12" stroke-width="2"/>
  <line x1="220" y1="250" x2="545" y2="340" stroke="#f39c12" stroke-width="2"/>
  
  <!-- ECR Repository (outside VPC) -->
  <rect x="50" y="450" width="70" height="50" rx="5" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <text x="85" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">
    ECR
  </text>
  <text x="85" y="483" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">
    Container
  </text>
  <text x="85" y="496" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">
    Registry
  </text>
  
  <!-- CloudWatch Logs (outside VPC) -->
  <rect x="720" y="450" width="70" height="50" rx="5" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
  <text x="755" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">
    CloudWatch
  </text>
  <text x="755" y="483" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">
    Logs
  </text>
  
  <!-- Connections to external services -->
  <line x1="120" y1="475" x2="270" y2="475" stroke="#e74c3c" stroke-width="2" stroke-dasharray="3,3"/>
  <line x1="340" y1="475" x2="720" y2="475" stroke="#9b59b6" stroke-width="2" stroke-dasharray="3,3"/>
  
  <!-- Security Groups Legend -->
  <rect x="120" y="580" width="560" height="15" fill="#f8f9fa" stroke="#bdc3c7" stroke-width="1"/>
  <text x="125" y="590" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
    Security Groups: ALB-SG (HTTP:80→Internet) | ECS-SG (8000←ALB-SG) | All outbound traffic allowed
  </text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
            refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e"/>
    </marker>
  </defs>
  
  <!-- Traffic flow indicators -->
  <text x="50" y="50" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e74c3c">
    Traffic Flow:
  </text>
  <text x="50" y="65" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">
    Internet → IGW → ALB → ECS (Port 8000)
  </text>
</svg>