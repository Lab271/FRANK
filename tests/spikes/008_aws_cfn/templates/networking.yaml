AWSTemplateFormatVersion: '2010-09-09'
Description: 'FRANK 008 AWS Spike - Networking Infrastructure (VPC, Subnets, Security Groups)'

Parameters:
  ProjectName:
    Type: String
    Default: frank-008-aws
    Description: Project name for resource naming
  
  Environment:
    Type: String
    Default: spike
    Description: Environment name
  
  NetworkVpcCidr:
    Type: String
    Default: 10.0.0.0/16
    Description: CIDR block for VPC
    AllowedPattern: ^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/(1[6-9]|2[0-8]))$
  
  NetworkPublicSubnetCidrs:
    Type: CommaDelimitedList
    Default: "10.0.1.0/24,10.0.2.0/24"
    Description: CIDR blocks for public subnets
  
  NetworkAvailabilityZones:
    Type: CommaDelimitedList
    Default: "eu-west-1a,eu-west-1b"
    Description: Availability zones for subnets
  
  ContainerPort:
    Type: Number
    Default: 8000
    Description: Port for container application

Resources:
  # ===================================
  # VPC
  # ===================================
  
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref NetworkVpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-vpc"
        - Key: Project
          Value: FRANK
        - Key: Environment
          Value: !Ref Environment
  
  # ===================================
  # Internet Gateway
  # ===================================
  
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-igw"
        - Key: Project
          Value: FRANK
        - Key: Environment
          Value: !Ref Environment
  
  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway
  
  # ===================================
  # Public Subnets
  # ===================================
  
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Select [0, !Ref NetworkPublicSubnetCidrs]
      AvailabilityZone: !Select [0, !Ref NetworkAvailabilityZones]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-public-subnet-1"
        - Key: Type
          Value: Public
        - Key: Project
          Value: FRANK
        - Key: Environment
          Value: !Ref Environment
        - Key: AZ
          Value: !Select [0, !Ref NetworkAvailabilityZones]
  
  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Select [1, !Ref NetworkPublicSubnetCidrs]
      AvailabilityZone: !Select [1, !Ref NetworkAvailabilityZones]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-public-subnet-2"
        - Key: Type
          Value: Public
        - Key: Project
          Value: FRANK
        - Key: Environment
          Value: !Ref Environment
        - Key: AZ
          Value: !Select [1, !Ref NetworkAvailabilityZones]
  
  # ===================================
  # Route Table
  # ===================================
  
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-public-rt"
        - Key: Type
          Value: Public
        - Key: Project
          Value: FRANK
        - Key: Environment
          Value: !Ref Environment
  
  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  
  PublicSubnetRouteTableAssociation1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable
  
  PublicSubnetRouteTableAssociation2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable
  
  # ===================================
  # Security Groups
  # ===================================
  
  # Application Load Balancer Security Group
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${ProjectName}-alb-sg"
      GroupDescription: Security group for Application Load Balancer
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP from internet
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS from internet
      SecurityGroupEgress:
        - IpProtocol: -1
          FromPort: -1
          ToPort: -1
          CidrIp: 0.0.0.0/0
          Description: All outbound traffic
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-alb-sg"
        - Key: Type
          Value: ALB
        - Key: Project
          Value: FRANK
        - Key: Environment
          Value: !Ref Environment
  
  # ECS Tasks Security Group
  ECSTasksSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${ProjectName}-ecs-sg"
      GroupDescription: Security group for ECS tasks
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref ContainerPort
          ToPort: !Ref ContainerPort
          SourceSecurityGroupId: !Ref ALBSecurityGroup
          Description: Container port from ALB
      SecurityGroupEgress:
        - IpProtocol: -1
          FromPort: -1
          ToPort: -1
          CidrIp: 0.0.0.0/0
          Description: All outbound traffic
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-ecs-sg"
        - Key: Type
          Value: ECS
        - Key: Project
          Value: FRANK
        - Key: Environment
          Value: !Ref Environment

Outputs:
  VpcId:
    Description: VPC ID
    Value: !Ref VPC
    Export:
      Name: !Sub "${AWS::StackName}-VpcId"
  
  VpcCidr:
    Description: VPC CIDR block
    Value: !Ref NetworkVpcCidr
    Export:
      Name: !Sub "${AWS::StackName}-VpcCidr"
  
  PublicSubnetIds:
    Description: Public subnet IDs
    Value: !Join [',', [!Ref PublicSubnet1, !Ref PublicSubnet2]]
    Export:
      Name: !Sub "${AWS::StackName}-PublicSubnetIds"
  
  PublicSubnet1Id:
    Description: Public subnet 1 ID
    Value: !Ref PublicSubnet1
    Export:
      Name: !Sub "${AWS::StackName}-PublicSubnet1Id"
  
  PublicSubnet2Id:
    Description: Public subnet 2 ID
    Value: !Ref PublicSubnet2
    Export:
      Name: !Sub "${AWS::StackName}-PublicSubnet2Id"
  
  AvailabilityZones:
    Description: Availability zones used
    Value: !Join [',', !Ref NetworkAvailabilityZones]
    Export:
      Name: !Sub "${AWS::StackName}-AvailabilityZones"
  
  ALBSecurityGroupId:
    Description: ALB Security Group ID
    Value: !Ref ALBSecurityGroup
    Export:
      Name: !Sub "${AWS::StackName}-ALBSecurityGroupId"
  
  ECSSecurityGroupId:
    Description: ECS Security Group ID
    Value: !Ref ECSTasksSecurityGroup
    Export:
      Name: !Sub "${AWS::StackName}-ECSSecurityGroupId"
  
  InternetGatewayId:
    Description: Internet Gateway ID
    Value: !Ref InternetGateway
    Export:
      Name: !Sub "${AWS::StackName}-InternetGatewayId"