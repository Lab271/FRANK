AWSTemplateFormatVersion: '2010-09-09'
Description: 'FRANK 008 AWS Spike - ECS Cluster, Service, and Task Definition'

Parameters:
  ProjectName:
    Type: String
    Default: frank-008-aws
    Description: Project name for resource naming
  
  Environment:
    Type: String
    Default: spike
    Description: Environment name
  
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID from networking stack
  
  PublicSubnetIds:
    Type: CommaDelimitedList
    Description: Public subnet IDs from networking stack
  
  ECSSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: ECS Security Group ID from networking stack
  
  TargetGroupArn:
    Type: String
    Description: Target Group ARN from load balancer stack
  
  ContainerPort:
    Type: Number
    Default: 8000
    Description: Port for container application
  
  ContainerCpu:
    Type: Number
    Default: 256
    Description: CPU units for container (256, 512, 1024, etc.)
    AllowedValues: [256, 512, 1024, 2048, 4096]
  
  ContainerMemory:
    Type: Number
    Default: 512
    Description: Memory for container in MB
    AllowedValues: [512, 1024, 2048, 4096, 8192]
  
  ContainerDesiredCount:
    Type: Number
    Default: 1
    Description: Desired number of running tasks
    MinValue: 0
    MaxValue: 10
  
  EcrRepositoryName:
    Type: String
    Default: frank-008-aws
    Description: ECR repository name
  
  LoggingRetentionDays:
    Type: Number
    Default: 7
    Description: CloudWatch log retention in days
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1827, 3653]

Resources:
  # ===================================
  # ECR Repository
  # ===================================
  
  ECRRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref EcrRepositoryName
      ImageTagMutability: MUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep last 10 tagged images",
                "selection": {
                  "tagStatus": "tagged",
                  "tagPrefixList": ["v", "latest"],
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": {
                  "type": "expire"
                }
              },
              {
                "rulePriority": 2,
                "description": "Delete untagged images older than 1 day",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 1
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-ecr"
        - Key: Project
          Value: FRANK
        - Key: Environment
          Value: !Ref Environment

  # ===================================
  # CloudWatch Log Group
  # ===================================
  
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${ProjectName}"
      RetentionInDays: !Ref LoggingRetentionDays
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-logs"
        - Key: Project
          Value: FRANK
        - Key: Environment
          Value: !Ref Environment

  # ===================================
  # IAM Roles
  # ===================================
  
  # ECS Task Execution Role
  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-ecs-task-execution-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref AWS::AccountId
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ECRAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                Resource: !GetAtt ECRRepository.Arn
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: '*'
        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "${LogGroup.Arn}:*"
      Tags:
        - Key: Project
          Value: FRANK
        - Key: Environment
          Value: !Ref Environment

  # ECS Task Role (for application permissions)
  ECSTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-ecs-task-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref AWS::AccountId
      Policies:
        - PolicyName: ApplicationPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "${LogGroup.Arn}:*"
              # Add more permissions here as needed for your application
      Tags:
        - Key: Project
          Value: FRANK
        - Key: Environment
          Value: !Ref Environment

  # ===================================
  # ECS Cluster
  # ===================================
  
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${ProjectName}-cluster"
      CapacityProviders:
        - FARGATE
        - FARGATE_SPOT
      DefaultCapacityProviderStrategy:
        - CapacityProvider: FARGATE
          Weight: 1
          Base: 1
      Configuration:
        ExecuteCommandConfiguration:
          Logging: OVERRIDE
          LogConfiguration:
            CloudWatchLogGroupName: !Ref LogGroup
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-cluster"
        - Key: Project
          Value: FRANK
        - Key: Environment
          Value: !Ref Environment

  # ===================================
  # ECS Task Definition
  # ===================================
  
  ECSTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Ref ProjectName
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: !Ref ContainerCpu
      Memory: !Ref ContainerMemory
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ECSTaskRole.Arn
      ContainerDefinitions:
        - Name: !Sub "${ProjectName}-container"
          Image: !Sub "${ECRRepository.RepositoryUri}:latest"
          Essential: true
          PortMappings:
            - ContainerPort: !Ref ContainerPort
              Protocol: tcp
              Name: http
          Environment:
            - Name: FRANK_ENVIRONMENT
              Value: aws
            - Name: AWS_DEFAULT_REGION
              Value: !Ref AWS::Region
            - Name: PORT
              Value: !Ref ContainerPort
            - Name: LOG_LEVEL
              Value: INFO
          HealthCheck:
            Command:
              - CMD-SHELL
              - !Sub "curl -f http://localhost:${ContainerPort}/health || exit 1"
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
          # Resource limits
          MemoryReservation: 256
          # Security
          ReadonlyRootFilesystem: false
          User: frankuser
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-task"
        - Key: Project
          Value: FRANK
        - Key: Environment
          Value: !Ref Environment

  # ===================================
  # ECS Service
  # ===================================
  
  ECSService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub "${ProjectName}-service"
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref ECSTaskDefinition
      DesiredCount: !Ref ContainerDesiredCount
      LaunchType: FARGATE
      PlatformVersion: LATEST
      NetworkConfiguration:
        AwsvpcConfiguration:
          SecurityGroups:
            - !Ref ECSSecurityGroupId
          Subnets: !Ref PublicSubnetIds
          AssignPublicIp: ENABLED
      LoadBalancers:
        - TargetGroupArn: !Ref TargetGroupArn
          ContainerName: !Sub "${ProjectName}-container"
          ContainerPort: !Ref ContainerPort
      HealthCheckGracePeriodSeconds: 120
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 100
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      EnableExecuteCommand: true  # For debugging
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-service"
        - Key: Project
          Value: FRANK
        - Key: Environment
          Value: !Ref Environment

Outputs:
  ECSClusterName:
    Description: ECS Cluster name
    Value: !Ref ECSCluster
    Export:
      Name: !Sub "${AWS::StackName}-ECSClusterName"
  
  ECSClusterArn:
    Description: ECS Cluster ARN
    Value: !GetAtt ECSCluster.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ECSClusterArn"
  
  ECSServiceName:
    Description: ECS Service name
    Value: !Ref ECSService
    Export:
      Name: !Sub "${AWS::StackName}-ECSServiceName"
  
  ECSServiceArn:
    Description: ECS Service ARN
    Value: !Ref ECSService
    Export:
      Name: !Sub "${AWS::StackName}-ECSServiceArn"
  
  ECSTaskDefinitionArn:
    Description: ECS Task Definition ARN
    Value: !Ref ECSTaskDefinition
    Export:
      Name: !Sub "${AWS::StackName}-ECSTaskDefinitionArn"
  
  ECRRepositoryURL:
    Description: ECR Repository URL
    Value: !GetAtt ECRRepository.RepositoryUri
    Export:
      Name: !Sub "${AWS::StackName}-ECRRepositoryURL"
  
  ECRRepositoryArn:
    Description: ECR Repository ARN
    Value: !GetAtt ECRRepository.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ECRRepositoryArn"
  
  LogGroupName:
    Description: CloudWatch Log Group name
    Value: !Ref LogGroup
    Export:
      Name: !Sub "${AWS::StackName}-LogGroupName"
  
  LogGroupArn:
    Description: CloudWatch Log Group ARN
    Value: !GetAtt LogGroup.Arn
    Export:
      Name: !Sub "${AWS::StackName}-LogGroupArn"
  
  TaskExecutionRoleArn:
    Description: ECS Task Execution Role ARN
    Value: !GetAtt ECSTaskExecutionRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-TaskExecutionRoleArn"
  
  TaskRoleArn:
    Description: ECS Task Role ARN
    Value: !GetAtt ECSTaskRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-TaskRoleArn"