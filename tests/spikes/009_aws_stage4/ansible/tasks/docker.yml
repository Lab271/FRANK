---
# tasks/docker.yml
- name: Get ECR login token
  command: >
    aws ecr get-login-password 
    --region {{ aws_region }}
    --profile {{ aws_profile }}
  register: ecr_token
  changed_when: false

- name: Log in to ECR
  command: >
    docker login 
    --username AWS 
    --password-stdin {{ ecr_url }}
  args:
    stdin: "{{ ecr_token.stdout }}"
  register: docker_login
  changed_when: true

- name: Build Docker image
  # Replicate the docker-compose arguments
  command: >
    docker buildx build 
    --platform linux/amd64 
    --build-arg BUILD_CONTEXT=tests/spikes/009_aws_stage4
    --build-arg PACKAGE_CONTEXT=.
    -t {{ app_name }}:{{ image_tag }}
    -t {{ ecr_url }}/{{ repository_name }}:{{ image_tag }}
    -t {{ ecr_url }}/{{ repository_name }}:latest
    -f tests/spikes/009_aws_stage4/Dockerfile
    .
  args:
    chdir: "../../../.." # one more because we're in ansible
  register: docker_build
  changed_when: true

- name: Push Docker image as latest
  command: docker push {{ ecr_url }}/{{ repository_name }}:latest
  register: docker_push_latest
  changed_when: true

- name: Push Docker image with tag
  command: docker push {{ ecr_url }}/{{ repository_name }}:{{ image_tag }}
  register: docker_push_tagged
  changed_when: true

# ===================================
# Force ECS Service Redeployment
# ===================================

- name: Force ECS service redeployment to pick up new image
  command: >
    aws ecs update-service
    --cluster {{ stack_name }}-cluster
    --service {{ stack_name }}-service
    --force-new-deployment
    --region {{ aws_region }}
    --profile {{ aws_profile }}
  register: ecs_force_deploy
  changed_when: true

- name: Wait for ECS service deployment to complete
  command: >
    aws ecs wait services-stable
    --cluster {{ stack_name }}-cluster
    --services {{ stack_name }}-service
    --region {{ aws_region }}
    --profile {{ aws_profile }}
  register: ecs_wait
  when: ecs_force_deploy is not skipped and ecs_force_deploy.rc == 0
  async: 120  # 2 minutes
  poll: 10  # Check every 10 seconds