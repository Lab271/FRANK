---
# tasks/prerequisites.yml
- name: Check if AWS CLI is installed
  command: aws --version
  register: aws_cli_check
  failed_when: false
  changed_when: false

- name: Fail if AWS CLI is not installed
  fail:
    msg: "AWS CLI is not installed. Please install it first."
  when: aws_cli_check.rc != 0

- name: Check if Docker is installed
  command: docker --version
  register: docker_check
  failed_when: false
  changed_when: false

- name: Fail if Docker is not installed
  fail:
    msg: "Docker is not installed. Please install it first."
  when: docker_check.rc != 0

- name: Check if jq is installed
  command: jq --version
  register: jq_check
  failed_when: false
  changed_when: false

- name: Warn if jq is not installed
  debug:
    msg: "jq is not installed. Some features may not work. Install with: brew install jq"
  when: jq_check.rc != 0

- name: Check AWS credentials for spike account
  command: aws sts get-caller-identity --profile {{ aws_profile }}
  register: spike_creds_check
  failed_when: false
  changed_when: false

- name: Fail if spike account credentials are not configured
  fail:
    msg: "AWS credentials not configured for {{ aws_profile }}. Please run 'aws configure --profile {{ aws_profile }}'."
  when: spike_creds_check.rc != 0

- name: Check AWS credentials for main account
  command: aws sts get-caller-identity --profile {{ main_account_profile }}
  register: main_creds_check
  failed_when: false
  changed_when: false

- name: Warn if main account credentials are not configured
  debug:
    msg: "Main account profile '{{ main_account_profile }}' not configured. SSL setup will be skipped."
  when: main_creds_check.rc != 0

- name: Get AWS Account ID
  command: aws sts get-caller-identity --profile {{ aws_profile }} --query Account --output text
  register: aws_account_id_result
  changed_when: false

- name: Set AWS Account ID fact
  set_fact:
    aws_account_id: "{{ aws_account_id_result.stdout }}"
    ecr_url: "{{ aws_account_id_result.stdout }}.dkr.ecr.{{ aws_region }}.amazonaws.com"

- name: Display configuration
  debug:
    msg: 
      - "AWS Account ID: {{ aws_account_id }}"
      - "ECR URL: {{ ecr_url }}"
      - "Stack Name: {{ stack_name }}"
      - "Region: {{ aws_region }}"