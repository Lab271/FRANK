---
# DynamoDB table creation tasks
# Creates main application table and audit table for Stage 4

- name: Check if main table exists
  command: >
    aws dynamodb describe-table 
    --profile {{ aws_profile }} 
    --region {{ aws_region }}
    --table-name {{ stack_name }}-main-table
  register: main_table_check
  failed_when: false
  changed_when: false

- name: Check if audit table exists
  command: >
    aws dynamodb describe-table 
    --profile {{ aws_profile }} 
    --region {{ aws_region }}
    --table-name {{ stack_name }}-audit-table
  register: audit_table_check
  failed_when: false
  changed_when: false

- name: Create main application table
  command: >
    aws dynamodb create-table
    --profile {{ aws_profile }}
    --region {{ aws_region }}
    --table-name {{ stack_name }}-main-table
    --attribute-definitions
      AttributeName=PK,AttributeType=S
      AttributeName=SK,AttributeType=S
      AttributeName=GSI1PK,AttributeType=S
      AttributeName=GSI1SK,AttributeType=S
    --key-schema
      AttributeName=PK,KeyType=HASH
      AttributeName=SK,KeyType=RANGE
    --global-secondary-indexes
      'IndexName=GSI1,KeySchema=[{AttributeName=GSI1PK,KeyType=HASH},{AttributeName=GSI1SK,KeyType=RANGE}],Projection={ProjectionType=ALL}'
    --billing-mode PAY_PER_REQUEST
    --stream-specification
      StreamEnabled=true,StreamViewType=NEW_AND_OLD_IMAGES
    --sse-specification
      Enabled=true,SSEType=KMS
    --tags
      'Key=Application,Value=FRANK'
      'Key=Environment,Value=development'
      'Key=DataClassification,Value=confidential'
      'Key=Project,Value=FRANK'
      'Key=Stage,Value=4'
      'Key=ManagedBy,Value=Ansible'
  when: main_table_check.rc != 0
  register: main_table_creation

- name: Create audit table
  command: >
    aws dynamodb create-table
    --profile {{ aws_profile }}
    --region {{ aws_region }}
    --table-name {{ stack_name }}-audit-table
    --attribute-definitions
      AttributeName=PK,AttributeType=S
      AttributeName=SK,AttributeType=S
      AttributeName=GSI1PK,AttributeType=S
      AttributeName=GSI1SK,AttributeType=S
    --key-schema
      AttributeName=PK,KeyType=HASH
      AttributeName=SK,KeyType=RANGE
    --global-secondary-indexes
      'IndexName=GSI1,KeySchema=[{AttributeName=GSI1PK,KeyType=HASH},{AttributeName=GSI1SK,KeyType=RANGE}],Projection={ProjectionType=ALL}'
    --billing-mode PAY_PER_REQUEST
    --time-to-live-specification
      AttributeName=TTL,Enabled=true
    --sse-specification
      Enabled=true,SSEType=KMS
    --tags
      'Key=Application,Value=FRANK'
      'Key=Environment,Value=development'
      'Key=DataClassification,Value=confidential'
      'Key=Project,Value=FRANK'
      'Key=Stage,Value=4'
      'Key=ManagedBy,Value=Ansible'
  when: audit_table_check.rc != 0
  register: audit_table_creation

- name: Wait for main table to become active
  command: >
    aws dynamodb wait table-exists
    --profile {{ aws_profile }}
    --region {{ aws_region }}
    --table-name {{ stack_name }}-main-table
  when: main_table_creation is changed

- name: Wait for audit table to become active
  command: >
    aws dynamodb wait table-exists
    --profile {{ aws_profile }}
    --region {{ aws_region }}
    --table-name {{ stack_name }}-audit-table
  when: audit_table_creation is changed

- name: Enable point-in-time recovery for main table
  command: >
    aws dynamodb update-continuous-backups
    --profile {{ aws_profile }}
    --region {{ aws_region }}
    --table-name {{ stack_name }}-main-table
    --point-in-time-recovery-specification PointInTimeRecoveryEnabled=true
  when: main_table_creation is changed

- name: Enable point-in-time recovery for audit table
  command: >
    aws dynamodb update-continuous-backups
    --profile {{ aws_profile }}
    --region {{ aws_region }}
    --table-name {{ stack_name }}-audit-table
    --point-in-time-recovery-specification PointInTimeRecoveryEnabled=true
  when: audit_table_creation is changed

- name: Display DynamoDB table creation results
  debug:
    msg:
      - "=== DynamoDB Tables Status ==="
      - "Main Table: {{ stack_name }}-main-table - {{ 'Created' if main_table_creation is changed else 'Already exists' }}"
      - "Audit Table: {{ stack_name }}-audit-table - {{ 'Created' if audit_table_creation is changed else 'Already exists' }}"
      - "Point-in-time recovery: Enabled"
      - "Tables ready for application use"