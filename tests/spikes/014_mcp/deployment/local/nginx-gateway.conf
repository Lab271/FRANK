# MCP Gateway - NGINX Configuration
# Routes traffic to MCP servers via subpaths
# Copyright (c) 2025 LAB271

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'upstream: $upstream_addr';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Upstream definitions
    upstream log-mcp-backend {
        server log-mcp:8000 max_fails=3 fail_timeout=30s;
    }

    upstream greeting-mcp-backend {
        server greeting-mcp:8001 max_fails=3 fail_timeout=30s;
    }

    # HTTP server - redirect to HTTPS
    server {
        listen 80;
        server_name mcp.local;

        # Health check endpoint (no redirect)
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # Redirect all other traffic to HTTPS
        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl http2;
        server_name mcp.local;

        # SSL Configuration
        ssl_certificate /etc/nginx/ssl/mcp.crt;
        ssl_certificate_key /etc/nginx/ssl/mcp.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Root endpoint
        location = / {
            default_type application/json;
            return 200 '{"status":"ok","message":"MCP Gateway","version":"1.0","services":[{"name":"log-mcp","path":"/log/"},{"name":"greeting-mcp","path":"/greeting/"}]}';
        }

        # Gateway health check
        location = /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"healthy","gateway":"nginx","timestamp":"$time_iso8601"}';
        }

        # Log MCP Server
        location /log/ {
            # Remove /log prefix when forwarding
            rewrite ^/log/(.*)$ /$1 break;

            proxy_pass http://log-mcp-backend;
            proxy_http_version 1.1;
            
            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 300s;  # Longer for streaming logs

            # Buffering
            proxy_buffering off;  # Important for streaming responses
            proxy_request_buffering off;

            # WebSocket support (if needed)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Error handling
            proxy_intercept_errors off;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
            proxy_next_upstream_tries 2;
        }

        # Log MCP Server health check
        location = /log/health {
            proxy_pass http://log-mcp-backend/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            access_log off;
        }

        # Greeting MCP Server
        location /greeting/ {
            # Remove /greeting prefix when forwarding
            rewrite ^/greeting/(.*)$ /$1 break;

            proxy_pass http://greeting-mcp-backend;
            proxy_http_version 1.1;
            
            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Buffering
            proxy_buffering on;
            proxy_request_buffering on;

            # WebSocket support (if needed)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Error handling
            proxy_intercept_errors off;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
            proxy_next_upstream_tries 2;
        }

        # Greeting MCP Server health check
        location = /greeting/health {
            proxy_pass http://greeting-mcp-backend/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            access_log off;
        }

        # Future MCP servers can be added here with similar patterns:
        # location /quotes/ { ... }
        # location /calculator/ { ... }
        
        # 404 for unknown paths
        location / {
            default_type application/json;
            return 404 '{"error":"Not Found","message":"Unknown MCP service","available_services":["/log/","/greeting/"]}';
        }
    }
}
