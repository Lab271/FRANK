---
# AWS Secrets Manager tasks

- name: Check if AbuseIPDB secret exists
  command: >
    aws secretsmanager describe-secret
    --secret-id mcp/log-server/env
    --region {{ aws_region }}
  register: secret_check
  failed_when: false
  changed_when: false

- name: Create AbuseIPDB secret in Secrets Manager
  when: secret_check.rc != 0
  command: >
    aws secretsmanager create-secret
    --name mcp/log-server/env
    --description "MCP Log Server environment variables"
    --secret-string '{"ABUSEIPDB_API_KEY":"{{ abuseipdb_api_key }}"}'
    --region {{ aws_region }}
  register: secret_created
  no_log: true

- name: Update existing secret
  when: secret_check.rc == 0
  command: >
    aws secretsmanager update-secret
    --secret-id mcp/log-server/env
    --secret-string '{"ABUSEIPDB_API_KEY":"{{ abuseipdb_api_key }}"}'
    --region {{ aws_region }}
  register: secret_updated
  no_log: true

- name: Get secret ARN
  command: >
    aws secretsmanager describe-secret
    --secret-id mcp/log-server/env
    --region {{ aws_region }}
    --query 'ARN'
    --output text
  register: secret_arn_output
  changed_when: false

- name: Save secret ARN for CloudFormation
  set_fact:
    abuseipdb_secret_arn: "{{ secret_arn_output.stdout }}"

- name: Display secret ARN
  debug:
    msg: "Secret ARN: {{ abuseipdb_secret_arn }}"
