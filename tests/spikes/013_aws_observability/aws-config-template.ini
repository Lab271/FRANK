# AWS CLI Configuration Template for FRANK Security Roles
# Add this to your ~/.aws/config file

# Replace ACCOUNT-ID with your actual AWS account ID
# Replace your-username with your actual IAM username

[profile frank-infra]
role_arn = arn:aws:iam::ACCOUNT-ID:role/frank-infra-creator
source_profile = spike-account
external_id = frank-deployment-access
mfa_serial = arn:aws:iam::ACCOUNT-ID:mfa/your-username
duration_seconds = 7200
region = eu-central-1

[profile frank-destroy]
role_arn = arn:aws:iam::ACCOUNT-ID:role/frank-infra-destroyer
source_profile = spike-account
external_id = frank-deployment-access
mfa_serial = arn:aws:iam::ACCOUNT-ID:mfa/your-username
duration_seconds = 1800
region = eu-central-1

[profile frank-deploy]
role_arn = arn:aws:iam::ACCOUNT-ID:role/frank-app-deployer
source_profile = spike-account
external_id = frank-deployment-access
duration_seconds = 14400
region = eu-central-1

[profile frank-data]
role_arn = arn:aws:iam::ACCOUNT-ID:role/frank-data-reader
source_profile = spike-account
external_id = frank-deployment-access
duration_seconds = 28800
region = eu-central-1

[profile frank-emergency]
role_arn = arn:aws:iam::ACCOUNT-ID:role/frank-emergency-admin
source_profile = spike-account
external_id = frank-deployment-access
mfa_serial = arn:aws:iam::ACCOUNT-ID:mfa/your-username
duration_seconds = 900
region = eu-central-1