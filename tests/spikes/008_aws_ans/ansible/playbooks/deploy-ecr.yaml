---
# ===================================
# FRANK 008 AWS Spike - Ansible Deployment Playbook
# Deploys FRANK ECR sub-spike
# ===================================

- name: Deploy FRANK ECR Spike
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars/accounts.yaml
    - vars/frank-config.yaml

  tasks:
    - name: Create ECR repository
      ansible.builtin.shell: |
        aws ecr create-repository \
          --repository-name "{{ project.name }}" \
          --region "{{ aws.region }}" \
          --profile "{{ spike_account.profile_name }}" \
          --image-tag-mutability MUTABLE \
          --image-scanning-configuration scanOnPush=true \
          --tags Key=Project,Value="{{ project.name }}" \
                 Key=Environment,Value="{{ project.environment }}" \
                 Key=ManagedBy,Value="Ansible" \
          --output json
      register: ecr_create_result
      failed_when: 
        - ecr_create_result.rc != 0
        - "'RepositoryAlreadyExistsException' not in ecr_create_result.stderr"
      changed_when: ecr_create_result.rc == 0

    - name: Get ECR repository URI
      ansible.builtin.shell: |
        aws ecr describe-repositories \
          --repository-names "{{ ecr.repository_name }}" \
          --region "{{ aws.region }}" \
          --profile "{{ spike_account.profile_name }}" \
          --query 'repositories[0].repositoryUri' \
          --output text
      register: ecr_repository_uri
      changed_when: false

    - name: Set ECR facts
      ansible.builtin.set_fact:
        ecr_repository_uri: "{{ ecr_repository_uri.stdout }}"
        ecr_registry_url: "{{ ecr_repository_uri.stdout | regex_replace('/.*', '') }}"
        
    - name: Build container image for AMD64
      docker_image:
        build:
          path: ".."
          dockerfile: "Dockerfile"
          platform: "linux/amd64"
        name: "{{ container.image_name }}"
        tag: latest
        source: build
        
    - name: Tag image for ECR
      docker_image:
        name: "{{ container.image_name }}:latest"
        repository: "{{ ecr_repository_uri }}"
        tag: latest
        source: local
  
    - name: Get ECR authorization token
      ansible.builtin.shell: |
        aws ecr get-login-password \
          --profile "{{ spike_account.profile_name }}" \
          --region "{{ aws.region }}"
      register: ecr_password
      no_log: true
      changed_when: false

    - name: Login to ECR
      docker_login:
        registry_url: "{{ ecr_registry_url }}"
        username: AWS
        password: "{{ ecr_password.stdout }}"

    - name: Push image to ECR
      docker_image:
        name: "{{ ecr_repository_uri }}:latest"
        push: true
        source: local
    # ===================================
    # Display the results
    # ===================================
    - name: Display ECR repository information
      ansible.builtin.debug:
        msg:
          - "✅ ECR Repository Created/Verified"
          - "Repository Name: {{ container.image_name }}"
          - "Repository URI: {{ ecr_repository_uri }}"
          - "Registry URL: {{ ecr_registry_url }}"  


- name: Destroy ECR
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars/accounts.yaml
    - vars/frank-config.yaml
  tags: [never, cleanup]
  
  tasks:
    - name: Confirm destruction
      pause:
        prompt: "Are you sure you want to destroy all FRANK infrastructure? Type 'yes' to continue"
      register: confirm_destroy
      
    - name: Fail if not confirmed
      fail:
        msg: "Destruction cancelled"
      when: confirm_destroy.user_input != "yes"

    - name: Delete ECR repository
      ansible.builtin.shell: |
        aws ecr delete-repository \
          --repository-name "{{ ecr.repository_name }}" \
          --region "{{ aws.region }}" \
          --profile "{{ spike_account.profile_name }}" \
          --force
      register: ecr_delete_result
      failed_when: ecr_delete_result.rc != 0 and 'RepositoryNotFoundException' not in ecr_delete_result.stderr
      changed_when: ecr_delete_result.rc == 0 
    - name: Display ECR deletion result
      debug:
        msg:
          - "🗑️ ECR Repository Deleted {{ ecr.repository_name }}"
