- name: Get ECR repository URI
  ansible.builtin.shell: |
    aws ecr describe-repositories \
      --repository-names "{{ ecr.repository_name }}" \
      --region "{{ aws.region }}" \
      --profile "{{ spike_account.profile_name }}" \
      --query 'repositories[0].repositoryUri' \
      --output text
  register: ecr_repository_uri
  changed_when: false

- name: Set ECR facts
  ansible.builtin.set_fact:
    ecr_repository_uri: "{{ ecr_repository_uri.stdout }}"
    ecr_registry_url: "{{ ecr_repository_uri.stdout | regex_replace('/.*', '') }}"
    
- name: Build container image for AMD64
  docker_image:
    build:
      path: ".."
      dockerfile: "Dockerfile"
      platform: "linux/amd64"
    name: "{{ container.image_name }}"
    tag: latest
    source: build
    
- name: Tag image for ECR
  docker_image:
    name: "{{ container.image_name }}:latest"
    repository: "{{ ecr_repository_uri }}"
    tag: latest
    source: local

- name: Get ECR authorization token
  ansible.builtin.shell: |
    aws ecr get-login-password \
      --profile "{{ spike_account.profile_name }}" \
      --region "{{ aws.region }}"
  register: ecr_password
  no_log: true
  changed_when: false

- name: Login to ECR
  docker_login:
    registry_url: "{{ ecr_registry_url }}"
    username: AWS
    password: "{{ ecr_password.stdout }}"

- name: Push image to ECR
  docker_image:
    name: "{{ ecr_repository_uri }}:latest"
    push: true
    source: local
# ===================================
# Display the results
# ===================================
- name: Display ECR repository information
  ansible.builtin.debug:
    msg:
      - "✅ ECR Repository Created/Verified"
      - "Repository Name: {{ container.image_name }}"
      - "Repository URI: {{ ecr_repository_uri }}"
      - "Registry URL: {{ ecr_registry_url }}"  