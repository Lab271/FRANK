# ===================================
# Some dynamic values
# ===================================

- name: Generate bucket suffix
  set_fact:
    bucket_suffix: "123456"    
    # bucket_suffix: "{{ ansible_date_time.epoch | default(ansible_env.EPOCH | default('123456')) }}"    



- name: Deploy networking infrastructure
  amazon.aws.cloudformation:
    stack_name: "{{ project.name }}-networking"
    state: "present"
    disable_rollback: true
    region: "{{ aws.region }}"
    profile: "{{ spike_account.profile_name }}"
    template_body: "{{ lookup('file', 'templates/networking.yaml') }}"
    template_parameters:
      ProjectName: "{{ project.name }}"
      Environment: "{{ project.environment }}"
      NetworkVpcCidr: "{{ network.vpc_cidr }}"
      NetworkPublicSubnetCidrs: "{{ network.public_subnet_cidrs | join(',') }}"
      NetworkAvailabilityZones: "{{ network.availability_zones | join(',') }}"
      ContainerPort: "{{ container.port }}"
    tags:
      Project: "{{ project.name }}"
      Environment: "{{ project.environment }}"
      ManagedBy: "Ansible"
      Owner: "{{ project.owner }}"
    capabilities: 
      - CAPABILITY_IAM
    termination_protection: false
    # on_create_failure: DELETE
  register: networking_stack
  
- name: Get networking stack outputs
  set_fact:
    vpc_id: "{{ networking_stack.stack_outputs.VpcId }}"
    public_subnet_ids: "{{ networking_stack.stack_outputs.PublicSubnetIds }}"
    alb_security_group_id: "{{ networking_stack.stack_outputs.ALBSecurityGroupId }}"
    ecs_security_group_id: "{{ networking_stack.stack_outputs.ECSSecurityGroupId }}"

- name: Create S3 bucket for ALB access logs
  amazon.aws.s3_bucket:
    name: "{{ project.name }}-alb-logs-{{ bucket_suffix }}"
    region: "{{ aws.region }}"
    profile: "{{ spike_account.profile_name }}"
    versioning: false
    tags:
      Project: "{{ project.name }}"
      Environment: "{{ project.environment }}"
      ManagedBy: "Ansible"
      Owner: "{{ project.owner }}"
  register: alb_logs_bucket

- name: Configure S3 bucket lifecycle policy
  amazon.aws.s3_lifecycle:
    name: "{{ alb_logs_bucket.name }}"
    region: "{{ aws.region }}"
    profile: "{{ spike_account.profile_name }}"
    rules:
      - id: "delete-old-logs"
        status: enabled
        expiration_days: 90
        prefix: "alb-logs/"

- name: Set S3 bucket policy for ALB access logs
  amazon.aws.s3_bucket_policy:
    bucket: "{{ alb_logs_bucket.name }}"
    region: "{{ aws.region }}"
    profile: "{{ spike_account.profile_name }}"
    policy: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Effect": "Allow",
            "Principal": {
              "AWS": "arn:aws:iam::156460612806:root"
            },
            "Action": "s3:PutObject",
            "Resource": "arn:aws:s3:::{{ alb_logs_bucket.name }}/alb-logs/AWSLogs/{{ ansible_account_id }}/*"
          },
          {
            "Effect": "Allow",
            "Principal": {
              "Service": "delivery.logs.amazonaws.com"
            },
            "Action": "s3:PutObject",
            "Resource": "arn:aws:s3:::{{ alb_logs_bucket.name }}/alb-logs/AWSLogs/{{ ansible_account_id }}/*",
            "Condition": {
              "StringEquals": {
                "s3:x-amz-acl": "bucket-owner-full-control"
              }
            }
          },
          {
            "Effect": "Allow",
            "Principal": {
              "AWS": "arn:aws:iam::156460612806:root"
            },
            "Action": "s3:GetBucketAcl",
            "Resource": "arn:aws:s3:::{{ alb_logs_bucket.name }}"
          }
        ]
      }

# ===================================
# Deploy Load Balancer Infrastructure (CloudFormation)
# ===================================

- name: Deploy load balancer infrastructure
  amazon.aws.cloudformation:
    stack_name: "{{ project.name }}-load-balancer"
    state: "present"
    disable_rollback: true
    region: "{{ aws.region }}"
    profile: "{{ spike_account.profile_name }}"
    template_body: "{{ lookup('file', 'templates/load-balancer.yaml') }}"
    template_parameters:
      ProjectName: "{{ project.name }}"
      Environment: "{{ project.environment }}"
      VpcId: "{{ vpc_id }}"
      PublicSubnetIds: "{{ public_subnet_ids }}"
      ALBLogsBucket: "{{ alb_logs_bucket.name }}"
      ContainerPort: "{{ container.port }}"
      SSLCertificateArn: "{{ ssl.certificate_arn | default('') }}"
    tags:
      Project: "{{ project.name }}"
      Environment: "{{ project.environment }}"
      ManagedBy: "Ansible"
      Owner: "{{ project.owner }}"
    capabilities: 
      - CAPABILITY_IAM
    termination_protection: false
  register: load_balancer_stack

- name: Get load balancer stack outputs
  set_fact:
    load_balancer_arn: "{{ load_balancer_stack.stack_outputs.LoadBalancerArn }}"
    load_balancer_dns: "{{ load_balancer_stack.stack_outputs.LoadBalancerDNS }}"
    target_group_arn: "{{ load_balancer_stack.stack_outputs.TargetGroupArn }}"
    alb_security_group_id: "{{ load_balancer_stack.stack_outputs.ALBSecurityGroupId }}"
    load_balancer_zone_id: "{{ load_balancer_stack.stack_outputs.LoadBalancerZoneId }}"

