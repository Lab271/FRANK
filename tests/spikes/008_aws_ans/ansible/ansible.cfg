# ===================================
# FRANK 008 AWS Spike - Ansible Configuration
# ===================================

[defaults]
# Inventory and connection settings
inventory = hosts.ini
host_key_checking = False
stdout_callback = default
callback_result_format = yaml
bin_ansible_callbacks = True

# Disable inventory plugins to avoid AWS EC2 auto-detection
enable_plugins = 

# Performance settings
gathering = explicit
fact_caching = memory
fact_caching_timeout = 3600

forks = 10
pipelining = True

# Logging and output
log_path = logs/ansible.log
display_skipped_hosts = false
display_ok_hosts = true

# Suppress inventory warnings
inventory_unparsed_is_failed = false

# Retry settings
retry_files_enabled = True
retry_files_save_path = logs/

# AWS-specific settings
[inventory]
enable_plugins = amazon.aws.aws_ec2

[ssh_connection]
# SSH settings (not used for localhost but good to have)
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes

[colors]
# Colorized output
highlight = white
verbose = blue
warn = bright purple
error = red
debug = dark gray
deprecate = purple
skip = cyan
unreachable = red
ok = green
changed = yellow

force_color = True
nocows = 1