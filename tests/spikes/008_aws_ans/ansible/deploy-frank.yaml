# ===================================
# FRANK 008 AWS Spike - Ansible Deployment Playbook
# Deploys FRANK infrastructure across spike and main accounts
# ===================================

- name: Deploy FRANK Infrastructure
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars/accounts.yaml
    - vars/frank-config.yaml
  tasks:
    # ===================================
    # Pre-flight Checks
    # ===================================
    
    - name: Check AWS CLI is installed
      command: aws --version
      register: aws_version
      failed_when: false
      changed_when: false
      
    - name: Display AWS CLI version
      debug:
        msg: "AWS CLI Version: {{ aws_version.stdout }}"
      when: aws_version.rc == 0
      
    - name: Fail if AWS CLI not found
      fail:
        msg: "AWS CLI is not installed or not in PATH"
      when: aws_version.rc != 0
    
    - name: Verify spike account access
      aws_caller_info:
        profile: "{{ spike_account.profile_name }}"
      register: spike_identity
      
    - name: Display spike account identity
      debug:
        msg: "Spike Account: {{ spike_identity.account }} ({{ spike_identity.arn }})"

    # ===================================
    # Incorporate Playbooks
    # ===================================

    - block:
      - name: "Include Phase 1 playbook Message"
        debug:
          msg: |
            Starting Phase 1
      - name: Include Phase 1 playbook
        include_tasks: playbooks/phase1-core-infrastructure.yaml
      tags: [phase1]

    - block:
      - name: "Include Phase 2 playbook Message"
        debug:
          msg: |
            Starting Phase 2
      - name: Include Phase 2 playbook
        include_tasks: playbooks/phase2-cross-account-dns.yaml

    - block:
      - name: "Include Phase 3 playbook Message"
        debug:
          msg: |
            Starting Phase 3
      - name: Include Phase 3 playbook
        include_tasks: playbooks/phase3-database-integration.yaml

    - block:
      - name: "Include Phase 4 playbook Message"
        debug:
          msg: |
            Starting Phase 4
      - name: Include Phase 4 playbook
        include_tasks: playbooks/phase4-ssl-integration.yaml

    - block:
      - name: "Include Phase 5 playbook Message"
        debug:
          msg: |
            Starting Phase 5
      - name: Include Phase 5 playbook
        include_tasks: playbooks/phase5-database-seeding.yaml
      tags: [seed, phase6]

    - block:
      - name: "Include Phase 6 playbook Message"
        debug:
          msg: |
            Starting Phase 6
      - name: Include Phase 6 playbook
        include_tasks: playbooks/phase6-application-deployment.yaml
      tags: [deploy, phase6]