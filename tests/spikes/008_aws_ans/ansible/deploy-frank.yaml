---
# ===================================
# FRANK 008 AWS Spike - Ansible Deployment Playbook
# Deploys FRANK infrastructure across spike and main accounts
# ===================================

- name: Deploy FRANK Infrastructure
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars/accounts.yml
    - vars/frank-config.yml
  
  tasks:
    # ===================================
    # Pre-flight Checks
    # ===================================
    
    - name: Check AWS CLI is installed
      command: aws --version
      register: aws_version
      failed_when: false
      changed_when: false
      
    - name: Display AWS CLI version
      debug:
        msg: "AWS CLI Version: {{ aws_version.stdout }}"
      when: aws_version.rc == 0
      
    - name: Fail if AWS CLI not found
      fail:
        msg: "AWS CLI is not installed or not in PATH"
      when: aws_version.rc != 0
    
    - name: Verify spike account access
      aws_caller_info:
        profile: "{{ spike_account.profile_name }}"
      register: spike_identity
      
    - name: Display spike account identity
      debug:
        msg: "Spike Account: {{ spike_identity.account }} ({{ spike_identity.arn }})"
        
    - name: Verify main account access via cross-account role
      sts_assume_role:
        role_arn: "{{ main_account.cross_account_role_arn }}"
        role_session_name: "ansible-frank-deployment"
        external_id: "{{ main_account.external_id }}"
        profile: "{{ spike_account.profile_name }}"
      register: main_account_credentials
      
    - name: Display main account access
      debug:
        msg: "Cross-account access to main account successful"

    # ===================================
    # Deploy Networking Stack (Spike Account)
    # ===================================
    
    - name: Deploy networking infrastructure
      amazon.aws.cloudformation:
        stack_name: "{{ project.name }}-networking"
        state: present
        region: "{{ aws.region }}"
        profile: "{{ spike_account.profile_name }}"
        template_body: "{{ lookup('file', 'templates/networking.yaml') }}"
        template_parameters:
          ProjectName: "{{ project.name }}"
          Environment: "{{ project.environment }}"
          NetworkVpcCidr: "{{ network.vpc_cidr }}"
          NetworkPublicSubnetCidrs: "{{ network.public_subnet_cidrs | join(',') }}"
          NetworkAvailabilityZones: "{{ network.availability_zones | join(',') }}"
          ContainerPort: "{{ container.port }}"
        tags:
          Project: "{{ project.name }}"
          Environment: "{{ project.environment }}"
          ManagedBy: "Ansible"
          Owner: "{{ project.owner }}"
        capabilities: 
          - CAPABILITY_IAM
        termination_protection: false
      register: networking_stack
      
    - name: Get networking stack outputs
      set_fact:
        vpc_id: "{{ networking_stack.stack_outputs.VpcId }}"
        public_subnet_ids: "{{ networking_stack.stack_outputs.PublicSubnetIds }}"
        alb_security_group_id: "{{ networking_stack.stack_outputs.ALBSecurityGroupId }}"
        ecs_security_group_id: "{{ networking_stack.stack_outputs.ECSSecurityGroupId }}"

    # ===================================
    # Deploy SSL Certificate (Spike Account) 
    # ===================================
    
    - name: Deploy SSL certificate
      amazon.aws.cloudformation:
        stack_name: "{{ project.name }}-ssl-cert"
        state: present
        region: "{{ aws.region }}"
        profile: "{{ spike_account.profile_name }}"
        template_body: "{{ lookup('file', 'templates/ssl-cert.yaml') }}"
        template_parameters:
          ProjectName: "{{ project.name }}"
          Environment: "{{ project.environment }}"
          DomainName: "{{ domain.name }}"
          SslSubjectAlternativeNames: "{{ ssl.subject_alternative_names | join(',') }}"
          SslValidationMethod: "{{ ssl.validation_method }}"
        tags:
          Project: "{{ project.name }}"
          Environment: "{{ project.environment }}"
          ManagedBy: "Ansible"
        capabilities:
          - CAPABILITY_IAM
      register: ssl_cert_stack
      
    - name: Get SSL certificate outputs
      set_fact:
        certificate_arn: "{{ ssl_cert_stack.stack_outputs.CertificateArn }}"
        validation_records: "{{ ssl_cert_stack.stack_outputs.ValidationRecords }}"

    # ===================================
    # Deploy Load Balancer (Spike Account)
    # ===================================
    
    - name: Deploy load balancer
      amazon.aws.cloudformation:
        stack_name: "{{ project.name }}-load-balancer"
        state: present
        region: "{{ aws.region }}"
        profile: "{{ spike_account.profile_name }}"
        template_body: "{{ lookup('file', 'templates/load-balancer.yaml') }}"
        template_parameters:
          ProjectName: "{{ project.name }}"
          Environment: "{{ project.environment }}"
          VpcId: "{{ vpc_id }}"
          PublicSubnetIds: "{{ public_subnet_ids }}"
          ALBSecurityGroupId: "{{ alb_security_group_id }}"
          ContainerPort: "{{ container.port }}"
          LoadBalancerHealthCheckPath: "{{ load_balancer.health_check_path }}"
          LoadBalancerHealthCheckInterval: "{{ load_balancer.health_check_interval }}"
          LoadBalancerHealthCheckTimeout: "{{ load_balancer.health_check_timeout }}"
          LoadBalancerHealthyThreshold: "{{ load_balancer.healthy_threshold }}"
          LoadBalancerUnhealthyThreshold: "{{ load_balancer.unhealthy_threshold }}"
        tags:
          Project: "{{ project.name }}"
          Environment: "{{ project.environment }}"
          ManagedBy: "Ansible"
        capabilities:
          - CAPABILITY_IAM
      register: load_balancer_stack
      
    - name: Get load balancer outputs
      set_fact:
        load_balancer_arn: "{{ load_balancer_stack.stack_outputs.LoadBalancerArn }}"
        load_balancer_dns: "{{ load_balancer_stack.stack_outputs.LoadBalancerDNS }}"
        load_balancer_zone_id: "{{ load_balancer_stack.stack_outputs.LoadBalancerZoneId }}"
        target_group_arn: "{{ load_balancer_stack.stack_outputs.TargetGroupArn }}"

    # ===================================
    # Deploy Route53 DNS Records (Main Account)
    # ===================================
    
    - name: Deploy DNS records in main account
      amazon.aws.cloudformation:
        stack_name: "{{ project.name }}-route53"
        state: present
        region: "{{ aws.region }}"
        template_body: "{{ lookup('file', 'templates/route53.yaml') }}"
        template_parameters:
          ProjectName: "{{ project.name }}"
          Environment: "{{ project.environment }}"
          DomainName: "{{ domain.name }}"
          DomainHostedZone: "{{ domain.hosted_zone }}"
          DomainHostedZoneId: "{{ domain.hosted_zone_id }}"
          LoadBalancerDNS: "{{ load_balancer_dns }}"
          LoadBalancerZoneId: "{{ load_balancer_zone_id }}"
          ValidationRecords: "{{ validation_records }}"
        tags:
          Project: "{{ project.name }}"
          Environment: "{{ project.environment }}"
          ManagedBy: "Ansible"
        capabilities:
          - CAPABILITY_IAM
        aws_access_key: "{{ main_account_credentials.sts_creds.access_key }}"
        aws_secret_key: "{{ main_account_credentials.sts_creds.secret_key }}"
        security_token: "{{ main_account_credentials.sts_creds.session_token }}"
      register: route53_stack

    # ===================================
    # Wait for SSL Certificate Validation
    # ===================================
    
    - name: Wait for SSL certificate validation
      amazon.aws.aws_acm_info:
        certificate_arn: "{{ certificate_arn }}"
        region: "{{ aws.region }}"
        profile: "{{ spike_account.profile_name }}"
      register: cert_info
      until: cert_info.certificates[0].status == "ISSUED"
      retries: 20
      delay: 30
      
    - name: Display certificate status
      debug:
        msg: "SSL Certificate Status: {{ cert_info.certificates[0].status }}"

    # ===================================
    # Deploy ECS Infrastructure (Spike Account)
    # ===================================
    
    - name: Deploy ECS infrastructure
      amazon.aws.cloudformation:
        stack_name: "{{ project.name }}-ecs"
        state: present
        region: "{{ aws.region }}"
        profile: "{{ spike_account.profile_name }}"
        template_body: "{{ lookup('file', 'templates/ecs.yaml') }}"
        template_parameters:
          ProjectName: "{{ project.name }}"
          Environment: "{{ project.environment }}"
          VpcId: "{{ vpc_id }}"
          PublicSubnetIds: "{{ public_subnet_ids }}"
          ECSSecurityGroupId: "{{ ecs_security_group_id }}"
          TargetGroupArn: "{{ target_group_arn }}"
          ContainerPort: "{{ container.port }}"
          ContainerCpu: "{{ container.cpu }}"
          ContainerMemory: "{{ container.memory }}"
          ContainerDesiredCount: "{{ container.desired_count }}"
          EcrRepositoryName: "{{ container.image_name }}"
          LoggingRetentionDays: "{{ logging.retention_days }}"
        tags:
          Project: "{{ project.name }}"
          Environment: "{{ project.environment }}"
          ManagedBy: "Ansible"
        capabilities:
          - CAPABILITY_NAMED_IAM
      register: ecs_stack
      
    - name: Get ECS stack outputs
      set_fact:
        ecr_repository_url: "{{ ecs_stack.stack_outputs.ECRRepositoryURL }}"
        ecs_cluster_name: "{{ ecs_stack.stack_outputs.ECSClusterName }}"
        ecs_service_name: "{{ ecs_stack.stack_outputs.ECSServiceName }}"

    # ===================================
    # Container Build and Deployment
    # ===================================
    
    - name: Get ECR login token
      amazon.aws.aws_ecr:
        name: "{{ container.image_name }}"
        region: "{{ aws.region }}"
        profile: "{{ spike_account.profile_name }}"
      register: ecr_repo
      
    - name: Login to ECR
      docker_login:
        registry_url: "{{ ecr_repository_url.split('/')[0] }}"
        username: AWS
        password: "{{ ecr_repo.authorization_token }}"
        
    - name: Build container image for AMD64
      docker_image:
        build:
          path: "."
          dockerfile: "Dockerfile"
          platform: "linux/amd64"
        name: "frank-spike"
        tag: latest
        source: build
        
    - name: Tag image for ECR
      docker_image:
        name: "frank-spike:latest"
        repository: "{{ ecr_repository_url }}"
        tag: latest
        source: local
        
    - name: Push image to ECR
      docker_image:
        name: "{{ ecr_repository_url }}"
        tag: latest
        push: yes
        source: local

    - name: Force ECS service update
      amazon.aws.ecs_service:
        state: present
        name: "{{ ecs_service_name }}"
        cluster: "{{ ecs_cluster_name }}"
        region: "{{ aws.region }}"
        profile: "{{ spike_account.profile_name }}"
        force_new_deployment: yes
        
    - name: Wait for ECS service to be stable
      amazon.aws.ecs_service_info:
        cluster: "{{ ecs_cluster_name }}"
        service: "{{ ecs_service_name }}"
        details: yes
        region: "{{ aws.region }}"
        profile: "{{ spike_account.profile_name }}"
      register: service_info
      until: service_info.services[0].deployments[0].status == "PRIMARY" and service_info.services[0].deployments[0].running_count >= 1
      retries: 30
      delay: 30

    # ===================================
    # Deployment Validation
    # ===================================
    
    - name: Wait for application to be ready
      uri:
        url: "https://{{ domain.name }}/health"
        method: GET
        status_code: 200
      register: health_check
      until: health_check.status == 200
      retries: 10
      delay: 30
      ignore_errors: yes
      
    - name: Display deployment results
      debug:
        msg: |
          🎉 FRANK Deployment Complete!
          
          Application URL: https://{{ domain.name }}
          Health Check: https://{{ domain.name }}/health
          API Docs: https://{{ domain.name }}/docs
          
          Infrastructure:
          - VPC ID: {{ vpc_id }}
          - Load Balancer: {{ load_balancer_dns }}
          - ECS Cluster: {{ ecs_cluster_name }}
          - ECR Repository: {{ ecr_repository_url }}
          
          SSL Certificate: {{ certificate_arn }}
          Health Status: {{ 'Healthy' if health_check.status == 200 else 'Unhealthy' }}

# ===================================
# Cleanup Playbook (Separate Play)
# ===================================

- name: Cleanup FRANK Infrastructure
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars/accounts.yml
    - vars/frank-config.yml
  tags: [never, cleanup]
  
  tasks:
    - name: Confirm destruction
      pause:
        prompt: "Are you sure you want to destroy all FRANK infrastructure? Type 'yes' to continue"
      register: confirm_destroy
      
    - name: Fail if not confirmed
      fail:
        msg: "Destruction cancelled"
      when: confirm_destroy.user_input != "yes"
    
    - name: Delete stacks in reverse order
      amazon.aws.cloudformation:
        stack_name: "{{ item.stack_name }}"
        state: absent
        region: "{{ aws.region }}"
        profile: "{{ item.profile | default(spike_account.profile_name) }}"
        aws_access_key: "{{ item.access_key | default(omit) }}"
        aws_secret_key: "{{ item.secret_key | default(omit) }}"
        security_token: "{{ item.session_token | default(omit) }}"
      loop:
        - stack_name: "{{ project.name }}-ecs"
        - stack_name: "{{ project.name }}-route53"
          profile: "{{ main_account.profile_name }}"
        - stack_name: "{{ project.name }}-load-balancer"
        - stack_name: "{{ project.name }}-ssl-cert"
        - stack_name: "{{ project.name }}-networking"
      ignore_errors: yes
      
    - name: Display cleanup completion
      debug:
        msg: "🗑️ FRANK infrastructure cleanup completed"