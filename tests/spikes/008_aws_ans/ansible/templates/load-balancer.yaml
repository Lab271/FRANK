AWSTemplateFormatVersion: '2010-09-09'
Description: 'FRANK Platform - Application Load Balancer Infrastructure'

Parameters:
  ProjectName:
    Type: String
    Description: Name of the project
  Environment:
    Type: String
    Description: Environment (spike, staging, production)
  VpcId:
    Type: String
    Description: VPC ID for the load balancer
  PublicSubnetIds:
    Type: CommaDelimitedList
    Description: List of public subnet IDs
  ALBLogsBucketName:
    Type: String
    Description: S3 bucket name for ALB access logs
  ContainerPort:
    Type: Number
    Description: Container port for target group
    Default: 8000
  SSLCertificateArn:
    Type: String
    Description: ARN of SSL certificate
    Default: ""
  Owner:
    Type: String
    Description: Owner of the project

Conditions:
  HasSSLCertificate: !Not [!Equals [!Ref SSLCertificateArn, ""]]
  NoSSLCertificate: !Equals [!Ref SSLCertificateArn, ""]

Resources:
  # S3 bucket for ALB access logs and lifecycle policy for log retention
  # ALBLogsBucket:
  #   Type: AWS::S3::Bucket
  #   Properties:
  #     BucketName: !Ref ALBLogsBucketName
  #     LifecycleConfiguration:
  #       Rules:
  #         - Id: delete-old-logs
  #           Status: Enabled
  #           ExpirationInDays: 90
  #           Prefix: alb-logs/
  #     Tags:
  #       - Key: Project
  #         Value: !Ref ProjectName
  #       - Key: Environment
  #         Value: !Ref Environment
  #       - Key: ManagedBy
  #         Value: Ansible
  #       - Key: Owner
  #         Value: !Ref Owner

  # S3 bucket policy to allow ALB access log delivery and required permissions     
  ALBLogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ALBLogsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: arn:aws:iam::156460612806:root
            Action: s3:PutObject
            Resource: !Sub arn:aws:s3:::${ALBLogsBucket}/alb-logs/AWSLogs/${AWS::AccountId}/*
          - Effect: Allow
            Principal:
              Service: delivery.logs.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub arn:aws:s3:::${ALBLogsBucket}/alb-logs/AWSLogs/${AWS::AccountId}/*
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control
          - Effect: Allow
            Principal:
              AWS: arn:aws:iam::156460612806:root
            Action: s3:GetBucketAcl
            Resource: !Sub arn:aws:s3:::${ALBLogsBucket}

  # ALB Security Group
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${ProjectName}-alb-sg"
      GroupDescription: Security group for FRANK Application Load Balancer
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP traffic
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS traffic
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-alb-sg"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  # Application Load Balancer
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${ProjectName}-alb"
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      SecurityGroups:
        - !Ref ALBSecurityGroup
      Subnets: !Ref PublicSubnetIds
      LoadBalancerAttributes:
        - Key: access_logs.s3.enabled
          Value: true
        - Key: access_logs.s3.bucket
          Value: !Ref ALBLogsBucketName
        - Key: access_logs.s3.prefix
          Value: alb-logs
        - Key: idle_timeout.timeout_seconds
          Value: 60
        - Key: deletion_protection.enabled
          Value: false
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-alb"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  # Target Group
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${ProjectName}-tg"
      Protocol: HTTP
      Port: !Ref ContainerPort
      VpcId: !Ref VpcId
      TargetType: ip
      HealthCheckProtocol: HTTP
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: 200
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-tg"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  # HTTP Listener (redirect to HTTPS)
  HTTPListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: 443
            StatusCode: HTTP_301

  # HTTPS Listener (conditional)
  HTTPSListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasSSLCertificate
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Protocol: HTTPS
      Port: 443
      Certificates:
        - CertificateArn: !Ref SSLCertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # HTTP Listener for non-SSL (fallback)
  HTTPListenerFallback:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: NoSSLCertificate
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

Outputs:
  LoadBalancerArn:
    Description: ARN of the Application Load Balancer
    Value: !Ref ApplicationLoadBalancer
    Export:
      Name: !Sub "${ProjectName}-${Environment}-LoadBalancerArn"

  LoadBalancerDNS:
    Description: DNS name of the Application Load Balancer
    Value: !GetAtt ApplicationLoadBalancer.DNSName
    Export:
      Name: !Sub "${ProjectName}-${Environment}-LoadBalancerDNS"

  TargetGroupArn:
    Description: ARN of the Target Group
    Value: !Ref TargetGroup
    Export:
      Name: !Sub "${ProjectName}-${Environment}-TargetGroupArn"

  ALBSecurityGroupId:
    Description: ID of the ALB Security Group
    Value: !Ref ALBSecurityGroup
    Export:
      Name: !Sub "${ProjectName}-${Environment}-ALBSecurityGroupId"

  LoadBalancerZoneId:
    Description: Canonical hosted zone ID of the load balancer
    Value: !GetAtt ApplicationLoadBalancer.CanonicalHostedZoneID
    Export:
      Name: !Sub "${ProjectName}-${Environment}-LoadBalancerZoneId"