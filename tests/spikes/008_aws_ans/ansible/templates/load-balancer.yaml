AWSTemplateFormatVersion: '2010-09-09'
Description: 'FRANK 008 AWS Spike - Application Load Balancer and Target Groups'

Parameters:
  ProjectName:
    Type: String
    Default: frank-008-aws
    Description: Project name for resource naming
  
  Environment:
    Type: String
    Default: spike
    Description: Environment name
  
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID from networking stack
  
  PublicSubnetIds:
    Type: CommaDelimitedList
    Description: Public subnet IDs from networking stack
  
  ALBSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: ALB Security Group ID from networking stack
  
  ContainerPort:
    Type: Number
    Default: 8000
    Description: Port for container application
  
  LoadBalancerHealthCheckPath:
    Type: String
    Default: "/health"
    Description: Health check path
  
  LoadBalancerHealthCheckInterval:
    Type: Number
    Default: 30
    Description: Health check interval in seconds
  
  LoadBalancerHealthCheckTimeout:
    Type: Number
    Default: 5
    Description: Health check timeout in seconds
  
  LoadBalancerHealthyThreshold:
    Type: Number
    Default: 2
    Description: Healthy threshold count
  
  LoadBalancerUnhealthyThreshold:
    Type: Number
    Default: 3
    Description: Unhealthy threshold count

Resources:
  # ===================================
  # S3 Bucket for ALB Access Logs
  # ===================================
  
  ALBLogsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-alb-logs-${AWS::AccountId}-${AWS::Region}"
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldLogs
            Status: Enabled
            ExpirationInDays: 30
            NoncurrentVersionExpirationInDays: 1
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-alb-logs"
        - Key: Project
          Value: FRANK
        - Key: Environment
          Value: !Ref Environment
  
  ALBLogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ALBLogsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AWSLogDeliveryWrite
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::054676820928:root'  # EU-Central-1 ELB service account
            Action: 's3:PutObject'
            Resource: !Sub '${ALBLogsBucket}/*'
          - Sid: AWSLogDeliveryAclCheck
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::054676820928:root'  # EU-Central-1 ELB service account
            Action: 's3:GetBucketAcl'
            Resource: !Ref ALBLogsBucket
  
  # ===================================
  # Application Load Balancer
  # ===================================
  
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    # DependsOn: ALBLogsBucketPolicy
    Properties:
      Name: !Sub "${ProjectName}-alb"
      Type: application
      Scheme: internet-facing
      SecurityGroups:
        - !Ref ALBSecurityGroupId
      Subnets: !Ref PublicSubnetIds
      LoadBalancerAttributes:
        - Key: deletion_protection.enabled
          Value: 'false'
        - Key: access_logs.s3.enabled
          Value: 'true'
        - Key: access_logs.s3.bucket
          Value: !Ref ALBLogsBucket
        - Key: access_logs.s3.prefix
          Value: 'alb-logs'
        - Key: idle_timeout.timeout_seconds
          Value: '60'
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-alb"
        - Key: Project
          Value: FRANK
        - Key: Environment
          Value: !Ref Environment
  
  # ===================================
  # Target Group
  # ===================================
  
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${ProjectName}-tg"
      Port: !Ref ContainerPort
      Protocol: HTTP
      VpcId: !Ref VpcId
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckPath: !Ref LoadBalancerHealthCheckPath
      HealthCheckProtocol: HTTP
      HealthCheckPort: traffic-port
      HealthCheckIntervalSeconds: !Ref LoadBalancerHealthCheckInterval
      HealthCheckTimeoutSeconds: !Ref LoadBalancerHealthCheckTimeout
      HealthyThresholdCount: !Ref LoadBalancerHealthyThreshold
      UnhealthyThresholdCount: !Ref LoadBalancerUnhealthyThreshold
      Matcher:
        HttpCode: '200'
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'
        - Key: stickiness.enabled
          Value: 'false'
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-tg"
        - Key: Project
          Value: FRANK
        - Key: Environment
          Value: !Ref Environment
  
  # ===================================
  # HTTP Listener (Redirect to HTTPS)
  # ===================================
  
  HTTPListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: '443'
            StatusCode: HTTP_301
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-http-listener"
        - Key: Project
          Value: FRANK
        - Key: Environment
          Value: !Ref Environment

Outputs:
  LoadBalancerArn:
    Description: Application Load Balancer ARN
    Value: !Ref ApplicationLoadBalancer
    Export:
      Name: !Sub "${AWS::StackName}-LoadBalancerArn"
  
  LoadBalancerDNS:
    Description: Application Load Balancer DNS name
    Value: !GetAtt ApplicationLoadBalancer.DNSName
    Export:
      Name: !Sub "${AWS::StackName}-LoadBalancerDNS"
  
  LoadBalancerZoneId:
    Description: Application Load Balancer hosted zone ID
    Value: !GetAtt ApplicationLoadBalancer.CanonicalHostedZoneID
    Export:
      Name: !Sub "${AWS::StackName}-LoadBalancerZoneId"
  
  LoadBalancerFullName:
    Description: Application Load Balancer full name (for metrics)
    Value: !GetAtt ApplicationLoadBalancer.LoadBalancerFullName
    Export:
      Name: !Sub "${AWS::StackName}-LoadBalancerFullName"
  
  TargetGroupArn:
    Description: Target Group ARN
    Value: !Ref TargetGroup
    Export:
      Name: !Sub "${AWS::StackName}-TargetGroupArn"
  
  TargetGroupFullName:
    Description: Target Group full name (for metrics)
    Value: !GetAtt TargetGroup.TargetGroupFullName
    Export:
      Name: !Sub "${AWS::StackName}-TargetGroupFullName"
  
  HTTPListenerArn:
    Description: HTTP Listener ARN
    Value: !Ref HTTPListener
    Export:
      Name: !Sub "${AWS::StackName}-HTTPListenerArn"
  
  ALBLogsBucketName:
    Description: S3 bucket name for ALB access logs
    Value: !Ref ALBLogsBucket
    Export:
      Name: !Sub "${AWS::StackName}-ALBLogsBucketName"