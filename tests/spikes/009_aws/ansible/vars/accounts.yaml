---
# ===================================
# FRANK 008 AWS Spike - Account Configuration
# AWS account details and cross-account settings
# ===================================

# Spike Account Configuration
# spike_account:
#   account_id: "111111111111"  # Replace with your spike account ID
#   profile_name: "spike-account"  # AWS profile name for spike account
#   region: "eu-central-1"
#   description: "Isolated spike account for FRANK testing"

spike_account:
  profile_name: "spike-account"
  region: "eu-central-1"
  account_id: "036820509873"
  environment: "spike"

# Main Account Configuration  
main_account:
  account_id: "222222222222"  # Replace with your main account ID
  profile_name: "main-account"  # AWS profile name for main account
  region: "eu-central-1"
  description: "Main account containing Route53 hosted zone"
  
  # Cross-account role details
  cross_account_role_arn: "arn:aws:iam::222222222222:role/FrankRoute53CrossAccountRole"
  cross_account_role_name: "FrankRoute53CrossAccountRole"
  session_name: "ansible-frank-deployment"
  external_id: "frank-008-unique-external-id-2025"

# AWS Region Configuration
aws:
  region: "eu-central-1"
  
# Cross-Account Role Trust Policy (for reference)
cross_account_trust_policy:
  Version: "2012-10-17"
  Statement:
    - Effect: "Allow"
      Principal:
        AWS: "arn:aws:iam::111111111111:root"  # Spike account
      Action: "sts:AssumeRole"
      Condition:
        StringEquals:
          "sts:ExternalId": "frank-008-unique-external-id-2025"
        StringLike:
          "aws:userid": "*:ansible-frank-deployment"

# Cross-Account Role Permissions Policy (for reference)
cross_account_permissions_policy:
  Version: "2012-10-17"
  Statement:
    - Effect: "Allow"
      Action:
        - "route53:ListHostedZones"
        - "route53:GetHostedZone"
      Resource: "*"
    - Effect: "Allow"
      Action:
        - "route53:ChangeResourceRecordSets"
        - "route53:GetChange"
      Resource:
        - "arn:aws:route53:::hostedzone/Z1234567890ABC"  # Replace with actual zone ID
        - "arn:aws:route53:::change/*"