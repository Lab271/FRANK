# ansible/group_vars/all.yml
# CloudFormation Change Set Configuration

# =================================================================
# RESOURCE MANAGEMENT STRATEGY
# =================================================================

# Enable change set deployment (recommended for production)
use_changeset_deployment: true

# Enable resource import for existing DynamoDB tables
use_resource_import: false

# Require manual review of change sets before execution
changeset_review_required: true

# =================================================================
# RESOURCE CHECK CONFIGURATION  
# =================================================================

# Critical resources to check before deployment (Tier 1)
# These are most likely to exist independently and cause CREATE_FAILED
critical_resources_to_check:
  - resource_type: "AWS::DynamoDB::Table"
    logical_id: "DynamoDBTable"
    check_method: "describe_table"
    identifier: "{{ stack_name }}-data"
    
  - resource_type: "AWS::DynamoDB::Table" 
    logical_id: "DynamoDBAuditTable"
    check_method: "describe_table"
    identifier: "{{ stack_name }}-audit"
    
  - resource_type: "AWS::ECS::Cluster"
    logical_id: "ECSCluster"
    check_method: "describe_clusters"
    identifier: "{{ stack_name }}-cluster"
    
  - resource_type: "AWS::Logs::LogGroup"
    logical_id: "LogGroup"
    check_method: "describe_log_groups"
    identifier: "/ecs/{{ stack_name }}"
    
  - resource_type: "AWS::EC2::VPC"
    logical_id: "VPC" 
    check_method: "describe_vpcs"
    identifier: "{{ stack_name }}-vpc"
    tag_based: true

# Expensive resources to check (Tier 2) - Cost implications
expensive_resources_to_check:
  - resource_type: "AWS::EC2::NatGateway"
    logical_ids: ["NATGateway1", "NATGateway2", "NATGateway3"]
    check_method: "describe_nat_gateways"
    cost_impact: true
    
  - resource_type: "AWS::EC2::EIP"
    logical_ids: ["NATGatewayEIP1", "NATGatewayEIP2", "NATGatewayEIP3"] 
    check_method: "describe_addresses"
    cost_impact: true

# Resources that typically don't conflict (Tier 3)
# Usually safe to create without checks:
# - Subnets, Route Tables, Security Groups
# - IAM Roles, Policies (with unique names)
# - Target Groups, Listeners
# - Task Definitions, Services

# =================================================================
# DEPLOYMENT FAILURE HANDLING
# =================================================================

# Action to take when existing resources are found
existing_resource_action: "changeset"  # Options: changeset, import, skip, fail

# Backup strategy for critical resources before import/update
backup_critical_resources: true

# DynamoDB specific settings
dynamodb_backup_before_import: true
dynamodb_point_in_time_recovery_check: true

# =================================================================
# CHANGE SET CONFIGURATION
# =================================================================

# Maximum time to wait for change set creation (seconds)
changeset_create_timeout: 300

# Maximum time to wait for change set execution (seconds)  
changeset_execute_timeout: 1800

# Auto-approve change sets with only these action types
auto_approve_actions:
  - "Add"
  - "Modify"
  # Note: "Remove" and "Import" require manual approval

# Change set naming pattern
changeset_name_pattern: "{{ stack_name }}-changeset-{{ ansible_date_time.epoch }}"

# =================================================================
# ROLLBACK AND RECOVERY
# =================================================================

# Enable automatic rollback on deployment failure
enable_automatic_rollback: true

# Retain resources on stack deletion
retain_critical_resources: true

# Stack policies to prevent accidental deletions
use_stack_policy: true

# =================================================================
# MONITORING AND ALERTS
# =================================================================

# Enable CloudFormation drift detection after deployment
enable_drift_detection: true

# Send notifications on stack events
enable_stack_notifications: false
sns_topic_arn: ""

# =================================================================
# MULTI-ACCOUNT CONSIDERATIONS
# =================================================================

# Include AWS Account ID in resource names to avoid conflicts
include_account_id_in_names: true

# Cross-account resource sharing settings
enable_cross_account_access: false

# =================================================================
# ENVIRONMENT-SPECIFIC OVERRIDES
# =================================================================

# Development environment - less strict
development:
  changeset_review_required: false
  auto_approve_actions: ["Add", "Modify", "Remove"]
  backup_critical_resources: false

# Production environment - very strict  
production:
  changeset_review_required: true
  auto_approve_actions: ["Add"]
  backup_critical_resources: true
  enable_stack_notifications: true