---
- name: Deploy FRANK AWS Infrastructure
  hosts: localhost
  connection: local
  gather_facts: yes
  
  vars:
    # Default variables (can be overridden with -e)
    stack_name: frank-009-stage4
    aws_region: eu-central-1
    aws_profile: spike-account
    main_account_profile: main-account
    # image_tag is set dynamically from FRANK version, but can be overridden with -e image_tag_override=<version>
    main_domain: "lab271.io"
    spike_subdomain: "{{ stack_name }}.{{ main_domain }}"
    cloudformation_template: "{{ stack_name }}-infra.yaml"
    
    # SSL certificate ARN (will be determined during execution)
    ssl_certificate_arn: ""
    
  tasks:
    # Prerequisites
    - include_tasks: tasks/prerequisites.yml
      tags: [never, requisites]

    - block:
      - name: Get FRANK version from Python package
        command: python -c "import frank; print(frank.__version__)"
        register: frank_version_result
        changed_when: false
        delegate_to: localhost

      - name: Set version and image tag facts
        set_fact:
          frank_version: "{{ frank_version_result.stdout.strip() }}"
          image_tag: "{{ image_tag_override | default(frank_version_result.stdout.strip()) }}"

      - name: Get AWS Account ID
        command: aws sts get-caller-identity --profile {{ aws_profile }} --query Account --output text
        register: aws_account_id_result
        changed_when: false

      - name: Set AWS Account ID fact
        set_fact:
          aws_account_id: "{{ aws_account_id_result.stdout }}"
          ecr_url: "{{ aws_account_id_result.stdout }}.dkr.ecr.{{ aws_region }}.amazonaws.com"
          container_image: "{{ aws_account_id_result.stdout }}.dkr.ecr.{{ aws_region }}.amazonaws.com/{{ stack_name }}:{{ image_tag }}"

      - name: Display deployment information
        debug:
          msg:
            - "=== FRANK AWS Infrastructure Deployment ==="
            - "FRANK Version: {{ frank_version }}"
            - "Stack Name: {{ stack_name }}"
            - "Region: {{ aws_region }}"
            - "Profile: {{ aws_profile }}"
            - "AWS Account ID: {{ aws_account_id }}"
            - "ECR URL: {{ ecr_url }}"
            - "Spike Domain: {{ spike_subdomain }}"
      tags: always

    
    # SSL Certificate lookup
    - import_tasks: tasks/ssl.yml
      tags: 
        - never
        - ssl
        - create
        - update
    
    # Docker build operations
    - import_tasks: tasks/docker_build.yml
      tags:
        - never
        - docker
        - create
        - update
        - build

    # CloudFormation deployment
    - import_tasks: tasks/cloudformation.yml
      tags:
        - never
        - cloudformation
        - infrastructure
        - create
        - update

    # Docker deployment operations
    - import_tasks: tasks/docker_deploy.yml
      tags:
        - never
        - docker        
        - create
        - update
        - deploy

    # Cleanup operations
    - import_tasks: tasks/cleanup.yml
      tags:
        - never
        - cleanup
        - delete
        - destroy
    
    # Final status
    - name: Display completion message
      debug:
        msg: 
          - "=== Deployment Complete ==="
          - "Stack: {{ stack_name }}"
          - "Status: Success"
      tags: always