#
# FRANK Platform - Stage 3 Local Development Docker Compose Configuration
# Feedbackinfrastructuur voor cyberRisico Analyse en Netwerk Kennisdeling
#
# This Docker Compose configuration sets up a complete local development
# environment for the FRANK Platform Stage 3 with the following components:
#
# Services:
# - nginx-lb: Load balancer with SSL termination (ports 80/443)
# - frank-app-1: Primary API instance (port 8000)
# - frank-app-2: Secondary API instance (port 8001)
# - localstack: AWS services emulation (DynamoDB on port 4566)
# - dynamodb-admin: Web UI for DynamoDB management (port 8100)
#
# Usage:
#   docker-compose up -d              # Start all services
#   docker-compose down               # Stop and remove containers
#   docker-compose logs frank-app-1   # View logs for specific service
#
# Prerequisites:
# - Docker and Docker Compose installed
# - SSL certificates in ../ssl-certs/ directory
# - nginx-lb.conf configuration file
# - FRANK application built and ready for containerization
#
# Copyright (c) 2025 Schuberg Philis B.V.
# SPDX-License-Identifier: Apache-2.0

x-frank-app-common: &frank-app-common
  build: 
    context: ../../..  # we are in ./local
    dockerfile: stages/stage3/Dockerfile
    args:
      BUILD_CONTEXT: stages/stage3
      PACKAGE_CONTEXT: .
  depends_on:
    localstack:
      condition: service_started
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 40s
  networks:
    - localstack-net
  volumes:
    - ../frank_stage3.py:/app/frank_api.py:ro  # Mount source file for auto-reload
    - ../../../src:/app/src:ro  # Mount source code for auto-reload

x-aws-credentials: &aws-credentials
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_DEFAULT_REGION: eu-west-1
  AWS_REGION: eu-west-1

x-frank-app-env: &frank-app-env
  <<: *aws-credentials
  FRANK_ENVIRONMENT: localstack
  ENDPOINT: http://localstack:4566
  COGNITO_URL: http://mock-cognito:8100
  VALIDATION_STRATEGY: server_first
  USER_POOL_ID: eu-west-1_MOCKPOOL
  DYNAMODB_TABLE: frank-data
  DYNAMODB_AUDIT_TABLE: frank-audit
  LOG_LEVEL: debug
  RELOAD: true  # Enable auto-reload for development

services:
  nginx-lb:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    container_name: nginx-lb
    volumes:
      - ./nginx-lb.conf:/etc/nginx/nginx.conf
      - ../.ssl-certs/nginx.crt:/etc/nginx/ssl/nginx.crt:ro
      - ../.ssl-certs/nginx.key:/etc/nginx/ssl/nginx.key:ro
    depends_on:
      - frank-app-1
      - frank-app-2
    networks:
      - localstack-net

  frank-app-1:
    <<: *frank-app-common
    container_name: frank-api-1
    ports:
      - "8080:8000"
    environment:
      <<: *frank-app-env
      CONTAINER_ID: api-1  # Override for container identification


  frank-app-2:
    <<: *frank-app-common
    container_name: frank-api-2
    ports:
      - "8081:8000"
    environment:
      <<: *frank-app-env
      CONTAINER_ID: api-2  # Override for container identification

  localstack:
    image: localstack/localstack:latest
    container_name: localstack
    ports:
      - "4566:4566"  # LocalStack API
      - "4571:4571"  # LocalStack Dashboard (optional)
    environment:
      <<: *aws-credentials
      SERVICES: dynamodb
      DEBUG: 1 
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
    networks:
      - localstack-net

  dynamodb-admin:
    container_name: dynamodb-admin
    image: aaronshaf/dynamodb-admin:latest
    ports:
      - "8200:8001"
    environment:
      <<: *aws-credentials
      DYNAMO_ENDPOINT: http://localstack:4566
    depends_on:
      - localstack
    networks:
      - localstack-net

  # Mock Cognito service using FastAPI
  mock-cognito:
    build:
      context: ../../..
      dockerfile: stages/stage3/local/Dockerfile.cognito
      args:
        BUILD_CONTEXT: stages/stage3/local
        PACKAGE_CONTEXT: .      
    container_name: mock-cognito
    ports:
      - "${MOCK_COGNITO_PORT:-8100}:8100" # Direct HTTP access to Mock Cognito (exposed to localhost)
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      - RELOAD=${RELOAD:-true}
      - USER_POOL_ID=${USER_POOL_ID:-eu-west-1_MOCKPOOL}
      - CLIENT_ID=${CLIENT_ID:-mock-client-id-123456}
      - REGION=${REGION:-eu-west-1}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - localstack-net
    volumes:
      - ./mock_cognito.py:/app/mock_cognito.py:ro  # Mount source file for auto-reload
      - ../../../src:/app/src:ro  # Mount source code for auto-reload

networks:
  localstack-net:
    driver: bridge

volumes:
  logs: