#
# FRANK Platform - AWS CloudFormation Infrastructure Template
# Feedbackinfrastructuur voor cyberRisico Analyse en Netwerk Kennisdeling
#
# Complete AWS infrastructure template with VPC, ECS, ALB, WAF, and DynamoDB
#
# Copyright (c) 2025 Schuberg Philis B.V.
# SPDX-License-Identifier: Apache-2.0
#

AWSTemplateFormatVersion: '2010-09-09'
Description: 'FRANK Application - Stage 3: Enhanced Security with HTTPS, AWS and ALB'

# CloudFormation Creation Order:
# 1. NETWORKING FOUNDATION - VPC, Subnets, Gateways, Routes (network isolation & connectivity)
# 2. SECURITY GROUPS - ALB and ECS traffic rules (firewall rules for components)
# 3. LOAD BALANCER - ALB, Target Groups, Listeners (internet-facing entry point)
# 4. WEB APPLICATION FIREWALL - WAF rules and ALB association (advanced threat protection)
# 5. COMPUTE PLATFORM - ECS Cluster (container orchestration environment)
# 6. IAM ROLES - Task execution and application permissions (AWS service access)
# 7. AUTHENTICATION - Cognito User Pool for user management and JWT authentication
# 8. DATABASE - DynamoDB tables and VPC endpoint (data storage & private access)
# 9. CONTAINER DEFINITION - Task Definition with environment (container specs & config)
# 10. SERVICE DEPLOYMENT - ECS Service that runs the containers (actual workload execution)
# 11. AUTO SCALING - Dynamic scaling based on CPU, memory, and request metrics

Parameters:
  StackName:
    Type: String
    Description: Name for this stack and all resources
    Default: frank-stage3
    
  ContainerImage:
    Type: String
    Description: Docker image URI from ECR
    Default: '123456789012.dkr.ecr.us-east-1.amazonaws.com/frank:latest'
  
  ContainerPort:
    Type: Number
    Description: Port the FastAPI application listens on
    Default: '8000'
  
  HealthCheckPath:
    Type: String
    Description: Health check endpoint path
    Default: '/v1/health'

  # SSL/HTTPS Parameters
  CertificateArn:
    Type: String
    Description: ARN of the SSL certificate for HTTPS
    Default: ''

  DomainName:
    Type: String
    Description: Custom domain name for the application
    Default: ''

  HostedZoneId:
    Type: String
    Description: Route53 hosted zone ID for DNS record creation
    Default: ''

  # Auto Scaling Parameters
  MinCapacity:
    Type: Number
    Description: Minimum number of ECS tasks
    Default: 2
    MinValue: 1
    MaxValue: 10

  MaxCapacity:
    Type: Number
    Description: Maximum number of ECS tasks
    Default: 10
    MinValue: 2
    MaxValue: 50

  TargetCPUUtilization:
    Type: Number
    Description: Target CPU utilization percentage for auto scaling
    Default: 70
    MinValue: 10
    MaxValue: 90

  TargetMemoryUtilization:
    Type: Number
    Description: Target memory utilization percentage for auto scaling
    Default: 80
    MinValue: 10
    MaxValue: 90

  EnableAutoScaling:
    Type: String
    Description: Enable auto scaling for ECS service
    Default: 'true'
    AllowedValues: ['true', 'false']

  EnableCognitoMFA:
    Type: String
    Description: Enable Multi-Factor Authentication for Cognito (requires SMS configuration if not OFF)
    Default: 'OFF'
    AllowedValues: ['OFF', 'ON', 'OPTIONAL']

  CognitoPasswordPolicy:
    Type: String
    Description: Password policy strength for Cognito users
    Default: 'STRONG'
    AllowedValues: ['WEAK', 'MEDIUM', 'STRONG']

Conditions:
  HasSSL: !Not [!Equals [!Ref CertificateArn, '']]
  HasDomain: !Not [!Equals [!Ref DomainName, '']]
  HasHostedZone: !Not [!Equals [!Ref HostedZoneId, '']]
  HasDNS: !And [!Condition HasDomain, !Condition HasHostedZone]
  AutoScalingEnabled: !Equals [!Ref EnableAutoScaling, 'true']
  MFAEnabled: !Not [!Equals [!Ref EnableCognitoMFA, 'OFF']]

Resources:
  # === 1. NETWORKING FOUNDATION ===
  # Creates isolated network environment with public/private separation
  # Public subnets: ALB accessible from internet (3 AZs for HA)
  # Private subnets: ECS containers isolated from direct internet access
  
  # VPC: Isolated network boundary for all AWS resources
  VPC:
    Type: AWS::EC2::VPC
    DeletionPolicy: Retain
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub '${StackName}-vpc'

  # Internet Gateway: Provides bidirectional internet access to VPC
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${StackName}-igw'

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # Public Subnets: Internet-accessible subnets for ALB (3 AZs for high availability)
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${StackName}-public-subnet-1'

  # Public Subnet for ALB - AZ2
  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.3.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${StackName}-public-subnet-2'

  # Public Subnet for ALB - AZ3
  PublicSubnet3:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.5.0/24
      AvailabilityZone: !Select [2, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${StackName}-public-subnet-3'

  # Private Subnets: Isolated subnets for ECS containers (outbound-only internet via NAT)
  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${StackName}-private-subnet-1'

  # Private Subnet for Fargate tasks - AZ2
  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.4.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${StackName}-private-subnet-2'

  # Private Subnet for Fargate tasks - AZ3
  PrivateSubnet3:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.6.0/24
      AvailabilityZone: !Select [2, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${StackName}-private-subnet-3'

  # NAT Gateways: Enable outbound internet access for private subnets (container updates, API calls)
  NATGatewayEIP1:
    Type: AWS::EC2::EIP
    DependsOn: AttachGateway
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub '${StackName}-nat-eip-1'

  # NAT Gateway EIP for AZ2
  NATGatewayEIP2:
    Type: AWS::EC2::EIP
    DependsOn: AttachGateway
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub '${StackName}-nat-eip-2'

  # NAT Gateway EIP for AZ3
  NATGatewayEIP3:
    Type: AWS::EC2::EIP
    DependsOn: AttachGateway
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub '${StackName}-nat-eip-3'

  # NAT Gateway for AZ1
  NATGateway1:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NATGatewayEIP1.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: !Sub '${StackName}-nat-1'

  # NAT Gateway for AZ2
  NATGateway2:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NATGatewayEIP2.AllocationId
      SubnetId: !Ref PublicSubnet2
      Tags:
        - Key: Name
          Value: !Sub '${StackName}-nat-2'

  # NAT Gateway for AZ3
  NATGateway3:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NATGatewayEIP3.AllocationId
      SubnetId: !Ref PublicSubnet3
      Tags:
        - Key: Name
          Value: !Sub '${StackName}-nat-3'

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${StackName}-public-rt'

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetRouteTableAssociation2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetRouteTableAssociation3:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet3
      RouteTableId: !Ref PublicRouteTable

  # Private Route Table for AZ1
  PrivateRouteTable1:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${StackName}-private-rt-1'

  PrivateRoute1:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable1
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NATGateway1

  PrivateSubnetRouteTableAssociation1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable1

  # Private Route Table for AZ2
  PrivateRouteTable2:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${StackName}-private-rt-2'

  PrivateRoute2:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable2
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NATGateway2

  PrivateSubnetRouteTableAssociation2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable2

  # Private Route Table for AZ3
  PrivateRouteTable3:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${StackName}-private-rt-3'

  PrivateRoute3:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable3
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NATGateway3

  PrivateSubnetRouteTableAssociation3:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet3
      RouteTableId: !Ref PrivateRouteTable3

  # === 2. SECURITY GROUPS ===
  # Virtual firewalls controlling traffic flow between components
  
  # ALB Security Group: Allows HTTP/HTTPS from internet, forwards to ECS
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${StackName}-alb-sg'
      GroupDescription: Allow HTTP and HTTPS traffic to ALB
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: Allow HTTP from anywhere
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: Allow HTTPS from anywhere
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound traffic
      Tags:
        - Key: Name
          Value: !Sub '${StackName}-alb-sg'

  # ECS Security Group: Only accepts traffic from ALB (zero-trust networking)
  ECSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${StackName}-ecs-sg'
      GroupDescription: Allow traffic from ALB only
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref ContainerPort
          ToPort: !Ref ContainerPort
          SourceSecurityGroupId: !Ref ALBSecurityGroup
          Description: Allow traffic from ALB
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound traffic
      Tags:
        - Key: Name
          Value: !Sub '${StackName}-ecs-sg'  
          
          
  # === 3. LOAD BALANCER ===
  # Internet-facing entry point with SSL termination and health checking
  
  # Application Load Balancer: Distributes traffic across ECS tasks
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${StackName}-alb'
      Scheme: internet-facing
      Type: application
      IpAddressType: ipv4
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
        - !Ref PublicSubnet3
      SecurityGroups:
        - !Ref ALBSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub '${StackName}-alb'  

  # ALB Target Group
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${StackName}-tg'
      Port: !Ref ContainerPort
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref VPC
      HealthCheckEnabled: true
      HealthCheckPath: !Ref HealthCheckPath
      HealthCheckProtocol: HTTP
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 5
      Matcher:
        HttpCode: 200
      Tags:
        - Key: Name
          Value: !Sub '${StackName}-tg'  

  # ALB Listener - HTTP (redirect to HTTPS if SSL enabled)
  ALBListenerHTTP:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - !If
          - HasSSL
          - Type: redirect
            RedirectConfig:
              Protocol: HTTPS
              Port: 443
              StatusCode: HTTP_301
          - Type: forward
            TargetGroupArn: !Ref TargetGroup

  # ALB Listener - HTTPS (conditional)
  ALBListenerHTTPS:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasSSL
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS-1-2-2017-01
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # Route53 DNS Record (conditional)
  DNSRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasDNS
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt ApplicationLoadBalancer.DNSName
        HostedZoneId: !GetAtt ApplicationLoadBalancer.CanonicalHostedZoneID

  # === 4. WEB APPLICATION FIREWALL ===
  # Advanced threat protection and rate limiting for the ALB
  
  # WAF Web ACL: Protects against common web attacks and implements rate limiting
  WAFWebACL:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub '${StackName}-waf-acl'
      Scope: REGIONAL
      DefaultAction:
        Allow: {}
      Rules:
        # AWS Managed Rules - Core Rule Set
        - Name: AWSManagedRulesCommonRuleSet
          Priority: 1
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          OverrideAction:
            None: {}
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: CommonRuleSetMetric
            SampledRequestsEnabled: true

        # Rate limiting - 2000 requests per 5 minutes per IP
        - Name: RateLimitRule
          Priority: 2
          Statement:
            RateBasedStatement:
              Limit: 2000
              AggregateKeyType: IP
          Action:
            Block: {}
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: RateLimitMetric
            SampledRequestsEnabled: true

        # Block known bad inputs
        - Name: AWSManagedRulesKnownBadInputsRuleSet
          Priority: 3
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          OverrideAction:
            None: {}
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: BadInputsMetric
            SampledRequestsEnabled: true
      VisibilityConfig:
        CloudWatchMetricsEnabled: true
        MetricName: !Sub '${StackName}-waf-acl'
        SampledRequestsEnabled: true
      Tags:
        - Key: Name
          Value: !Sub '${StackName}-waf-acl'

  # Associate WAF with ALB
  WAFAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      ResourceArn: !Ref ApplicationLoadBalancer
      WebACLArn: !GetAtt WAFWebACL.Arn

  # === 5. COMPUTE PLATFORM ===
  # Container orchestration environment for running FRANK application
  
  # ECS Cluster: Logical grouping of compute resources
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${StackName}-cluster'
      Tags:
        - Key: Name
          Value: !Sub '${StackName}-cluster'  
          
  # CloudWatch Log Group
  LogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub '/ecs/${StackName}'
      RetentionInDays: 7

  # === 6. IAM ROLES ===
  # AWS permissions for ECS tasks and container execution
  
  # Task Execution Role: ECS service permissions (pull images, write logs)
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Tags:
        - Key: Name
          Value: !Sub '${StackName}-task-execution-role'  
          
  # Task Role: Application-level permissions (DynamoDB access for FRANK app)
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource: 
                  - !GetAtt DynamoDBTable.Arn
                  - !Sub '${DynamoDBTable.Arn}/index/*'
                  - !GetAtt DynamoDBAuditTable.Arn
                  - !Sub '${DynamoDBAuditTable.Arn}/index/*'
              - Effect: Allow
                Action:
                  - dynamodb:ListTables
                  - dynamodb:DescribeTable
                  - dynamodb:DescribeTimeToLive
                Resource: '*'
        - PolicyName: CognitoAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:GetUser
                  - cognito-idp:AdminGetUser
                  - cognito-idp:AdminListGroupsForUser
                  - cognito-idp:ListUsers
                  - cognito-idp:AdminCreateUser
                  - cognito-idp:AdminUpdateUserAttributes
                  - cognito-idp:AdminSetUserPassword
                Resource: !GetAtt CognitoUserPool.Arn
              - Effect: Allow
                Action:
                  - cognito-idp:DescribeUserPool
                  - cognito-idp:DescribeUserPoolClient
                Resource: '*'
      Tags:
        - Key: Name
          Value: !Sub '${StackName}-task-role'

  # === 7. AUTHENTICATION ===
  # Cognito User Pool for user management and JWT authentication
  
  # IAM Role for Cognito SMS (only created when MFA is enabled)
  CognitoSMSRole:
    Type: AWS::IAM::Role
    Condition: MFAEnabled
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cognito-idp.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonCognitoIdpSmsRole
      Tags:
        - Key: Name
          Value: !Sub '${StackName}-cognito-sms-role'

  # Cognito User Pool: Central user directory with configurable MFA
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${StackName}-user-pool'
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7
      MfaConfiguration: !Ref EnableCognitoMFA
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      UsernameAttributes:
        - email
      UsernameConfiguration:
        CaseSensitive: false
      AutoVerifiedAttributes: !If
        - MFAEnabled
        - [email, phone_number]
        - [email]
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate: !If
          - MFAEnabled
          - [email, phone_number]
          - [email]
      Schema: !If
        - MFAEnabled
        - - Name: email
            AttributeDataType: String
            Required: true
            Mutable: true
          - Name: phone_number
            AttributeDataType: String
            Required: false
            Mutable: true
        - - Name: email
            AttributeDataType: String
            Required: true
            Mutable: true
      EmailConfiguration:
        EmailSendingAccount: COGNITO_DEFAULT
      SmsConfiguration: !If
        - MFAEnabled
        - SnsCallerArn: !GetAtt CognitoSMSRole.Arn
        - !Ref AWS::NoValue
      UserPoolTags:
        Name: !Sub '${StackName}-user-pool'
        Environment: !Sub '${StackName}'

  # Cognito User Pool Client: Application configuration for authentication
  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub '${StackName}-client'
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false  # Public client for web applications
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
      PreventUserExistenceErrors: ENABLED
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
      AccessTokenValidity: 1    # 1 hour
      IdTokenValidity: 1        # 1 hour
      RefreshTokenValidity: 30  # 30 days
      ReadAttributes: !If
        - MFAEnabled
        - [email, email_verified, given_name, family_name, phone_number, phone_number_verified]
        - [email, email_verified, given_name, family_name]
      WriteAttributes: !If
        - MFAEnabled
        - [email, given_name, family_name, phone_number]
        - [email, given_name, family_name]

  # Cognito Identity Pool: Provides AWS credentials for authenticated users
  CognitoIdentityPool:
    Type: AWS::Cognito::IdentityPool
    Properties:
      IdentityPoolName: !Sub '${StackName}_identity_pool'
      AllowUnauthenticatedIdentities: false
      CognitoIdentityProviders:
        - ClientId: !Ref CognitoUserPoolClient
          ProviderName: !GetAtt CognitoUserPool.ProviderName

  # IAM Role for authenticated Cognito users
  CognitoAuthenticatedRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: cognito-identity.amazonaws.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'cognito-identity.amazonaws.com:aud': !Ref CognitoIdentityPool
              'ForAnyValue:StringLike':
                'cognito-identity.amazonaws.com:amr': authenticated
      Policies:
        - PolicyName: CognitoAuthenticatedPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cognito-sync:*
                  - cognito-identity:*
                Resource: '*'
      Tags:
        - Key: Name
          Value: !Sub '${StackName}-cognito-authenticated-role'

  # Identity Pool Role Attachment
  CognitoIdentityPoolRoleAttachment:
    Type: AWS::Cognito::IdentityPoolRoleAttachment
    Properties:
      IdentityPoolId: !Ref CognitoIdentityPool
      Roles:
        authenticated: !GetAtt CognitoAuthenticatedRole.Arn

  # === 8. DATABASE ===
  # Serverless NoSQL database with private VPC access
  
  # Main DynamoDB Table: FRANK application data with single-table design
  DynamoDBTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${StackName}-data'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Name
          Value: !Sub '${StackName}-data'

  # Audit Table: Compliance and change tracking with TTL for automatic cleanup
  DynamoDBAuditTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${StackName}-audit'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: TTL
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Name
          Value: !Sub '${StackName}-audit'

  # VPC Endpoint: Private connection to DynamoDB (no internet routing required)
  DynamoDBVPCEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.dynamodb'
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTable1
        - !Ref PrivateRouteTable2
        - !Ref PrivateRouteTable3
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:Query
              - dynamodb:Scan
              - dynamodb:BatchGetItem
              - dynamodb:BatchWriteItem
              - dynamodb:DescribeTable
            Resource:
              - !GetAtt DynamoDBTable.Arn
              - !Sub '${DynamoDBTable.Arn}/index/*'
              - !GetAtt DynamoDBAuditTable.Arn
              - !Sub '${DynamoDBAuditTable.Arn}/index/*'
          - Effect: Allow
            Principal: '*'
            Action:
              - dynamodb:ListTables
              - dynamodb:DescribeTimeToLive
              - dynamodb:ListTagsOfResource
            Resource: '*'  
                      
  # === 9. CONTAINER DEFINITION ===
  # Specification for FRANK application container with environment variables
  
  # Task Definition: Container blueprint with resource allocation and configuration
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${StackName}-task'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: '256'
      Memory: '512'
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: !Sub '${StackName}-container'
          Image: !Ref ContainerImage
          Essential: true
          PortMappings:
            - ContainerPort: !Ref ContainerPort
              Protocol: tcp
          HealthCheck:
            Command:
              - "CMD-SHELL"
              - !Sub "curl -f http://localhost:${ContainerPort}${HealthCheckPath} || exit 1"
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60
          Environment:
            - Name: DYNAMODB_TABLE
              Value: !Ref DynamoDBTable
            - Name: DYNAMODB_AUDIT_TABLE  
              Value: !Ref DynamoDBAuditTable
            - Name: LOG_LEVEL  
              Value: info
            - Name: ENDPOINT
              Value: ''
            - Name: AWS_DEFAULT_REGION
              Value: !Ref AWS::Region
            - Name: FRANK_ENVIRONMENT
              Value: aws
            - Name: ECS_ENABLE_CONTAINER_METADATA
              Value: 'true'
            - Name: TASK_DEFINITION_FAMILY
              Value: !Sub '${StackName}-task'
            - Name: PORT
              Value: !Ref ContainerPort
            # Cognito Authentication Configuration
            - Name: COGNITO_USER_POOL_ID
              Value: !Ref CognitoUserPool
            - Name: COGNITO_CLIENT_ID
              Value: !Ref CognitoUserPoolClient
            - Name: COGNITO_REGION
              Value: !Ref AWS::Region
            - Name: COGNITO_IDENTITY_POOL_ID
              Value: !Ref CognitoIdentityPool
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
      Tags:
        - Key: Name
          Value: !Sub '${StackName}-task'  
          
  # === 10. SERVICE DEPLOYMENT ===
  # Ensures desired number of containers are running and healthy
  
  # ECS Service: Maintains container availability and integrates with ALB
  ECSService:
    Type: AWS::ECS::Service
    DependsOn: ALBListenerHTTP
    Properties:
      ServiceName: !Sub '${StackName}-service'
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref MinCapacity
      LaunchType: FARGATE
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 50
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: false
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - !Ref PrivateSubnet1
            - !Ref PrivateSubnet2
            - !Ref PrivateSubnet3
          SecurityGroups:
            - !Ref ECSSecurityGroup
      LoadBalancers:
        - ContainerName: !Sub '${StackName}-container'
          ContainerPort: !Ref ContainerPort
          TargetGroupArn: !Ref TargetGroup
      HealthCheckGracePeriodSeconds: 60
      Tags:
        - Key: Name
          Value: !Sub '${StackName}-service'

  # === 11. AUTO SCALING CONFIGURATION ===
  # Enables dynamic scaling of ECS service based on CPU and memory metrics
  
  # Auto Scaling Target: Defines the scalable ECS service
  ECSAutoScalingTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Condition: AutoScalingEnabled
    Properties:
      MaxCapacity: !Ref MaxCapacity
      MinCapacity: !Ref MinCapacity
      ResourceId: !Sub 'service/${ECSCluster}/${ECSService.Name}'
      RoleARN: !Sub 'arn:aws:iam::${AWS::AccountId}:role/aws-service-role/ecs.application-autoscaling.amazonaws.com/AWSServiceRoleForApplicationAutoScaling_ECSService'
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs

  # CPU-based Auto Scaling Policy: Scale when average CPU exceeds target
  ECSScaleUpCPUPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Condition: AutoScalingEnabled
    Properties:
      PolicyName: !Sub '${StackName}-cpu-scaling-policy'
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ECSAutoScalingTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        TargetValue: !Ref TargetCPUUtilization
        ScaleOutCooldown: 300           # 5 minutes before scaling out again
        ScaleInCooldown: 300            # 5 minutes before scaling in again

  # Memory-based Auto Scaling Policy: Scale when average Memory exceeds target
  ECSScaleUpMemoryPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Condition: AutoScalingEnabled
    Properties:
      PolicyName: !Sub '${StackName}-memory-scaling-policy'
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ECSAutoScalingTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageMemoryUtilization
        TargetValue: !Ref TargetMemoryUtilization
        ScaleOutCooldown: 300
        ScaleInCooldown: 600            # Longer cooldown for memory scaling

  # Request-based Auto Scaling Policy: Scale based on ALB request count per target
  ECSScaleUpRequestPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Condition: AutoScalingEnabled
    Properties:
      PolicyName: !Sub '${StackName}-request-scaling-policy'
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ECSAutoScalingTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ALBRequestCountPerTarget
          ResourceLabel: !Sub '${ApplicationLoadBalancer.LoadBalancerFullName}/${TargetGroup.TargetGroupFullName}'
        TargetValue: 1000.0             # Target 1000 requests per minute per task
        ScaleOutCooldown: 300
        ScaleInCooldown: 600

Outputs:
  LoadBalancerDNS:
    Description: DNS name of the Application Load Balancer
    Value: !GetAtt ApplicationLoadBalancer.DNSName
    Export:
      Name: !Sub '${AWS::StackName}-ALB-DNS'

  LoadBalancerURL:
    Description: URL to access the application
    Value: !If
      - HasSSL
      - !If
        - HasDomain
        - !Sub 'https://${DomainName}'
        - !Sub 'https://${ApplicationLoadBalancer.DNSName}'
      - !Sub 'http://${ApplicationLoadBalancer.DNSName}'

  LoadBalancerHTTPSURL:
    Description: HTTPS URL to access the application (if SSL enabled)
    Condition: HasSSL
    Value: !If
      - HasDomain
      - !Sub 'https://${DomainName}'
      - !Sub 'https://${ApplicationLoadBalancer.DNSName}'

  CustomDomainURL:
    Description: Custom domain URL (if domain configured)
    Condition: HasDNS
    Value: !If
      - HasSSL
      - !Sub 'https://${DomainName}'
      - !Sub 'http://${DomainName}'

  ClusterName:
    Description: ECS Cluster Name
    Value: !Ref ECSCluster
    Export:
      Name: !Sub '${AWS::StackName}-ClusterName'

  ServiceName:
    Description: ECS Service Name
    Value: !GetAtt ECSService.Name
    Export:
      Name: !Sub '${AWS::StackName}-ServiceName'

  TargetGroupArn:
    Description: Target Group ARN
    Value: !Ref TargetGroup
    Export:
      Name: !Sub '${AWS::StackName}-TargetGroupArn'

  VpcId:
    Description: VPC ID
    Value: !Ref VPC
    Export:
      Name: !Sub '${AWS::StackName}-VpcId'

  PublicSubnet1:
    Description: Public Subnet 1 ID
    Value: !Ref PublicSubnet1
    Export:
      Name: !Sub '${AWS::StackName}-PublicSubnet1'

  PublicSubnet2:
    Description: Public Subnet 2 ID
    Value: !Ref PublicSubnet2
    Export:
      Name: !Sub '${AWS::StackName}-PublicSubnet2'

  PublicSubnet3:
    Description: Public Subnet 3 ID
    Value: !Ref PublicSubnet3
    Export:
      Name: !Sub '${AWS::StackName}-PublicSubnet3'

  PrivateSubnet1:
    Description: Private Subnet 1 ID
    Value: !Ref PrivateSubnet1
    Export:
      Name: !Sub '${AWS::StackName}-PrivateSubnet1'

  PrivateSubnet2:
    Description: Private Subnet 2 ID
    Value: !Ref PrivateSubnet2
    Export:
      Name: !Sub '${AWS::StackName}-PrivateSubnet2'

  PrivateSubnet3:
    Description: Private Subnet 3 ID
    Value: !Ref PrivateSubnet3
    Export:
      Name: !Sub '${AWS::StackName}-PrivateSubnet3'

  DynamoDBTableName:
    Description: DynamoDB Table Name
    Value: !Ref DynamoDBTable
    Export:
      Name: !Sub '${AWS::StackName}-DynamoDBTable'

  DynamoDBTableArn:
    Description: DynamoDB Table ARN
    Value: !GetAtt DynamoDBTable.Arn
    Export:
      Name: !Sub '${AWS::StackName}-DynamoDBTableArn'

  DynamoDBAuditTableName:
    Description: DynamoDB Audit Table Name
    Value: !Ref DynamoDBAuditTable
    Export:
      Name: !Sub '${AWS::StackName}-DynamoDBAuditTable'

  DynamoDBAuditTableArn:
    Description: DynamoDB Audit Table ARN
    Value: !GetAtt DynamoDBAuditTable.Arn
    Export:
      Name: !Sub '${AWS::StackName}-DynamoDBAuditTableArn'

  # Cognito Outputs
  CognitoUserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref CognitoUserPool
    Export:
      Name: !Sub '${AWS::StackName}-UserPoolId'

  CognitoUserPoolArn:
    Description: Cognito User Pool ARN
    Value: !GetAtt CognitoUserPool.Arn
    Export:
      Name: !Sub '${AWS::StackName}-UserPoolArn'

  CognitoUserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref CognitoUserPoolClient
    Export:
      Name: !Sub '${AWS::StackName}-UserPoolClientId'

  CognitoIdentityPoolId:
    Description: Cognito Identity Pool ID
    Value: !Ref CognitoIdentityPool
    Export:
      Name: !Sub '${AWS::StackName}-IdentityPoolId'

  CognitoRegion:
    Description: AWS Region for Cognito services
    Value: !Ref AWS::Region
    Export:
      Name: !Sub '${AWS::StackName}-CognitoRegion'

  # WAF Outputs
  WAFWebACLArn:
    Description: WAF Web ACL ARN
    Value: !GetAtt WAFWebACL.Arn
    Export:
      Name: !Sub '${AWS::StackName}-WAFWebACL'

  WAFWebACLId:
    Description: WAF Web ACL ID
    Value: !Ref WAFWebACL
    Export:
      Name: !Sub '${AWS::StackName}-WAFWebACLId'

  # Auto Scaling Outputs
  AutoScalingTargetArn:
    Description: Auto Scaling Target ARN
    Condition: AutoScalingEnabled
    Value: !Ref ECSAutoScalingTarget
    Export:
      Name: !Sub '${AWS::StackName}-AutoScalingTarget'

  MinCapacityValue:
    Description: Minimum number of ECS tasks
    Value: !Ref MinCapacity
    Export:
      Name: !Sub '${AWS::StackName}-MinCapacity'

  MaxCapacityValue:
    Description: Maximum number of ECS tasks
    Value: !Ref MaxCapacity
    Export:
      Name: !Sub '${AWS::StackName}-MaxCapacity'

  ScalingConfiguration:
    Description: Auto scaling configuration summary
    Value: !Sub |
      Auto Scaling Status: ${EnableAutoScaling}
      - Min Capacity: ${MinCapacity} tasks
      - Max Capacity: ${MaxCapacity} tasks
      - CPU Target: ${TargetCPUUtilization}% average utilization
      - Memory Target: ${TargetMemoryUtilization}% average utilization
      - Request Target: 1000 requests/minute per task
      
      Monitoring Commands:
      aws cloudwatch get-metric-statistics --namespace AWS/ECS --metric-name CPUUtilization --dimensions Name=ServiceName,Value=${ECSService.Name} Name=ClusterName,Value=${ECSCluster} --start-time $(date -u -d '1 hour ago' '+%Y-%m-%dT%H:%M:%S') --end-time $(date -u '+%Y-%m-%dT%H:%M:%S') --period 300 --statistics Average --region ${AWS::Region}
      
      aws ecs describe-services --cluster ${ECSCluster} --services ${ECSService.Name} --region ${AWS::Region}

  AccessInstructions:
    Description: How to access your application
    Value: !Sub |
      Your application is now accessible via the Application Load Balancer with DynamoDB backend and WAF protection!
      
      URL: http://${ApplicationLoadBalancer.DNSName}
      
      Health Check: http://${ApplicationLoadBalancer.DNSName}/v1/health
      
      DynamoDB Table: ${DynamoDBTable}
      
      WAF Protection: 
      - WAF Web ACL: ${WAFWebACL}
      - Rate Limiting: 2000 requests per 5 minutes per IP
      - AWS Managed Rules: Common Rule Set + Known Bad Inputs protection
      - CloudWatch Metrics: Enabled for monitoring blocked requests
      
      The ALB DNS name is stable and won't change when tasks restart.
      
      To check service health:
      aws ecs describe-services --cluster ${ECSCluster} --services ${ECSService.Name}
      
      To monitor WAF activity:
      aws wafv2 get-web-acl --scope REGIONAL --id ${WAFWebACL} --region ${AWS::Region}
      
      To view target health:
      aws elbv2 describe-target-health --target-group-arn ${TargetGroup}
      
      To access DynamoDB table:
      aws dynamodb scan --table-name ${DynamoDBTable} --profile spike-account --region eu-central-1