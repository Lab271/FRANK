---
# tasks/cloudformation.yml - Simplified create or update logic

- name: Prepare CloudFormation parameters
  set_fact:
    cf_parameters:
      - ParameterKey: "StackName"
        ParameterValue: "{{ stack_name }}"
      - ParameterKey: "ContainerImage"
        ParameterValue: "{{ container_image }}"

- name: Look up hosted zone ID if not already set
  command: >
    aws route53 list-hosted-zones-by-name
    --dns-name {{ spike_subdomain }}
    --profile {{ aws_profile }}
    --query "HostedZones[?Name=='{{ spike_subdomain }}.'].Id"
    --output text
  register: hosted_zone_lookup
  when: spike_hosted_zone_id is not defined
  changed_when: false

- name: Set hosted zone ID from lookup
  set_fact:
    spike_hosted_zone_id: "{{ hosted_zone_lookup.stdout.split('/')[-1] if hosted_zone_lookup.stdout != '' else '' }}"
  when: 
    - spike_hosted_zone_id is not defined
    - hosted_zone_lookup is defined

- name: Look up SSL certificate ARN if not already set
  command: >
    aws acm list-certificates
    --region {{ aws_region }}
    --profile {{ aws_profile }}
    --query "CertificateSummaryList[?DomainName=='{{ spike_subdomain }}'].CertificateArn"
    --output text
  register: cert_lookup
  when: ssl_certificate_arn is not defined
  changed_when: false

- name: Set SSL certificate ARN from lookup
  set_fact:
    ssl_certificate_arn: "{{ cert_lookup.stdout.split('\n')[0] if cert_lookup.stdout != '' else '' }}"
  when: 
    - ssl_certificate_arn is not defined
    - cert_lookup is defined

- name: Add SSL parameters if certificate is available
  set_fact:
    cf_parameters: "{{ cf_parameters + ssl_params }}"
  vars:
    ssl_params:
      - ParameterKey: "CertificateArn"
        ParameterValue: "{{ ssl_certificate_arn }}"
      - ParameterKey: "DomainName"
        ParameterValue: "{{ spike_subdomain }}"
      - ParameterKey: "HostedZoneId"
        ParameterValue: "{{ spike_hosted_zone_id }}"
  when: 
    - ssl_certificate_arn is defined
    - ssl_certificate_arn != ""
    - spike_hosted_zone_id is defined
    - spike_hosted_zone_id != ""

- name: Check if CloudFormation stack exists
  command: >
    aws cloudformation describe-stacks 
    --stack-name {{ stack_name }}
    --region {{ aws_region }}
    --profile {{ aws_profile }}
  register: stack_exists
  failed_when: false
  changed_when: false

- name: Deploy CloudFormation stack (create if not exists)
  command: >
    aws cloudformation create-stack
    --stack-name {{ stack_name }}
    --template-body file://templates/{{ cloudformation_template }}
    --parameters '{{ cf_parameters | to_json }}'
    --capabilities CAPABILITY_IAM
    --region {{ aws_region }}
    --profile {{ aws_profile }}
  register: cf_create
  when: stack_exists.rc != 0

- name: Deploy CloudFormation stack (update if exists)
  command: >
    aws cloudformation update-stack
    --stack-name {{ stack_name }}
    --template-body file://templates/{{ cloudformation_template }}
    --parameters '{{ cf_parameters | to_json }}'
    --capabilities CAPABILITY_IAM
    --disable-rollback
    --region {{ aws_region }}
    --profile {{ aws_profile }}
  register: cf_update
  failed_when: 
    - cf_update.rc != 0
    - "'No updates are to be performed' not in cf_update.stderr"
    - "'ValidationError' not in cf_update.stderr"
  when: stack_exists.rc == 0

- name: Wait for CloudFormation operation to complete
  command: >
    aws cloudformation wait stack-{{ 'create' if stack_exists.rc != 0 else 'update' }}-complete
    --stack-name {{ stack_name }}
    --region {{ aws_region }}
    --profile {{ aws_profile }}
  when: 
    - (cf_create is defined and not cf_create.skipped | default(false) and cf_create.rc | default(1) == 0) or 
      (cf_update is defined and not cf_update.skipped | default(false) and cf_update.rc | default(1) == 0)

- name: Get stack outputs
  command: >
    aws cloudformation describe-stacks
    --stack-name {{ stack_name }}
    --region {{ aws_region }}
    --profile {{ aws_profile }}
    --query 'Stacks[0].Outputs'
    --output json
  register: stack_outputs
  changed_when: false

- name: Display stack outputs
  debug:
    var: stack_outputs.stdout
  when: stack_outputs.stdout != "null"