---
# tasks/docker.yml

- name: Build Docker image
  # Replicate the docker-compose arguments
  # --platform linux/amd64 is needed for Apple Silicon Macs to ensure compatibility with AWS
  command: >
    docker buildx build 
    --platform linux/amd64 
    --build-arg BUILD_CONTEXT={{ build_context }}
    --build-arg PACKAGE_CONTEXT=.
    -t {{ stack_name }}:{{ image_tag }}
    -t {{ ecr_url }}/{{ stack_name }}:{{ image_tag }}
    -t {{ ecr_url }}/{{ stack_name }}:latest
    -f {{ build_context }}/Dockerfile
    .
  args:
    chdir: "../../.." # one more because we're in ansible
  register: docker_build
  changed_when: true


# ===================================
# Validate and create ECR
# ===================================

- name: Ensure ECR repository exists
  community.aws.ecs_ecr:
    name: "{{ stack_name }}"
    region: "{{ aws_region }}"
    state: present
  environment:
    AWS_PROFILE: "{{ aws_profile }}"

- name: Get ECR login
  # we just pass this directly to docker login
  # see: https://docs.aws.amazon.com/cli/latest/reference/ecr/get-login-password
  command: >
    aws ecr get-login-password 
    --region {{ aws_region }}
    --profile {{ aws_profile }}
  register: ecr_token
  changed_when: false

- name: Log in to ECR
  command: >
    docker login 
    --username AWS 
    --password-stdin {{ ecr_url }}
  args:
    stdin: "{{ ecr_token.stdout }}"
  register: docker_login
  changed_when: true

# ===================================
# Push Docker Images to ECR
# ===================================

- name: Push Docker image as latest
  command: docker push {{ ecr_url }}/{{ stack_name }}:latest
  register: docker_push_latest
  changed_when: true

- name: Push Docker image with tag
  command: docker push {{ ecr_url }}/{{ stack_name }}:{{ image_tag }}
  register: docker_push_tagged
  changed_when: true