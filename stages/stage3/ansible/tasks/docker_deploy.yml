---
# ===================================
# Update ECS Task Definition with New Image and Force Deployment
# ===================================

- name: Get current task definition and update image
  shell: |
    # Get current task definition
    aws ecs describe-task-definition \
      --task-definition {{ stack_name }}-task \
      --region {{ aws_region }} \
      --profile {{ aws_profile }} \
      --query 'taskDefinition' > /tmp/current-task-def.json
    
    # Update the image in container definitions using jq
    jq --arg new_image "{{ container_image }}" \
      'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .placementConstraints, .compatibilities, .registeredAt, .registeredBy) |
       (.containerDefinitions[] | select(.name == "{{ stack_name }}-container") | .image) = $new_image' \
      /tmp/current-task-def.json > /tmp/updated-task-def.json
    
    # Register new task definition
    aws ecs register-task-definition \
      --cli-input-json file:///tmp/updated-task-def.json \
      --region {{ aws_region }} \
      --profile {{ aws_profile }}
    
    # Cleanup temp files
    rm -f /tmp/current-task-def.json /tmp/updated-task-def.json
  register: new_task_def_result
  changed_when: true

- name: Get latest task definition revision
  command: >
    aws ecs describe-task-definition
    --task-definition {{ stack_name }}-task
    --region {{ aws_region }}
    --profile {{ aws_profile }}
    --query 'taskDefinition.taskDefinitionArn'
    --output text
  register: latest_task_definition
  changed_when: false

- name: Update ECS service with new task definition
  command: >
    aws ecs update-service
    --cluster {{ stack_name }}-cluster
    --service {{ stack_name }}-service
    --task-definition {{ latest_task_definition.stdout }}
    --force-new-deployment
    --region {{ aws_region }}
    --profile {{ aws_profile }}
  register: ecs_update_service
  changed_when: true

- name: Wait for ECS service deployment to complete
  command: >
    aws ecs wait services-stable
    --cluster {{ stack_name }}-cluster
    --services {{ stack_name }}-service
    --region {{ aws_region }}
    --profile {{ aws_profile }}
  register: ecs_wait
  when: ecs_update_service is not skipped and ecs_update_service.rc == 0
  async: 300  # 5 minutes
  poll: 15  # Check every 15 seconds