<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="800" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="600" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#232f3e">
    FRANK Platform Stage 3 - AWS Infrastructure
  </text>
  
  <!-- Internet -->
  <g id="internet">
    <ellipse cx="600" cy="80" rx="60" ry="20" fill="#ff9900" stroke="#232f3e" stroke-width="2"/>
    <text x="600" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">Internet</text>
  </g>
  
  <!-- AWS Cloud Border -->
  <rect x="50" y="120" width="1100" height="650" fill="none" stroke="#ff9900" stroke-width="3" stroke-dasharray="10,5" rx="10"/>
  <text x="70" y="140" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ff9900">AWS Cloud (eu-west-1)</text>
  
  <!-- VPC Border -->
  <rect x="80" y="160" width="1040" height="580" fill="#e8f4f8" stroke="#0073e6" stroke-width="2" rx="8"/>
  <text x="100" y="180" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0073e6">VPC (10.0.0.0/16)</text>
  
  <!-- Internet Gateway -->
  <rect x="570" y="130" width="60" height="40" fill="#ff9900" stroke="#232f3e" stroke-width="2" rx="4"/>
  <text x="600" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">IGW</text>
  
  <!-- Connection from Internet to IGW -->
  <line x1="600" y1="100" x2="600" y2="130" stroke="#232f3e" stroke-width="2"/>
  
  <!-- Availability Zones -->
  <!-- AZ-1 -->
  <rect x="100" y="200" width="480" height="250" fill="#fff3cd" stroke="#856404" stroke-width="1" stroke-dasharray="5,3" rx="5"/>
  <text x="110" y="220" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#856404">Availability Zone 1</text>
  
  <!-- AZ-2 -->
  <rect x="620" y="200" width="480" height="250" fill="#d1ecf1" stroke="#0c5460" stroke-width="1" stroke-dasharray="5,3" rx="5"/>
  <text x="630" y="220" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0c5460">Availability Zone 2</text>
  
  <!-- Public Subnets -->
  <rect x="120" y="240" width="200" height="80" fill="#d4edda" stroke="#155724" stroke-width="2" rx="4"/>
  <text x="220" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#155724">Public Subnet 1</text>
  <text x="220" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#155724">10.0.101.0/24</text>
  
  <rect x="640" y="240" width="200" height="80" fill="#d4edda" stroke="#155724" stroke-width="2" rx="4"/>
  <text x="740" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#155724">Public Subnet 2</text>
  <text x="740" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#155724">10.0.102.0/24</text>
  
  <!-- NAT Gateways -->
  <rect x="200" y="290" width="40" height="25" fill="#ff9900" stroke="#232f3e" stroke-width="1" rx="2"/>
  <text x="220" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">NAT</text>
  
  <rect x="720" y="290" width="40" height="25" fill="#ff9900" stroke="#232f3e" stroke-width="1" rx="2"/>
  <text x="740" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">NAT</text>
  
  <!-- Private Subnets -->
  <rect x="120" y="340" width="200" height="80" fill="#f8d7da" stroke="#721c24" stroke-width="2" rx="4"/>
  <text x="220" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#721c24">Private Subnet 1</text>
  <text x="220" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#721c24">10.0.1.0/24</text>
  
  <rect x="640" y="340" width="200" height="80" fill="#f8d7da" stroke="#721c24" stroke-width="2" rx="4"/>
  <text x="740" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#721c24">Private Subnet 2</text>
  <text x="740" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#721c24">10.0.2.0/24</text>
  
  <!-- ECS Tasks in Private Subnets -->
  <rect x="140" y="385" width="60" height="25" fill="#0073e6" stroke="#ffffff" stroke-width="1" rx="3"/>
  <text x="170" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">ECS Task</text>
  
  <rect x="240" y="385" width="60" height="25" fill="#0073e6" stroke="#ffffff" stroke-width="1" rx="3"/>
  <text x="270" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">ECS Task</text>
  
  <rect x="660" y="385" width="60" height="25" fill="#0073e6" stroke="#ffffff" stroke-width="1" rx="3"/>
  <text x="690" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">ECS Task</text>
  
  <rect x="760" y="385" width="60" height="25" fill="#0073e6" stroke="#ffffff" stroke-width="1" rx="3"/>
  <text x="790" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">ECS Task</text>
  
  <!-- Application Load Balancer -->
  <rect x="350" y="240" width="240" height="40" fill="#ff9900" stroke="#232f3e" stroke-width="2" rx="4"/>
  <text x="470" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Application Load Balancer</text>
  
  <!-- ALB connections to public subnets -->
  <line x1="370" y1="280" x2="320" y2="280" stroke="#232f3e" stroke-width="2"/>
  <line x1="570" y1="280" x2="640" y2="280" stroke="#232f3e" stroke-width="2"/>
  
  <!-- ALB connection to IGW -->
  <line x1="470" y1="240" x2="600" y2="170" stroke="#232f3e" stroke-width="2"/>
  
  <!-- ALB connections to ECS tasks -->
  <line x1="400" y1="280" x2="170" y2="385" stroke="#0073e6" stroke-width="2" stroke-dasharray="3,3"/>
  <line x1="470" y1="280" x2="270" y2="385" stroke="#0073e6" stroke-width="2" stroke-dasharray="3,3"/>
  <line x1="470" y1="280" x2="690" y2="385" stroke="#0073e6" stroke-width="2" stroke-dasharray="3,3"/>
  <line x1="540" y1="280" x2="790" y2="385" stroke="#0073e6" stroke-width="2" stroke-dasharray="3,3"/>
  
  <!-- Database Subnets -->
  <rect x="300" y="480" width="600" height="100" fill="#e6f3ff" stroke="#0056b3" stroke-width="2" rx="4"/>
  <text x="600" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0056b3">Database Subnets (10.0.201.0/24, 10.0.202.0/24)</text>
  
  <!-- DynamoDB -->
  <rect x="500" y="520" width="200" height="40" fill="#ff9900" stroke="#232f3e" stroke-width="2" rx="4"/>
  <text x="600" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">DynamoDB</text>
  <text x="600" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">frank-table</text>
  
  <!-- KMS Key -->
  <rect x="350" y="520" width="80" height="40" fill="#4CAF50" stroke="#2E7D32" stroke-width="2" rx="4"/>
  <text x="390" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">KMS Key</text>
  <text x="390" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">Encryption</text>
  
  <!-- KMS to DynamoDB connection -->
  <line x1="430" y1="540" x2="500" y2="540" stroke="#4CAF50" stroke-width="2"/>
  
  <!-- VPC Endpoints -->
  <rect x="880" y="480" width="200" height="100" fill="#e8f5e8" stroke="#2e7d32" stroke-width="2" rx="4"/>
  <text x="980" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2e7d32">VPC Endpoints</text>
  
  <rect x="900" y="520" width="50" height="20" fill="#4CAF50" stroke="#2E7D32" stroke-width="1" rx="2"/>
  <text x="925" y="532" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">DynamoDB</text>
  
  <rect x="960" y="520" width="50" height="20" fill="#4CAF50" stroke="#2E7D32" stroke-width="1" rx="2"/>
  <text x="985" y="532" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">ECR</text>
  
  <rect x="1020" y="520" width="50" height="20" fill="#4CAF50" stroke="#2E7D32" stroke-width="1" rx="2"/>
  <text x="1045" y="532" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">Logs</text>
  
  <rect x="900" y="550" width="80" height="20" fill="#4CAF50" stroke="#2E7D32" stroke-width="1" rx="2"/>
  <text x="940" y="562" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">ECR DKR</text>
  
  <!-- ECS Cluster Info -->
  <rect x="100" y="600" width="300" height="120" fill="#fff" stroke="#0073e6" stroke-width="2" rx="4"/>
  <text x="250" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0073e6">ECS Cluster</text>
  <text x="120" y="640" font-family="Arial, sans-serif" font-size="10" fill="#333">• Service: frank-api-service</text>
  <text x="120" y="655" font-family="Arial, sans-serif" font-size="10" fill="#333">• Task Definition: frank-app</text>
  <text x="120" y="670" font-family="Arial, sans-serif" font-size="10" fill="#333">• Container: FastAPI + NGINX</text>
  <text x="120" y="685" font-family="Arial, sans-serif" font-size="10" fill="#333">• Fargate Launch Type</text>
  <text x="120" y="700" font-family="Arial, sans-serif" font-size="10" fill="#333">• Auto Scaling Enabled</text>
  
  <!-- Security Groups Info -->
  <rect x="450" y="600" width="250" height="120" fill="#fff" stroke="#dc3545" stroke-width="2" rx="4"/>
  <text x="575" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#dc3545">Security Groups</text>
  <text x="470" y="640" font-family="Arial, sans-serif" font-size="10" fill="#333">• ALB SG: 80/443 from Internet</text>
  <text x="470" y="655" font-family="Arial, sans-serif" font-size="10" fill="#333">• ECS SG: 8000/8080 from ALB</text>
  <text x="470" y="670" font-family="Arial, sans-serif" font-size="10" fill="#333">• VPC Endpoints: 443 from VPC</text>
  <text x="470" y="685" font-family="Arial, sans-serif" font-size="10" fill="#333">• Egress: All outbound</text>
  
  <!-- Route53 and SSL -->
  <rect x="750" y="600" width="200" height="120" fill="#fff" stroke="#ff9900" stroke-width="2" rx="4"/>
  <text x="850" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ff9900">DNS &amp; SSL</text>
  <text x="770" y="640" font-family="Arial, sans-serif" font-size="10" fill="#333">• Route53 Hosted Zone</text>
  <text x="770" y="655" font-family="Arial, sans-serif" font-size="10" fill="#333">• ACM SSL Certificate</text>
  <text x="770" y="670" font-family="Arial, sans-serif" font-size="10" fill="#333">• HTTPS Redirect</text>
  <text x="770" y="685" font-family="Arial, sans-serif" font-size="10" fill="#333">• Domain: frank.example.com</text>
  
  <!-- Monitoring -->
  <rect x="980" y="600" width="140" height="120" fill="#fff" stroke="#28a745" stroke-width="2" rx="4"/>
  <text x="1050" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#28a745">Monitoring</text>
  <text x="990" y="640" font-family="Arial, sans-serif" font-size="9" fill="#333">• CloudWatch Logs</text>
  <text x="990" y="655" font-family="Arial, sans-serif" font-size="9" fill="#333">• CloudWatch Metrics</text>
  <text x="990" y="670" font-family="Arial, sans-serif" font-size="9" fill="#333">• SNS Alerts</text>
  <text x="990" y="685" font-family="Arial, sans-serif" font-size="9" fill="#333">• Container Insights</text>
  <text x="990" y="700" font-family="Arial, sans-serif" font-size="9" fill="#333">• Custom Dashboards</text>
  
  <!-- Traffic Flow Arrows -->
  <!-- Internet to ALB -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#232f3e"/>
    </marker>
  </defs>
  
  <!-- Data flow from ECS to DynamoDB -->
  <path d="M 250 420 Q 400 460 600 520" fill="none" stroke="#0073e6" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <path d="M 750 420 Q 650 460 600 520" fill="none" stroke="#0073e6" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  
  <!-- Legend -->
  <rect x="80" y="740" width="600" height="40" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1" rx="4"/>
  <text x="90" y="755" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#333">Legend:</text>
  <rect x="130" y="745" width="15" height="10" fill="#d4edda" stroke="#155724"/>
  <text x="150" y="754" font-family="Arial, sans-serif" font-size="9" fill="#333">Public Subnet</text>
  <rect x="230" y="745" width="15" height="10" fill="#f8d7da" stroke="#721c24"/>
  <text x="250" y="754" font-family="Arial, sans-serif" font-size="9" fill="#333">Private Subnet</text>
  <rect x="330" y="745" width="15" height="10" fill="#e6f3ff" stroke="#0056b3"/>
  <text x="350" y="754" font-family="Arial, sans-serif" font-size="9" fill="#333">Database Subnet</text>
  <line x1="440" y1="750" x2="460" y2="750" stroke="#0073e6" stroke-width="2"/>
  <text x="470" y="754" font-family="Arial, sans-serif" font-size="9" fill="#333">HTTP Traffic</text>
  <line x1="540" y1="750" x2="560" y2="750" stroke="#0073e6" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="570" y="754" font-family="Arial, sans-serif" font-size="9" fill="#333">Data Flow</text>
</svg>