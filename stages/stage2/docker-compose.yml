# ================================
# docker-compose.yml - Stage 2 RDS/MariaDB Setup (Updated)
# ================================

services:
  # LocalStack - AWS Services Simulation
  localstack:
    image: localstack/localstack:latest
    container_name: frank-localstack-rds
    ports:
      - "4566:4566"  # LocalStack API
      - "4571:4571"  # LocalStack Dashboard (optional)
    environment:
      - SERVICES=rds,s3,secretsmanager,iam,sts
      - DEBUG=1
      - DATA_DIR=/tmp/localstack/data
      - PERSISTENCE=1
      - RDS_MYSQL_DOCKER=1
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./localstack_data:/tmp/localstack"
      - "./localstack_init:/etc/localstack/init/ready.d"
    networks:
      - frank-network

  # FRANK Application
  frank-app:
    build:
      context: ../..  # Need to do this to include the src package
      dockerfile: Dockerfile.stage2.rds
    container_name: frank-app-stage2-rds
    ports:
      - "8000:8000"
    environment:
      - FRANK_ENVIRONMENT=localstack
      - LOCALSTACK_ENDPOINT=http://localstack:4566
      - RDS_HOST=localstack
      - RDS_PORT=4566
      - RDS_DATABASE=frank
      - RDS_USERNAME=frank_user
      - RDS_PASSWORD=frank_pass
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=eu-west-1
    depends_on:
      - localstack
    volumes:
      - "./logs:/app/logs"    # Live logs folder
      - "../../src:/src"      # Live src/ package development
      - ".:/app/stage2"       # Live stage2/ application development
    networks:
      - frank-network

  # Optional: Database GUI for RDS inspection
  adminer:
    image: adminer
    container_name: frank-adminer-rds
    ports:
      - "8080:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=localstack:4566
    depends_on:
      - localstack
    networks:
      - frank-network

networks:
  frank-network:
    driver: bridge

volumes:
  localstack_data:
  logs: