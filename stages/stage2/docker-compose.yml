services:
  
  # LocalStack - AWS Services Simulation
  localstack:
    image: localstack/localstack:latest
    # image: localstack/localstack:2.0
    container_name: frank-localstack-stage2
    ports:
      - "4566:4566"  # LocalStack API
      - "4571:4571"  # LocalStack Dashboard (optional)
    environment:
#      - SERVICES=s3,secretsmanager,iam,sts,dynamodb
      - SERVICES=dynamodb
      - DEBUG=1
      - AWS_DEFAULT_REGION=eu-west-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test 
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
    #   - "./localstack_init:/etc/localstack/init/ready.d"
    networks:
      - frank-network

  # FRANK Application
  frank-app:
    build:
      context: ../..  # Need to do this to include the src package
      dockerfile: stages/stage2/Dockerfile.stage2
    container_name: frank-app-stage2
    ports:
      - "8000:8000"
    environment:
      - FRANK_ENVIRONMENT=localstack
      - LOCALSTACK_ENDPOINT=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=eu-west-1
      - DYNAMODB_TABLE=frank_table
    depends_on:
      localstack:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - "./logs:/app/logs"    # Live logs folder
      - "../../src:/src"      # Live src/ package development
      - ".:/app/stage2"       # Live stage2/ application development
    networks:
      - frank-network

  # DynamoDB Admin UI  
  dynamodb-admin:
    container_name: minimal-dynamodb-admin
    image: aaronshaf/dynamodb-admin:latest
    ports:
      - "8001:8001"
    environment:
      - DYNAMO_ENDPOINT=http://localstack:4566
      - AWS_REGION=eu-west-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    depends_on:
      - localstack
    networks:
      - frank-network


networks:
  frank-network:
    driver: bridge

volumes:
  logs: