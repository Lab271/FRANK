# ================================
# docker-compose.simple.yml - Stage 2 Without LocalStack
# ================================

services:
  # MySQL Database (Direct approach)
  mysql:
    image: mysql:8.0
    container_name: frank-mysql-stage2
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=frank_root_pass
      - MYSQL_DATABASE=frank
      - MYSQL_USER=frank_user
      - MYSQL_PASSWORD=frank_pass
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql_init:/docker-entrypoint-initdb.d
    networks:
      - frank-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "frank_user", "-pfrank_pass"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FRANK Application
  frank-app:
    build:
      context: ../..  # Need to do this to include the src package
      dockerfile: stages/stage2/Dockerfile.mysql.stage2
    container_name: frank-app-stage2
    ports:
      - "8000:8000"
    environment:
      - FRANK_ENVIRONMENT=mysql
      - RDS_HOST=mysql
      - RDS_PORT=3306
      - RDS_DATABASE=frank
      - RDS_USERNAME=frank_user
      - RDS_PASSWORD=frank_pass
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - "./logs:/app/logs"    # Live logs folder
      - "../../src:/src"      # Live src/ package development
      - ".:/app/stage2"       # Live stage2/ application development
    networks:
      - frank-network

networks:
  frank-network:
    driver: bridge

volumes:
  mysql_data:
  logs:
