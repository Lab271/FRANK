# FRANK Demo — Lightweight Mock Stack
#
# For demos using mocked data (default), no containers needed.
# For live FRANK demos, use the main environment instead:
#
#   cd ../environments/local-docker
#   make stage2  # or make stage3 for full stack
#
# This file provides just LocalStack + DynamoDB Admin for data inspection.
#
# Usage:
#   docker-compose up -d
#   docker-compose logs -f
#   docker-compose down

services:
  # LocalStack for DynamoDB (optional - for data inspection)
  localstack:
    image: localstack/localstack:3.0  # Community edition, no license required
    container_name: demo-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=dynamodb
      - DEBUG=0
      - AWS_DEFAULT_REGION=eu-west-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - frank-demo-net

  # DynamoDB Admin UI
  dynamodb-admin:
    image: aaronshaf/dynamodb-admin:latest
    container_name: demo-dynamodb-admin
    ports:
      - "8100:8001"
    environment:
      - DYNAMO_ENDPOINT=http://localstack:4566
      - AWS_REGION=eu-west-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    depends_on:
      localstack:
        condition: service_healthy
    networks:
      - frank-demo-net

networks:
  frank-demo-net:
    driver: bridge
