# Storage Layer Resource Definition
# Extracted from: .openspec/specs/020-storage-base-interface/spec.md

resource:
  id: storage-layer
  name: Storage Layer
  type: component
  technology: Python 3.12 + Abstract Base Classes

  description: |
    Database abstraction layer providing unified interface for threat intelligence
    persistence. Enables switching between SQLite, DynamoDB, PostgreSQL without
    changing application code. Access tier filtering built into the base class.

  architecture_pattern: Repository Pattern with Abstract Base Class

  base_interface:
    name: BaseFRANKDatabase
    file: src/frank/storage/base.py
    methods:
      threat_intelligence:
        - store_submission(submission: Submission) -> str
        - get_submission_by_id(submission_id: str, access_level: AccessTier) -> Optional[Submission]
        - query_observables(org_id: str, observable_type: str, ...) -> List[Observable]
        - store_sighting(sighting: Sighting) -> str
        - get_sighting_by_id(sighting_id: str) -> Optional[Sighting]

      organization_management:
        - upsert_organisation(org_data: dict) -> str
        - get_organisation_by_id(org_id: str) -> Optional[dict]
        - list_organisations() -> List[dict]
        - delete_organisation(org_id: str) -> bool

      access_control:
        - _filter_submission_by_access_level(submission: Submission, access_level: AccessTier) -> Submission
        - _filter_observable_by_access_level(observable: Observable, access_level: AccessTier) -> Observable

      health:
        - health_check() -> dict

  implementations:
    - id: sqlite-impl
      name: SQLite Implementation
      file: src/frank/storage/sqlite.py
      status: ✅ Complete (all methods implemented)
      use_cases:
        - Stage 1: Local development
        - Stage 2: Dual database (with DynamoDB)
        - Testing: Fast in-memory databases
      features:
        - Single-file database
        - Full SQL query support
        - ACID transactions
        - Foreign key constraints
        - JSON field support

    - id: dynamodb-impl
      name: DynamoDB Implementation
      file: src/frank/storage/dynamodb.py
      status: ⚠️ Partial (threat intelligence only)
      use_cases:
        - Stage 2: LocalStack testing
        - Stage 3: AWS Cloud production
      features:
        - ✅ Threat intelligence operations (submissions, observables, sightings)
        - ❌ Organization CRUD (redirects to PostgreSQL)
        - ❌ API key management (uses AWS Cognito)
        - ❌ Refresh token management (uses AWS Cognito)
      design:
        - GSI for query patterns
        - TTL for audit logs
        - On-demand billing
        - Single table design for submissions

    - id: postgresql-impl
      name: PostgreSQL Implementation
      file: src/frank/storage/postgresql.py
      status: ✅ Management API only
      use_cases:
        - Stage 3+: Organization and member management
        - Management API backend
      features:
        - ✅ Organization CRUD operations
        - ✅ Organization member management
        - ✅ Refresh token storage (logout tracking)
        - ❌ Threat intelligence operations (use DynamoDB)

  access_tier_filtering:
    description: Built into base class, applied at repository layer
    tiers:
      PUBLIC: Basic metadata only
      OBSERVER: Read all non-sensitive fields
      CONTRIBUTOR: Read all + submit capabilities
      PARTNER: Full read + submitter identity
      CORE_MEMBER: Full access including hit targets

    filtering_rules:
      - Hit target organization_id masked for non-CORE_MEMBER
      - Submitter identity revealed only to PARTNER+
      - Observables masked based on sensitivity
      - Audit logs restricted to CORE_MEMBER

  design_principles:
    - Same interface across all implementations
    - Infrastructure decisions isolated from business logic
    - Access filtering at repository layer (not application)
    - Fail fast with clear error messages
    - Health checks for monitoring

  error_handling:
    - NotImplementedError: Feature not available in this implementation
    - DatabaseConnectionError: Connection failures
    - ValidationError: Invalid data before persistence
    - AccessDeniedError: Insufficient access tier

  testing_strategy:
    - Abstract base tests run against all implementations
    - Implementation-specific tests for unique features
    - Access tier filtering tested at base class level
    - Performance benchmarks per implementation

related_specs:
  - .openspec/specs/020-storage-base-interface/spec.md
  - .openspec/specs/021-storage-sqlite/spec.md
  - .openspec/specs/022-storage-dynamodb/spec.md
  - .openspec/specs/023-storage-postgresql/spec.md

related_adrs:
  - docs/adr/0003-tiered-access-control-model.md

implementation:
  - src/frank/storage/base.py
  - src/frank/storage/sqlite.py
  - src/frank/storage/dynamodb.py
  - src/frank/storage/postgresql.py

tests:
  - tests/unit/storage/test_base.py
  - tests/unit/storage/test_sqlite.py
  - tests/unit/storage/test_dynamodb.py
  - tests/unit/storage/test_postgresql.py
