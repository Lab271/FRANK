# State Machine: FRANK Deployment Stages
# Evolutionary infrastructure progression

state_machine:
  id: deployment-stages
  name: FRANK Deployment Stages Evolution
  description: |
    State machine representing FRANK's four-stage evolutionary architecture.
    Each stage builds on the previous, adding one complexity dimension at a time.
    Demonstrates separation of infrastructure complexity from functional complexity.

  initial_state: stage1

  states:
    - id: stage1
      name: Stage 1 - Local SQLite
      description: |
        Foundation stage - proof of concept on laptop with minimal infrastructure.
        Focus: Core business logic and data models.

      characteristics:
        infrastructure:
          compute: Local Python virtualenv
          database: SQLite (single file)
          network: localhost:8000
          deployment: python main.py

        complexity:
          infrastructure: Minimal
          functional: Core features only

        capabilities:
          - Threat intelligence submission
          - Observable queries
          - SQLite persistence
          - FastAPI REST API
          - Local authentication

        constraints:
          - Single process
          - No high availability
          - Limited concurrency
          - Local-only access

        validation_criteria:
          - Core models work correctly
          - Database abstraction valid
          - API endpoints functional
          - Tests pass (>85% coverage)

      transitions:
        - to: stage2
          trigger: add_containerization
          condition: Stage 1 stable and tested
          changes:
            - Add Docker containerization
            - Introduce DynamoDB (LocalStack)
            - Dual database validation

    - id: stage2
      name: Stage 2 - Docker + LocalStack
      description: |
        Containerization and AWS patterns on local machine.
        Focus: Cloud-native patterns without cloud costs.

      characteristics:
        infrastructure:
          compute: Docker containers
          database: DynamoDB (LocalStack) + SQLite
          network: Container networking
          deployment: docker-compose up

        complexity:
          infrastructure: Containers + AWS simulation
          functional: Same as Stage 1

        capabilities:
          - Everything from Stage 1
          - Docker containerization
          - DynamoDB dual-write validation
          - LocalStack AWS simulation
          - Container networking

        constraints:
          - Still local-only
          - LocalStack limitations
          - No real cloud features

        validation_criteria:
          - DynamoDB and SQLite behavioral parity
          - Containers build and run successfully
          - Same business logic works in containers
          - No code changes from Stage 1

      transitions:
        - to: stage3
          trigger: deploy_to_aws
          condition: Dual database validation successful
          changes:
            - Deploy to AWS Cloud
            - Real DynamoDB and PostgreSQL
            - ECS Fargate orchestration
            - ALB load balancing
            - Cognito authentication
            - CloudWatch monitoring

    - id: stage3
      name: Stage 3 - AWS Cloud Production
      description: |
        Full cloud deployment with AWS managed services.
        Focus: Production-ready cloud-native deployment.

      characteristics:
        infrastructure:
          compute: ECS Fargate (2-10 tasks)
          database: DynamoDB + PostgreSQL RDS
          network: VPC, ALB, Route 53
          deployment: Ansible + CloudFormation
          auth: AWS Cognito
          monitoring: CloudWatch

        complexity:
          infrastructure: Full cloud stack
          functional: Same core logic + cloud auth

        capabilities:
          - Everything from Stage 2
          - High availability (multi-AZ)
          - Auto-scaling
          - JWT authentication (Cognito)
          - SSL/TLS with ACM
          - CloudWatch observability
          - DynamoDB at scale
          - PostgreSQL for management API

        constraints:
          - AWS vendor lock-in
          - Regional deployment
          - AWS-specific services

        validation_criteria:
          - Zero code changes from Stage 2
          - Auto-scaling works correctly
          - Health checks passing
          - Authentication working
          - 99.9% availability SLA met

      transitions:
        - to: stage4
          trigger: add_multi_cloud
          condition: Stage 3 proven in production
          changes:
            - Kubernetes orchestration
            - ScyllaDB or MongoDB
            - Cloud-agnostic services
            - Multi-region deployment

    - id: stage4
      name: Stage 4 - Cloud-Agnostic Kubernetes
      description: |
        Cloud-agnostic deployment on Kubernetes.
        Focus: Portability and multi-cloud capability.

      characteristics:
        infrastructure:
          compute: Kubernetes (any cloud)
          database: ScyllaDB or MongoDB
          network: Kubernetes networking + Ingress
          deployment: Helm charts
          auth: OAuth2 provider (cloud-agnostic)
          monitoring: Prometheus + Grafana

        complexity:
          infrastructure: Maximum flexibility
          functional: Same core logic

        capabilities:
          - Everything from Stage 3
          - Multi-cloud portability
          - Kubernetes orchestration
          - ScyllaDB high performance
          - Prometheus monitoring
          - Multi-region deployment

        validation_criteria:
          - Zero code changes from Stage 3
          - Deployable to any Kubernetes cluster
          - Same performance or better
          - All functional tests passing

  stage_comparison:
    dimensions:
      - name: Code Library
        stage1: src/frank/
        stage2: src/frank/ (unchanged)
        stage3: src/frank/ (unchanged)
        stage4: src/frank/ (unchanged)
        principle: Single code library across all stages

      - name: Database
        stage1: SQLite
        stage2: SQLite + DynamoDB (dual)
        stage3: DynamoDB + PostgreSQL
        stage4: ScyllaDB + MongoDB

      - name: Deployment
        stage1: python main.py
        stage2: docker-compose up
        stage3: ansible-playbook deploy.yml
        stage4: helm install frank

      - name: Availability
        stage1: None (single process)
        stage2: None (local only)
        stage3: 99.9% (multi-AZ)
        stage4: 99.99% (multi-region)

  design_principles:
    - One complexity dimension at a time
    - Working systems at every stage
    - Zero code changes between stages (only config)
    - Infrastructure isolated from business logic
    - Each stage validates abstractions
    - Fail fast at early stages

  validation_strategy:
    - Stage 1 proves business logic correctness
    - Stage 2 proves database abstraction works
    - Stage 3 proves cloud deployment patterns
    - Stage 4 proves portability and scale
    - Same test suite runs at all stages

