<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="630" viewBox="0 0 1000 630" role="img" aria-label="Read path split by owner. FRANK runs fixed SQL through Sightings::query; db-core takes a snapshot without any request, skips files whose manifest ranges exclude the query, reads each kept file's footer once and the needed column chunks through a 256 MiB range cache, and sends a ranged GET to the bucket only on a cache miss. The column engine returns rows, and FRANK reads timestamps with nanos(). A partner download goes through db-core's store as one whole-object GET.">
<title>Read path split by owner. FRANK runs fixed SQL through Sightings::query; db-core takes a snapshot without any request, skips files whose manifest ranges exclude the query, reads each kept file's footer once and the needed column chunks through a 256 MiB range cache, and sends a ranged GET to the bucket only on a cache miss. The column engine returns rows, and FRANK reads timestamps with nanos(). A partner download goes through db-core's store as one whole-object GET.</title>
<style>
text { font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; }
.mono { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
.sub, .lab { font-size: 11px; }
.zone { font-weight: 600; font-size: 14px; } .lanename { font-weight: 600; font-size: 12px; }
.box { stroke-width: 1.2; } .box.commit, .box.cache { stroke-width: 2; } .box.quiet { stroke-dasharray: 4 3; }
.aw, .ar, .am { stroke-width: 1.6; fill: none; } .am, .dash { stroke-dasharray: 5 4; }
.axis { stroke-width: 1; fill: none; }
.bar-w, .bar-r, .bar-g { stroke-width: 1.2; } .bar-g { fill: none; stroke-dasharray: 5 4; }
.bg { fill: #ffffff; }
text { fill: #19212c; }
.sub, .lab { fill: #5a6575; }
.lab.w { fill: #a85400; } .lab.r { fill: #0b726e; }
.lane { fill: #eceff3; } .zf { fill: #f3eee6; } .zd { fill: #e8eef4; }
.box { fill: #ffffff; stroke: #cdd3dc; }
.box.commit { stroke: #a85400; fill: #fbeedd; }
.box.cache { stroke: #0b726e; fill: #dcf1ef; }
.aw { stroke: #a85400; } .ar { stroke: #0b726e; } .am { stroke: #5a6575; }
.hw { fill: #a85400; } .hr { fill: #0b726e; } .hm { fill: #5a6575; }
.axis { stroke: #5a6575; }
.bar-w { fill: #fbeedd; stroke: #a85400; }
.bar-r { fill: #dcf1ef; stroke: #0b726e; }
.bar-g { stroke: #5a6575; }
@media (prefers-color-scheme: dark) {
.bg { fill: #1a2029; }
text { fill: #e4e8ee; }
.sub, .lab { fill: #97a2b2; }
.lab.w { fill: #f0a24a; } .lab.r { fill: #52c6bd; }
.lane { fill: #161b22; } .zf { fill: #1f1c18; } .zd { fill: #161d26; }
.box { fill: #1a2029; stroke: #333c49; }
.box.commit { stroke: #f0a24a; fill: #3a2a17; }
.box.cache { stroke: #52c6bd; fill: #13322f; }
.aw { stroke: #f0a24a; } .ar { stroke: #52c6bd; } .am { stroke: #97a2b2; }
.hw { fill: #f0a24a; } .hr { fill: #52c6bd; } .hm { fill: #97a2b2; }
.axis { stroke: #97a2b2; }
.bar-w { fill: #3a2a17; stroke: #f0a24a; }
.bar-r { fill: #13322f; stroke: #52c6bd; }
.bar-g { stroke: #97a2b2; }
}
</style>
<rect class="bg" x="0" y="0" width="1000" height="630"/>
          <defs>
            <marker id="r1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="hr"/></marker>
          </defs>
          <rect class="zf" x="0" y="30" width="320" height="590"/>
          <rect class="zd" x="345" y="30" width="345" height="590"/>
          <rect class="lane" x="700" y="30" width="300" height="590"/>
          <text class="zone" x="16" y="52">FRANK</text>
          <text class="lab" x="70" y="52">crates/frank</text>
          <text class="zone" x="360" y="52">db-core</text>
          <text class="lab" x="424" y="52">storage/ingest, engine/column</text>
          <text class="lanename" x="712" y="52">S3 bucket</text>

          
          <rect class="box" x="35" y="64" width="260" height="48" rx="6"/>
          <text class="mono" x="165" y="84" text-anchor="middle">GET /v1/statistics</text>
          <text class="sub" x="165" y="101" text-anchor="middle">api.rs · fixed SQL, spawn_blocking</text>

          <rect class="box" x="35" y="140" width="260" height="52" rx="6"/>
          <text class="mono" x="165" y="161" text-anchor="middle">Sightings::query(sql)</text>
          <text class="sub" x="165" y="179" text-anchor="middle">store/sightings.rs</text>

          <rect class="box" x="35" y="476" width="260" height="52" rx="6"/>
          <text x="165" y="497" text-anchor="middle">rows → JSON</text>
          <text class="sub" x="165" y="515" text-anchor="middle">nanos() reads ISO timestamps · TLP, k ≥ 3</text>

          <rect class="box" x="35" y="556" width="260" height="52" rx="6"/>
          <text class="mono" x="165" y="577" text-anchor="middle">GET /v1/files/{path}</text>
          <text class="sub" x="165" y="595" text-anchor="middle">partner download · read_file</text>

          
          <rect class="box" x="365" y="140" width="310" height="60" rx="6"/>
          <text class="mono" x="520" y="160" text-anchor="middle">Table::query → snapshot()</text>
          <text class="sub" x="520" y="176" text-anchor="middle">manifest · open-hour pages · held files</text>
          <text class="sub" x="520" y="191" text-anchor="middle">sizes from the manifest: no request</text>

          <rect class="box" x="365" y="228" width="310" height="60" rx="6"/>
          <text x="520" y="248" text-anchor="middle">prune by manifest ranges</text>
          <text class="sub" x="520" y="264" text-anchor="middle">rule_id · ioc_value · ts · received</text>
          <text class="sub" x="520" y="279" text-anchor="middle">a file outside them: no request</text>

          <rect class="box" x="365" y="312" width="310" height="52" rx="6"/>
          <text x="520" y="333" text-anchor="middle">held file</text>
          <text class="sub" x="520" y="351" text-anchor="middle">footer fetched and parsed once, kept</text>

          <rect class="box cache" x="365" y="392" width="310" height="60" rx="6"/>
          <text class="mono" x="520" y="412" text-anchor="middle">RangeCache</text>
          <text class="sub" x="520" y="428" text-anchor="middle">256 MiB · LRU · a held range answers reads inside it</text>
          <text class="sub" x="520" y="443" text-anchor="middle">hit: no request</text>

          <rect class="box" x="365" y="476" width="310" height="52" rx="6"/>
          <text x="520" y="497" text-anchor="middle">column engine</text>
          <text class="sub" x="520" y="515" text-anchor="middle">row groups + open-hour pages → rows</text>

          <rect class="box" x="365" y="556" width="310" height="52" rx="6"/>
          <text class="mono" x="520" y="577" text-anchor="middle">Store::get</text>
          <text class="sub" x="520" y="595" text-anchor="middle">whole object, not cached</text>

          
          <rect class="box" x="820" y="380" width="165" height="228" rx="6"/>
          <text class="mono" x="902" y="404" text-anchor="middle">live/ + archive/</text>
          <text class="sub" x="902" y="422" text-anchor="middle">*.parquet</text>
          <text class="sub" x="902" y="438" text-anchor="middle">immutable once listed</text>

          
          <line class="ar" x1="165" y1="112" x2="165" y2="138" marker-end="url(#r1)"/>
          <line class="ar" x1="295" y1="166" x2="363" y2="166" marker-end="url(#r1)"/>
          <line class="ar" x1="520" y1="200" x2="520" y2="226" marker-end="url(#r1)"/>
          <line class="ar" x1="520" y1="288" x2="520" y2="310" marker-end="url(#r1)"/>
          <text class="lab r" x="528" y="303">kept files</text>
          <line class="ar" x1="520" y1="364" x2="520" y2="390" marker-end="url(#r1)"/>
          <text class="lab r" x="528" y="382">footer, then chunks</text>
          <line class="ar" x1="675" y1="410" x2="818" y2="410" marker-end="url(#r1)"/>
          <text class="lab r" x="706" y="404">miss: ranged GET</text>
          <line class="ar" x1="818" y1="434" x2="677" y2="434" marker-end="url(#r1)"/>
          <text class="lab r" x="706" y="450">bytes, cached</text>
          <line class="ar" x1="520" y1="452" x2="520" y2="474" marker-end="url(#r1)"/>
          <line class="ar" x1="363" y1="502" x2="297" y2="502" marker-end="url(#r1)"/>
          <text class="lab r" x="330" y="496" text-anchor="middle">rows</text>
          <polyline class="ar" points="35,502 20,502 20,88 33,88" marker-end="url(#r1)"/>
          <text class="lab r" x="16" y="300" text-anchor="middle" transform="rotate(-90 16 300)">response</text>
          <line class="ar" x1="295" y1="582" x2="363" y2="582" marker-end="url(#r1)"/>
          <line class="ar" x1="675" y1="582" x2="818" y2="582" marker-end="url(#r1)"/>
          <text class="lab r" x="706" y="576">GET whole object</text>
        </svg>
