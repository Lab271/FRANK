<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-label="Each appended record goes both to a WAL frame on disk and to a row in an in-memory page. A snapshot takes the manifest, with its flushed LSN, and the pages above that LSN under one lock, so every row is read exactly once. Queries read the pages, never the WAL file. The WAL is read back only on open, to rebuild the pages above the flushed LSN. A flush turns pages into a Parquet file and moves the flushed LSN forward.">
<title>Each appended record goes both to a WAL frame on disk and to a row in an in-memory page. A snapshot takes the manifest, with its flushed LSN, and the pages above that LSN under one lock, so every row is read exactly once. Queries read the pages, never the WAL file. The WAL is read back only on open, to rebuild the pages above the flushed LSN. A flush turns pages into a Parquet file and moves the flushed LSN forward.</title>
<style>
text { font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; }
.mono { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
.sub, .lab { font-size: 11px; }
.zone { font-weight: 600; font-size: 14px; } .lanename { font-weight: 600; font-size: 12px; }
.box { stroke-width: 1.2; } .box.commit, .box.cache { stroke-width: 2; } .box.quiet { stroke-dasharray: 4 3; }
.aw, .ar, .am { stroke-width: 1.6; fill: none; } .am, .dash { stroke-dasharray: 5 4; }
.axis { stroke-width: 1; fill: none; }
.bar-w, .bar-r, .bar-g { stroke-width: 1.2; } .bar-g { fill: none; stroke-dasharray: 5 4; }
.bg { fill: #ffffff; }
text { fill: #19212c; }
.sub, .lab { fill: #5a6575; }
.lab.w { fill: #a85400; } .lab.r { fill: #0b726e; }
.lane { fill: #eceff3; } .zf { fill: #f3eee6; } .zd { fill: #e8eef4; }
.box { fill: #ffffff; stroke: #cdd3dc; }
.box.commit { stroke: #a85400; fill: #fbeedd; }
.box.cache { stroke: #0b726e; fill: #dcf1ef; }
.aw { stroke: #a85400; } .ar { stroke: #0b726e; } .am { stroke: #5a6575; }
.hw { fill: #a85400; } .hr { fill: #0b726e; } .hm { fill: #5a6575; }
.axis { stroke: #5a6575; }
.bar-w { fill: #fbeedd; stroke: #a85400; }
.bar-r { fill: #dcf1ef; stroke: #0b726e; }
.bar-g { stroke: #5a6575; }
@media (prefers-color-scheme: dark) {
.bg { fill: #1a2029; }
text { fill: #e4e8ee; }
.sub, .lab { fill: #97a2b2; }
.lab.w { fill: #f0a24a; } .lab.r { fill: #52c6bd; }
.lane { fill: #161b22; } .zf { fill: #1f1c18; } .zd { fill: #161d26; }
.box { fill: #1a2029; stroke: #333c49; }
.box.commit { stroke: #f0a24a; fill: #3a2a17; }
.box.cache { stroke: #52c6bd; fill: #13322f; }
.aw { stroke: #f0a24a; } .ar { stroke: #52c6bd; } .am { stroke: #97a2b2; }
.hw { fill: #f0a24a; } .hr { fill: #52c6bd; } .hm { fill: #97a2b2; }
.axis { stroke: #97a2b2; }
.bar-w { fill: #3a2a17; stroke: #f0a24a; }
.bar-r { fill: #13322f; stroke: #52c6bd; }
.bar-g { stroke: #97a2b2; }
}
</style>
<rect class="bg" x="0" y="0" width="960" height="300"/>
          <defs>
            <marker id="w2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="hw"/></marker>
            <marker id="r2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="hr"/></marker>
            <marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="hm"/></marker>
          </defs>
          <rect class="lane" x="0" y="20" width="960" height="100"/>
          <rect class="zd" x="0" y="130" width="960" height="160"/>
          <text class="lanename" x="12" y="38">Storage</text>
          <text class="lanename" x="12" y="148">db-core writer, in memory</text>

          <rect class="box" x="40" y="200" width="170" height="52" rx="6"/>
          <text class="mono" x="125" y="221" text-anchor="middle">append_row</text>
          <text class="sub" x="125" y="239" text-anchor="middle">one record, LSN n</text>

          <rect class="box" x="300" y="40" width="200" height="56" rx="6"/>
          <text class="mono" x="400" y="62" text-anchor="middle">wal/  (volume)</text>
          <text class="sub" x="400" y="80" text-anchor="middle">frames LSN 1…n · fsync</text>

          <rect class="box" x="300" y="190" width="200" height="70" rx="6"/>
          <text x="400" y="211" text-anchor="middle">pages</text>
          <text class="sub" x="400" y="229" text-anchor="middle">head → sealed → in flight</text>
          <text class="sub" x="400" y="245" text-anchor="middle">rows with LSN &gt; flushed_lsn</text>

          <rect class="box commit" x="590" y="40" width="170" height="56" rx="6"/>
          <text class="mono" x="675" y="62" text-anchor="middle">manifest.json</text>
          <text class="sub" x="675" y="80" text-anchor="middle">files + flushed_lsn = k</text>

          <rect class="box" x="590" y="190" width="170" height="70" rx="6"/>
          <text class="mono" x="675" y="211" text-anchor="middle">snapshot()</text>
          <text class="sub" x="675" y="229" text-anchor="middle">manifest + pages, one lock</text>
          <text class="sub" x="675" y="245" text-anchor="middle">every row exactly once</text>

          <rect class="box" x="810" y="199" width="130" height="52" rx="6"/>
          <text x="875" y="220" text-anchor="middle">query</text>
          <text class="sub" x="875" y="238" text-anchor="middle">files + pages</text>

          <polyline class="aw" points="125,200 125,68 298,68" marker-end="url(#w2)"/>
          <text class="lab w" x="133" y="62">1 · frame, fsync</text>
          <line class="aw" x1="210" y1="226" x2="298" y2="226" marker-end="url(#w2)"/>
          <text class="lab w" x="254" y="219" text-anchor="middle">2 · same row</text>
          <line class="am" x1="330" y1="96" x2="330" y2="188" marker-end="url(#m2)"/>
          <text class="lab" x="322" y="146" text-anchor="end">replay on open only</text>
          <polyline class="aw" points="500,200 545,200 545,68 588,68" marker-end="url(#w2)"/>
          <text class="lab w" x="538" y="146" text-anchor="end">flush: file, new flushed_lsn</text>
          <line class="ar" x1="675" y1="96" x2="675" y2="188" marker-end="url(#r2)"/>
          <line class="ar" x1="500" y1="236" x2="588" y2="236" marker-end="url(#r2)"/>
          <line class="ar" x1="760" y1="225" x2="808" y2="225" marker-end="url(#r2)"/>
        </svg>
