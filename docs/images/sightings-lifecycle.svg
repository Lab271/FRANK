<svg xmlns="http://www.w3.org/2000/svg" width="960" height="210" viewBox="0 0 960 210" role="img" aria-label="Lifecycle of a row: from arrival to the end of its hour it is in the WAL and an in-memory page; after the next flush it is in a live hour file in the bucket; after its day closes and the next compaction it is in an archive day file; past retention it leaves the manifest and the object is deleted ten minutes later.">
<title>Lifecycle of a row: from arrival to the end of its hour it is in the WAL and an in-memory page; after the next flush it is in a live hour file in the bucket; after its day closes and the next compaction it is in an archive day file; past retention it leaves the manifest and the object is deleted ten minutes later.</title>
<style>
text { font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; }
.mono { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
.sub, .lab { font-size: 11px; }
.zone { font-weight: 600; font-size: 14px; } .lanename { font-weight: 600; font-size: 12px; }
.box { stroke-width: 1.2; } .box.commit, .box.cache { stroke-width: 2; } .box.quiet { stroke-dasharray: 4 3; }
.aw, .ar, .am { stroke-width: 1.6; fill: none; } .am, .dash { stroke-dasharray: 5 4; }
.axis { stroke-width: 1; fill: none; }
.bar-w, .bar-r, .bar-g { stroke-width: 1.2; } .bar-g { fill: none; stroke-dasharray: 5 4; }
.bg { fill: #ffffff; }
text { fill: #19212c; }
.sub, .lab { fill: #5a6575; }
.lab.w { fill: #a85400; } .lab.r { fill: #0b726e; }
.lane { fill: #eceff3; } .zf { fill: #f3eee6; } .zd { fill: #e8eef4; }
.box { fill: #ffffff; stroke: #cdd3dc; }
.box.commit { stroke: #a85400; fill: #fbeedd; }
.box.cache { stroke: #0b726e; fill: #dcf1ef; }
.aw { stroke: #a85400; } .ar { stroke: #0b726e; } .am { stroke: #5a6575; }
.hw { fill: #a85400; } .hr { fill: #0b726e; } .hm { fill: #5a6575; }
.axis { stroke: #5a6575; }
.bar-w { fill: #fbeedd; stroke: #a85400; }
.bar-r { fill: #dcf1ef; stroke: #0b726e; }
.bar-g { stroke: #5a6575; }
@media (prefers-color-scheme: dark) {
.bg { fill: #1a2029; }
text { fill: #e4e8ee; }
.sub, .lab { fill: #97a2b2; }
.lab.w { fill: #f0a24a; } .lab.r { fill: #52c6bd; }
.lane { fill: #161b22; } .zf { fill: #1f1c18; } .zd { fill: #161d26; }
.box { fill: #1a2029; stroke: #333c49; }
.box.commit { stroke: #f0a24a; fill: #3a2a17; }
.box.cache { stroke: #52c6bd; fill: #13322f; }
.aw { stroke: #f0a24a; } .ar { stroke: #52c6bd; } .am { stroke: #97a2b2; }
.hw { fill: #f0a24a; } .hr { fill: #52c6bd; } .hm { fill: #97a2b2; }
.axis { stroke: #97a2b2; }
.bar-w { fill: #3a2a17; stroke: #f0a24a; }
.bar-r { fill: #13322f; stroke: #52c6bd; }
.bar-g { stroke: #97a2b2; }
}
</style>
<rect class="bg" x="0" y="0" width="960" height="210"/>
          <text class="lanename" x="14" y="62">Volume + memory</text>
          <text class="lanename" x="14" y="112">Bucket</text>
          <rect class="bar-w" x="160" y="44" width="230" height="28" rx="4"/>
          <text x="275" y="63" text-anchor="middle">WAL + memory page</text>
          <rect class="bar-r" x="390" y="94" width="210" height="28" rx="4"/>
          <text x="495" y="113" text-anchor="middle">live/ hour file</text>
          <rect class="bar-r" x="600" y="94" width="220" height="28" rx="4"/>
          <text x="710" y="113" text-anchor="middle">archive/ day file</text>
          <rect class="bar-g" x="820" y="94" width="80" height="28" rx="4"/>
          <text class="sub" x="860" y="113" text-anchor="middle">unlisted</text>
          <line class="axis" x1="160" y1="150" x2="920" y2="150"/>
          <line class="axis" x1="160" y1="145" x2="160" y2="155"/>
          <line class="axis" x1="390" y1="145" x2="390" y2="155"/>
          <line class="axis" x1="600" y1="145" x2="600" y2="155"/>
          <line class="axis" x1="820" y1="145" x2="820" y2="155"/>
          <line class="axis" x1="900" y1="145" x2="900" y2="155"/>
          <text class="sub" x="160" y="172" text-anchor="middle">arrives</text>
          <text class="sub" x="390" y="172" text-anchor="middle">hour closed + ≤ 60 s</text>
          <text class="sub" x="600" y="172" text-anchor="middle">day closed + ≤ 1 h</text>
          <text class="sub" x="820" y="172" text-anchor="middle">past retention</text>
          <text class="sub" x="900" y="190" text-anchor="middle">+10 min: deleted</text>
          <text class="sub" x="160" y="190" text-anchor="middle">readable from here on</text>
        </svg>
