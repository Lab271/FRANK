[workspace]
resolver = "2"
members = ["crates/frank-core", "crates/frank", "crates/frank-wasm"]

[workspace.package]
version = "0.51.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Lab271/FRANK"
rust-version = "1.85"

[workspace.dependencies]
frank-core = { path = "crates/frank-core" }
# db-core 0.170+ carries the browser fixes (no threads, no clock, nanosecond
# timestamps), 0.171 appends nullable columns to a table (#740).
db-core = { git = "https://github.com/t-rust-db/db-core", tag = "v0.241.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["parsing", "formatting", "macros"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.release.package.frank-wasm]
opt-level = "s"
