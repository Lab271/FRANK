[workspace]
resolver = "2"
members = ["crates/frank-core", "crates/frank", "crates/frank-wasm"]

[workspace.package]
version = "0.11.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Lab271/FRANK"
rust-version = "1.85"

[workspace.dependencies]
frank-core = { path = "crates/frank-core" }
# db-core pinned to the head of t-rust-db/db-core#708 (main at 0.167.0 plus
# the browser fixes: no threads, no clock, nanosecond timestamps). Move to a
# release tag once it is merged.
db-core = { git = "https://github.com/t-rust-db/db-core", rev = "a7c16933c562c2a85e2f2cac35a41a307c1f5b6c", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["parsing", "formatting", "macros"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.release.package.frank-wasm]
opt-level = "s"
