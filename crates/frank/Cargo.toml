[package]
name = "frank"
description = "FRANK server: sightings in a striped Parquet table, IoCs in a row table"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
frank-core.workspace = true
db-core = { workspace = true, features = ["ingest", "engine-column", "engine-row", "storage-column-write", "storage-s3"] }
serde.workspace = true
serde_json.workspace = true
time.workspace = true
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["fs", "limit", "set-header", "timeout"] }
# GlobalConcurrencyLimitLayer: one limit for the whole server (#244).
tower = { version = "0.5", features = ["limit"] }
clap = { version = "4", features = ["derive", "env"] }
sha2 = "0.10"
getrandom = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# HTTPS calls: the identity provider for SSO (#241) and, with `tls`, S3.
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
# RS256 signatures of OIDC ID tokens (#241); already linked through rustls.
ring = "0.17"
base64 = "0.23"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[features]
# HTTPS for an S3 store (AWS): db-core speaks http:// only, so FRANK sends its
# requests through ureq with rustls (ring, the platform's certificate store).
# On in the container image; off for plain filesystem / Garage builds (#220).
tls = []
