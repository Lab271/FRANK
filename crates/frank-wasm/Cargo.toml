[package]
name = "frank-wasm"
description = "FRANK in the browser: submission preview and local Parquet analysis"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
frank-core.workspace = true
db-core = { workspace = true, features = ["engine-column"] }
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "=0.2.129"  # must equal the wasm-bindgen CLI (Makefile, Containerfile)

[dev-dependencies]
db-core = { workspace = true, features = ["engine-column", "storage-column-write"] }
