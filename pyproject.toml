[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frank"
dynamic = [
  "version",
]
description = "Vulnerability platform"
readme = "README.md"
license = {text = "Apache 2.0"}
authors = [{name = "Ilja Heitlager"}]
maintainers = [{name = "Ilja Heitlager", email = "iheitlager@schubergphilis.com"}]
keywords = ["security-tools"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English"
]
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.13.0",
    "simplejson>=3.20.2",
    "fastapi>=0.120.0",
    "uvicorn>=0.38.0",
]

[project.urls]
Homepage = "https://github.com/LAB271/FRANK"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools_scm]
write_to = "src/frank/__version__.py"

[tool.ruff]
# Allow lines to be as long as 120.
line-length = 120
