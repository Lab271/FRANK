[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "frank"
dynamic = ["version"]
description = "Vulnerability platform"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Ilja Heitlager"}]
maintainers = [{name = "Ilja Heitlager", email = "iheitlager@schubergphilis.com"}]
keywords = ["security-tools"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English"
]
requires-python = ">=3.11"
dependencies = [
    "aioboto3>=15.0.0",
    "aiobotocore>=2.0.0",
    "aiofiles>=24.0.0",
    "aiohttp>=3.12.0",
    "ansible-core>=2.19.0",
    "boto3>=1.40.0",
    "botocore>=1.40.0",
    "click>=8.3.0",
    "cryptography>=45.0.0",
    "fastapi>=0.120.0",
    "httpx>=0.28.0",
    "Jinja2>=3.1.0",
    "keyring>=24.0.0",
    "lark>=1.3.0",
    "psycopg[binary]>=3.2.0",
    "PyJWT[crypto]>=2.10.0",
    "PyMySQL>=1.1.0",
    "pydantic>=2.12.0",
    "pyotp>=2.9.0",
    "python-multipart>=0.0.20",
    "PyYAML>=6.0.0",
    "requests>=2.32.0",
    "ruff>=0.14.0",
    "textual>=0.50.0",
    "uvicorn>=0.38.0",
    "pytest>=9.0.3",
]

[project.scripts]
frank-admin = "frank.admin.server:main"
frank-web = "frank.web.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
    "pytest-bdd>=8.0.0",
    "pytest-cov>=7.0.0",
    "coverage>=7.10.0",
    "mypy>=1.8.0",
    "isort>=5.12.0",
    "behave>=1.2.6",
    "PyHamcrest>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/LAB271/FRANK"

[tool.hatch.version]
path = "src/frank/__version__.py"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501", "E741"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
norecursedirs = ["tests", ".git", ".venv", "build", "dist"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.coverage.run]
omit = [
    "*/server.py",
    "*/admin/server.py",
    "*/web/server.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
]
