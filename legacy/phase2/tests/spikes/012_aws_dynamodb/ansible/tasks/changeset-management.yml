---
# tasks/changeset-management.yml
# CloudFormation Change Set Management for Existing Infrastructure

- name: Check for existing critical resources
  block:
    - name: Check if DynamoDB data table exists
      command: >
        aws dynamodb describe-table
        --table-name {{ stack_name }}-data
        --region {{ aws_region }}
        --profile {{ aws_profile }}
        --query 'Table.TableName'
        --output text
      register: existing_data_table
      failed_when: false
      changed_when: false

    - name: Check if DynamoDB audit table exists
      command: >
        aws dynamodb describe-table
        --table-name {{ stack_name }}-audit
        --region {{ aws_region }}
        --profile {{ aws_profile }}
        --query 'Table.TableName'
        --output text
      register: existing_audit_table
      failed_when: false
      changed_when: false

    - name: Check if ECS cluster exists
      command: >
        aws ecs describe-clusters
        --clusters {{ stack_name }}-cluster
        --region {{ aws_region }}
        --profile {{ aws_profile }}
        --query 'clusters[0].clusterName'
        --output text
      register: existing_cluster
      failed_when: false
      changed_when: false

    - name: Check if CloudWatch log group exists
      command: >
        aws logs describe-log-groups
        --log-group-name-prefix /ecs/{{ stack_name }}
        --region {{ aws_region }}
        --profile {{ aws_profile }}
        --query 'logGroups[0].logGroupName'
        --output text
      register: existing_log_group
      failed_when: false
      changed_when: false

    - name: Check if VPC exists with same name tag
      command: >
        aws ec2 describe-vpcs
        --filters "Name=tag:Name,Values={{ stack_name }}-vpc"
        --region {{ aws_region }}
        --profile {{ aws_profile }}
        --query 'Vpcs[0].VpcId'
        --output text
      register: existing_vpc
      failed_when: false
      changed_when: false

- name: Display existing resources found
  debug:
    msg:
      - "Existing DynamoDB data table: {{ existing_data_table.stdout if existing_data_table.rc == 0 else 'Not found' }}"
      - "Existing DynamoDB audit table: {{ existing_audit_table.stdout if existing_audit_table.rc == 0 else 'Not found' }}"
      - "Existing ECS cluster: {{ existing_cluster.stdout if existing_cluster.rc == 0 else 'Not found' }}"
      - "Existing CloudWatch log group: {{ existing_log_group.stdout if existing_log_group.rc == 0 else 'Not found' }}"
      - "Existing VPC: {{ existing_vpc.stdout if existing_vpc.rc == 0 else 'Not found' }}"

- name: Set fact for existing resources
  set_fact:
    has_existing_resources: >-
      {{ (existing_data_table.rc == 0) or
         (existing_audit_table.rc == 0) or
         (existing_cluster.rc == 0) or
         (existing_log_group.rc == 0) or
         (existing_vpc.rc == 0) }}

- name: Use change set deployment when existing resources found
  block:
    - name: Create CloudFormation change set
      command: >
        aws cloudformation create-change-set
        --stack-name {{ stack_name }}
        --template-body file://templates/{{ cloudformation_template }}
        --parameters '{{ cf_parameters | to_json }}'
        --capabilities CAPABILITY_IAM
        --change-set-name {{ stack_name }}-changeset-{{ ansible_date_time.epoch }}
        --region {{ aws_region }}
        --profile {{ aws_profile }}
        --change-set-type {{ 'CREATE' if stack_check.rc != 0 else 'UPDATE' }}
      register: changeset_create

    - name: Wait for change set creation to complete
      command: >
        aws cloudformation wait change-set-create-complete
        --stack-name {{ stack_name }}
        --change-set-name {{ stack_name }}-changeset-{{ ansible_date_time.epoch }}
        --region {{ aws_region }}
        --profile {{ aws_profile }}

    - name: Describe change set to review changes
      command: >
        aws cloudformation describe-change-set
        --stack-name {{ stack_name }}
        --change-set-name {{ stack_name }}-changeset-{{ ansible_date_time.epoch }}
        --region {{ aws_region }}
        --profile {{ aws_profile }}
        --output json
      register: changeset_details

    - name: Display change set summary
      debug:
        msg: "{{ changeset_details.stdout | from_json }}"

    - name: Check for import actions in change set
      set_fact:
        has_import_actions: >-
          {{ (changeset_details.stdout | from_json).Changes | 
             selectattr('Action', 'equalto', 'Import') | 
             list | length > 0 }}

    - name: Display import warning if needed
      debug:
        msg: |
          WARNING: Change set contains IMPORT actions for existing resources.
          You may need to run resource import before executing this change set.
          Consider using --resource-import for resources that already exist.
      when: has_import_actions | bool

    - name: Prompt for change set execution (manual gate)
      pause:
        prompt: |
          Review the change set above. 
          Do you want to execute this change set? (yes/no)
          Changes include: {{ (changeset_details.stdout | from_json).Changes | length }} modifications
      register: execute_changeset
      when: changeset_review_required | default(true) | bool

    - name: Execute change set
      command: >
        aws cloudformation execute-change-set
        --stack-name {{ stack_name }}
        --change-set-name {{ stack_name }}-changeset-{{ ansible_date_time.epoch }}
        --region {{ aws_region }}
        --profile {{ aws_profile }}
      when: 
        - execute_changeset is not defined or execute_changeset.user_input | lower == 'yes'
        - not (changeset_review_required | default(true) | bool) or execute_changeset.user_input | lower == 'yes'

    - name: Wait for change set execution to complete
      command: >
        aws cloudformation wait stack-{{ 'create' if stack_check.rc != 0 else 'update' }}-complete
        --stack-name {{ stack_name }}
        --region {{ aws_region }}
        --profile {{ aws_profile }}
      when: 
        - execute_changeset is not defined or execute_changeset.user_input | lower == 'yes'
        - not (changeset_review_required | default(true) | bool) or execute_changeset.user_input | lower == 'yes'

  when: 
    - has_existing_resources | bool
    - use_changeset_for_existing | default(true) | bool

- name: Alternative: Resource import strategy for DynamoDB tables
  block:
    - name: Prepare resource import file
      copy:
        content: |
          [
            {
              "ResourceType": "AWS::DynamoDB::Table",
              "LogicalResourceId": "DynamoDBTable", 
              "ResourceIdentifier": {
                "TableName": "{{ stack_name }}-data"
              }
            },
            {
              "ResourceType": "AWS::DynamoDB::Table",
              "LogicalResourceId": "DynamoDBAuditTable",
              "ResourceIdentifier": {
                "TableName": "{{ stack_name }}-audit"
              }
            }
          ]
        dest: "/tmp/{{ stack_name }}-resources-to-import.json"
      when: 
        - existing_data_table.rc == 0 or existing_audit_table.rc == 0
        - use_resource_import | default(false) | bool

    - name: Create change set with resource import
      command: >
        aws cloudformation create-change-set
        --stack-name {{ stack_name }}
        --template-body file://templates/{{ cloudformation_template }}
        --parameters '{{ cf_parameters | to_json }}'
        --capabilities CAPABILITY_IAM
        --change-set-name {{ stack_name }}-import-changeset-{{ ansible_date_time.epoch }}
        --change-set-type IMPORT
        --resources-to-import file:///tmp/{{ stack_name }}-resources-to-import.json
        --region {{ aws_region }}
        --profile {{ aws_profile }}
      register: import_changeset_create
      when: 
        - existing_data_table.rc == 0 or existing_audit_table.rc == 0
        - use_resource_import | default(false) | bool

    - name: Execute import change set
      command: >
        aws cloudformation execute-change-set
        --stack-name {{ stack_name }}
        --change-set-name {{ stack_name }}-import-changeset-{{ ansible_date_time.epoch }}
        --region {{ aws_region }}
        --profile {{ aws_profile }}
      when: 
        - import_changeset_create is defined
        - use_resource_import | default(false) | bool

  when: 
    - has_existing_resources | bool
    - use_resource_import | default(false) | bool