# Fuzz targets for frank-core's parsers (#245): `make fuzz`, or
# `cargo +nightly fuzz run parse` here. Its own workspace, outside the
# main one, so `cargo test --workspace` and CI's stable builds skip it.
[package]
name = "frank-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
frank-core = { path = "../crates/frank-core" }

[workspace]
members = ["."]

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false
