AWSTemplateFormatVersion: '2010-09-09'
Description: 'FRANK S3 Buckets for data lake storage'

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, test, prod]
  ProjectName:
    Type: String
    Default: frank
  S3KeyArn:
    Type: String
    Description: ARN of the S3 KMS encryption key

Resources:
  # Raw Data Bucket
  RawDataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-raw-${AWS::AccountId}-${Environment}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref S3KeyArn
            BucketKeyEnabled: true
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: RawDataLifecycle
            Status: Enabled
            Transitions:
              - TransitionInDays: 30
                StorageClass: STANDARD_IA
              - TransitionInDays: 90
                StorageClass: GLACIER
              - TransitionInDays: 2555
                StorageClass: DEEP_ARCHIVE
            ExpirationInDays: 3653
          - Id: IncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
# Notification configuration removed - will be added later when Lambda functions are deployed
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-raw-${Environment}'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Purpose
          Value: Raw Data Storage

# Bucket policies will be added later after Lambda functions are deployed

  # Exports Bucket
  ExportsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-exports-${AWS::AccountId}-${Environment}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref S3KeyArn
            BucketKeyEnabled: true
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExportsLifecycle
            Status: Enabled
            Transitions:
              - TransitionInDays: 30
                StorageClass: STANDARD_IA
              - TransitionInDays: 60
                StorageClass: GLACIER
            ExpirationInDays: 90
          - Id: IncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-exports-${Environment}'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Purpose
          Value: Exports Storage

# Exports Bucket Policy will be added later

Outputs:
  RawDataBucketName:
    Description: Raw Data S3 Bucket Name
    Value: !Ref RawDataBucket
    Export:
      Name: !Sub '${ProjectName}-${Environment}-raw-bucket'

  RawDataBucketArn:
    Description: Raw Data S3 Bucket ARN
    Value: !GetAtt RawDataBucket.Arn
    Export:
      Name: !Sub '${ProjectName}-${Environment}-raw-bucket-arn'

  ExportsBucketName:
    Description: Exports S3 Bucket Name
    Value: !Ref ExportsBucket
    Export:
      Name: !Sub '${ProjectName}-${Environment}-exports-bucket'

  ExportsBucketArn:
    Description: Exports S3 Bucket ARN
    Value: !GetAtt ExportsBucket.Arn
    Export:
      Name: !Sub '${ProjectName}-${Environment}-exports-bucket-arn'
