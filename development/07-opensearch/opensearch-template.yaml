AWSTemplateFormatVersion: '2010-09-09'
Description: 'FRANK OpenSearch Domain'

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, test, prod]
  ProjectName:
    Type: String
    Default: frank
  OpenSearchKeyArn:
    Type: String
    Description: ARN of the OpenSearch KMS encryption key
  VPCId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID for OpenSearch domain
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnet IDs for OpenSearch domain
  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group ID for Lambda functions

Conditions:
  IsProduction: !Equals [!Ref Environment, prod]

Resources:
  # Security Group for OpenSearch
  OpenSearchSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${ProjectName}-opensearch-sg-${Environment}'
      GroupDescription: 'Security group for OpenSearch domain'
      VpcId: !Ref VPCId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref LambdaSecurityGroupId
          Description: 'HTTPS access from Lambda functions'
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref OpenSearchDashboardsSecurityGroup
          Description: 'HTTPS access from OpenSearch Dashboards'
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-opensearch-sg-${Environment}'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # Security Group for OpenSearch Dashboards access
  OpenSearchDashboardsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${ProjectName}-opensearch-dashboards-sg-${Environment}'
      GroupDescription: 'Security group for OpenSearch Dashboards access'
      VpcId: !Ref VPCId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 10.0.0.0/16
          Description: 'HTTPS access from VPC CIDR'
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-opensearch-dashboards-sg-${Environment}'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # IAM Role for OpenSearch service
  OpenSearchServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-opensearch-service-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: opensearch.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonOpenSearchServiceRolePolicy

  # IAM Role for OpenSearch master user
  OpenSearchMasterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-opensearch-master-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: sts:AssumeRole
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:role/frank-lambda-*'
            Action: sts:AssumeRole
      Policies:
        - PolicyName: OpenSearchMasterAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - es:*
                Resource: !Sub 'arn:aws:es:${AWS::Region}:${AWS::AccountId}:domain/${ProjectName}-${Environment}/*'

  # S3 Bucket for OpenSearch snapshots
  OpenSearchSnapshotBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-opensearch-snapshots-${AWS::AccountId}-${Environment}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref OpenSearchKeyArn
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldSnapshots
            Status: Enabled
            ExpirationInDays: 90
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-opensearch-snapshots-${Environment}'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # IAM Role for OpenSearch snapshots
  OpenSearchSnapshotRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-opensearch-snapshot-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: opensearch.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SnapshotBucketAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource: !GetAtt OpenSearchSnapshotBucket.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub '${OpenSearchSnapshotBucket.Arn}/*'

  # OpenSearch Domain
  OpenSearchDomain:
    Type: AWS::OpenSearch::Domain
    Properties:
      DomainName: !Sub '${ProjectName}-${Environment}'
      EngineVersion: 'OpenSearch_2.3'
      ClusterConfig:
        InstanceType: !If [IsProduction, 'm6g.large.search', 't3.small.search']
        InstanceCount: !If [IsProduction, 3, 1]
        DedicatedMasterEnabled: !If [IsProduction, true, false]
        MasterInstanceType: !If [IsProduction, 'm6g.medium.search', !Ref 'AWS::NoValue']
        MasterInstanceCount: !If [IsProduction, 3, !Ref 'AWS::NoValue']
        ZoneAwarenessEnabled: !If [IsProduction, true, false]
        ZoneAwarenessConfig: !If
          - IsProduction
          - AvailabilityZoneCount: 3
          - !Ref 'AWS::NoValue'
      EBSOptions:
        EBSEnabled: true
        VolumeType: gp3
        VolumeSize: !If [IsProduction, 100, 20]
        Iops: !If [IsProduction, 3000, !Ref 'AWS::NoValue']
      EncryptionAtRestOptions:
        Enabled: true
        KmsKeyId: !Ref OpenSearchKeyArn
      NodeToNodeEncryptionOptions:
        Enabled: true
      DomainEndpointOptions:
        EnforceHTTPS: true
        TLSSecurityPolicy: 'Policy-Min-TLS-1-2-2019-07'
      VPCOptions:
        SecurityGroupIds:
          - !Ref OpenSearchSecurityGroup
        SubnetIds: !Ref SubnetIds
      AdvancedSecurityOptions:
        Enabled: true
        InternalUserDatabaseEnabled: false
        MasterUserOptions:
          MasterUserARN: !GetAtt OpenSearchMasterRole.Arn
      LogPublishingOptions:
        SEARCH_SLOW_LOGS:
          CloudWatchLogsLogGroupArn: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/opensearch/domains/${ProjectName}-${Environment}/search-slow-logs'
          Enabled: true
        INDEX_SLOW_LOGS:
          CloudWatchLogsLogGroupArn: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/opensearch/domains/${ProjectName}-${Environment}/index-slow-logs'
          Enabled: true
        ES_APPLICATION_LOGS:
          CloudWatchLogsLogGroupArn: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/opensearch/domains/${ProjectName}-${Environment}/application-logs'
          Enabled: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-opensearch-${Environment}'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # CloudWatch Log Groups for OpenSearch
  SearchSlowLogsGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/opensearch/domains/${ProjectName}-${Environment}/search-slow-logs'
      RetentionInDays: 30

  IndexSlowLogsGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/opensearch/domains/${ProjectName}-${Environment}/index-slow-logs'
      RetentionInDays: 30

  ApplicationLogsGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/opensearch/domains/${ProjectName}-${Environment}/application-logs'
      RetentionInDays: 30

  # CloudWatch Alarms
  ClusterStatusRedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-${Environment}-opensearch-cluster-red'
      AlarmDescription: 'OpenSearch cluster status is red'
      MetricName: 'ClusterStatus.red'
      Namespace: 'AWS/ES'
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: DomainName
          Value: !Ref OpenSearchDomain
        - Name: ClientId
          Value: !Ref 'AWS::AccountId'

  ClusterStatusYellowAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-${Environment}-opensearch-cluster-yellow'
      AlarmDescription: 'OpenSearch cluster status is yellow'
      MetricName: 'ClusterStatus.yellow'
      Namespace: 'AWS/ES'
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: DomainName
          Value: !Ref OpenSearchDomain
        - Name: ClientId
          Value: !Ref 'AWS::AccountId'

  HighSearchLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-${Environment}-opensearch-high-latency'
      AlarmDescription: 'OpenSearch search latency is high'
      MetricName: 'SearchLatency'
      Namespace: 'AWS/ES'
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 5000
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: DomainName
          Value: !Ref OpenSearchDomain
        - Name: ClientId
          Value: !Ref 'AWS::AccountId'

  StorageUtilizationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-${Environment}-opensearch-storage-high'
      AlarmDescription: 'OpenSearch storage utilization is high'
      MetricName: 'StorageUtilization'
      Namespace: 'AWS/ES'
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 85
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: DomainName
          Value: !Ref OpenSearchDomain
        - Name: ClientId
          Value: !Ref 'AWS::AccountId'

Outputs:
  DomainEndpoint:
    Description: OpenSearch domain endpoint
    Value: !GetAtt OpenSearchDomain.DomainEndpoint
    Export:
      Name: !Sub '${ProjectName}-${Environment}-opensearch-endpoint'

  DomainArn:
    Description: OpenSearch domain ARN
    Value: !GetAtt OpenSearchDomain.DomainArn
    Export:
      Name: !Sub '${ProjectName}-${Environment}-opensearch-arn'

  DashboardsURL:
    Description: OpenSearch Dashboards URL
    Value: !Sub 'https://${OpenSearchDomain.DomainEndpoint}/_dashboards'
    Export:
      Name: !Sub '${ProjectName}-${Environment}-dashboards-url'

  MasterRoleArn:
    Description: OpenSearch master role ARN
    Value: !GetAtt OpenSearchMasterRole.Arn
    Export:
      Name: !Sub '${ProjectName}-${Environment}-opensearch-master-role-arn'

  SnapshotBucketName:
    Description: S3 bucket for OpenSearch snapshots
    Value: !Ref OpenSearchSnapshotBucket
    Export:
      Name: !Sub '${ProjectName}-${Environment}-opensearch-snapshot-bucket'

  SecurityGroupId:
    Description: Security group ID for OpenSearch domain
    Value: !Ref OpenSearchSecurityGroup
    Export:
      Name: !Sub '${ProjectName}-${Environment}-opensearch-sg-id'
